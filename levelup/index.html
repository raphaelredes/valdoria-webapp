        // ═══════════════════════════════════════════════

        function buildASI(el) {
            const totalPts = P.pending_asi;
            const featCost = sel.feat ? 2 : 0;
            const asiPts = totalPts - featCost;
            const allocated = Object.values(sel.asi).reduce((a, b) => a + b, 0);
            const remaining = asiPts - allocated;

            const availableFeats = getAvailableFeats();
            const hasFeats = Object.keys(availableFeats).length > 0 && totalPts >= 2;

            let html = '<div class="dm-bubble">Há um peso novo no corpo, uma destreza nas mãos, uma clareza nos olhos. Distribua o que ganhou — <i>ou prefere algo mais raro, uma graça que poucos cultivam?</i></div>';

            if (hasFeats) {
                html += `<div class="mode-toggle">
            <button class="mode-toggle-btn${asiMode === 'asi' ? ' active' : ''}" onclick="setAsiMode('asi')">Atributos</button>
            <button class="mode-toggle-btn${asiMode === 'feat' ? ' active' : ''}" onclick="setAsiMode('feat')">Talento</button>
        </div>`;
            }

            if (asiMode === 'asi') {
                html += buildASIPanel(asiPts, allocated, remaining);
            } else {
                html += buildFeatPanel(availableFeats);
            }

            el.innerHTML = html;
        }

        function buildASIPanel(asiPts, allocated, remaining) {
            let html = `<div class="asi-counter">Pontos: <b>${allocated}</b> / <b>${asiPts}</b> distribuidos</div>`;

            if (asiPts <= 0) {
                html += `<div class="empty-msg">Todos os pontos foram usados no talento selecionado.</div>`;
                return html;
            }

            html += '<div class="asi-grid">';
            const attrs = ['strength', 'dexterity', 'constitution', 'intelligence', 'wisdom', 'charisma'];
            for (const attr of attrs) {
                const base = P.stats[attr];
                const boost = sel.asi[attr] || 0;
                const val = base + boost;
                const maxed = val >= 20;

                html += `<div class="asi-card${maxed && boost === 0 ? ' maxed' : ''}">
            <div class="asi-icon">${_attrIconHtml(attr)}</div>
            <div class="asi-name">${ATTR_ABBR[attr]}</div>
            <div class="asi-value">${val}</div>
            <div class="asi-mod">(${fmtMod(val)})</div>
            <div class="asi-boost">${boost > 0 ? '+' + boost : ''}</div>
            <div class="asi-controls">
                <button class="asi-btn minus" aria-label="Diminuir ${attr}" onclick="asiChange('${attr}',-1)" ${boost <= 0 ? 'disabled' : ''}>-</button>
                <button class="asi-btn plus" aria-label="Aumentar ${attr}" onclick="asiChange('${attr}',1)" ${(remaining <= 0 || val >= 20) ? 'disabled' : ''}>+</button>
            </div>
        </div>`;
            }
            html += '</div>';
            return html;
        }

        function buildFeatPanel(availableFeats) {
            let html = '<div class="section-title">Talentos</div>';
            html += '<div class="hint">Escolher um talento consome 2 pontos de atributo</div>';

            if (sel.feat) {
                const f = FEATS[sel.feat];
                // Sess\u00e3o #26 v5: card selecionado clica pra reabrir popup \u00e9pico
                // (revis\u00e3o da escolha + op\u00e7\u00e3o remover). Removeu toggle silencioso.
                html += `<div class="choice-card selected" onclick="openFeatDetail('${sel.feat}')">
            <div class="choice-card-header">
                <div class="choice-card-icon">${_featIconHtml(_featSlug(f.name))}</div>
                <div class="choice-card-name">${f.name}</div>
                <div class="choice-card-badge badge-cost">-2 pts</div>
                <div class="choice-card-check">\u2713</div>
            </div>
        </div>`;

                if (f.stat_choice) {
                    html += '<div class="section-title">Escolha do Atributo</div>';
                    for (const attr of f.stat_choice) {
                        const curVal = P.stats[attr];
                        const amt = f.stat_amount || 1;
                        if (curVal + amt > 20) continue;
                        const isSel = sel.featStat === attr;
                        html += `<div class="choice-card${isSel ? ' selected' : ''}" onclick="selectFeatStat('${attr}')">
                    <div class="choice-card-header">
                        <div class="choice-card-icon">${_attrIconHtml(attr)}</div>
                        <div class="choice-card-name">${ATTR_PT[attr]} (${curVal} \u2192 ${curVal + amt})</div>
                        <div class="choice-card-check">${isSel ? '\u2713' : ''}</div>
                    </div>
                </div>`;
                    }
                }

                html += `<button class="v-btn v-btn-secondary" style="width:100%;margin-top: var(--v-space-lg, 12px)" onclick="selectFeat('')">Remover Talento</button>`;
            } else {
                const featEntries = Object.entries(availableFeats);
                if (featEntries.length === 0) {
                    html += '<div class="empty-msg">Nenhum talento disponível para sua classe.</div>';
                } else {
                    html += '<div class="feat-scroll-list">';
                    for (const [fid, f] of featEntries) {
                        // Sessão #26 v5: clicar no card abre o popup épico de
                        // confirmação direto (não seleciona silenciosamente).
                        // Botão (i) redundante removido — card inteiro é a CTA.
                        html += `<div class="choice-card" onclick="openFeatDetail('${fid}')">
                    <div class="choice-card-header">
                        <div class="choice-card-icon">${_featIconHtml(_featSlug(f.name))}</div>
                        <div class="choice-card-name">${f.name}</div>
                        <div class="choice-card-badge badge-cost">-2 pts</div>
                        <div class="choice-card-chevron">▸</div>
                    </div>
                </div>`;
                    }
                    html += '</div>';
                }
            }

            return html;
        }

        // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
        // Talento \u2014 POPUP \u00c9PICO de confirma\u00e7\u00e3o (sess\u00e3o #26 v5)
        // User: 'mostrar o popup \u00e9pico de confirma\u00e7\u00e3o com descri\u00e7\u00e3o
        // detalhada do talento e a imagem gerada grande'
        // Layout: hero PNG ~140px com aura dourada -> nome ornado ->
        // descri\u00e7\u00e3o -> blocos efeito/b\u00f4nus/req -> CTA confirmar grande.
        // \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
        function openFeatDetail(fid) {
            const f = FEATS[fid];
            if (!f) return;
            const slug = _featSlug(f.name);
            const pngSrc = '../shared/img/feats/' + slug + '.webp';
            const isSel = sel.feat === fid;

            let html = `<button class="lu-sub-back" onclick="closeSubScreen()">\u25c0 Voltar</button>`;

            // HERO: imagem grande com aura dourada + animacao de entrada
            html += `<div class="feat-hero">
                <div class="feat-hero-glow"></div>
                <div class="feat-hero-rays"></div>
                <img class="feat-hero-img" src="${pngSrc}" alt="${f.name}"
                     onerror="this.style.display='none'; this.parentNode.classList.add('no-png')">
                <div class="feat-hero-medal-fallback"></div>
            </div>`;
            html += `<div class="feat-hero-name">${f.name}</div>`;
            html += `<div class="feat-hero-divider">\u27e1 Talento \u27e1</div>`;
            html += `<div class="feat-hero-desc">${f.desc}</div>`;

            // Blocos de detalhes estruturados
            if (f.effect) {
                html += `<div class="feat-detail-block">
                    <div class="feat-detail-label">Efeito mecânico</div>
                    <div class="feat-detail-value">${f.effect}</div>
                </div>`;
            }
            if (f.stat_choice) {
                const amt = f.stat_amount || 1;
                const opts = f.stat_choice.map(a => `<span class="feat-stat-pill">${_attrIconHtml(a)} ${ATTR_PT[a]}</span>`).join(' ou ');
                html += `<div class="feat-detail-block">
                    <div class="feat-detail-label">Bônus de atributo</div>
                    <div class="feat-detail-value">+${amt} em ${opts}</div>
                </div>`;
            }
            if (f.req_spellcaster) {
                html += `<div class="feat-detail-block feat-detail-warn">
                    <div class="feat-detail-label">Requisito</div>
                    <div class="feat-detail-value">Classe conjuradora</div>
                </div>`;
            }
            html += `<div class="feat-detail-block feat-detail-cost">
                <div class="feat-detail-label">Custo</div>
                <div class="feat-detail-value">-2 pontos de atributo</div>
            </div>`;

            // CTA confirmação grande (ou remover se já selecionado)
            if (isSel) {
                html += `<button class="v-btn v-btn-secondary feat-cta" style="width:100%;margin-top:18px"
            onclick="selectFeat(''); closeSubScreen()">↩ Remover Talento</button>`;
            } else {
                html += `<button class="v-btn v-btn-primary feat-cta" style="width:100%;margin-top:18px"
            onclick="selectFeat('${fid}'); closeSubScreen()">✓ Confirmar ${f.name}</button>`;
            }

            openSubScreen(html);
        }

        function getAvailableFeats() {
            const result = {};
            const nonCasters = ['WARRIOR', 'ROGUE', 'BARBARIAN'];
            for (const [fid, f] of Object.entries(FEATS)) {
                if (P.feats.includes(fid)) continue;
                if (f.req_spellcaster && nonCasters.includes(P.hero_class)) continue;
                result[fid] = f;
            }
            return result;
        }

        function setAsiMode(mode) {
            asiMode = mode;
            _rebuildCurrentScreen();
        }

        function asiChange(attr, delta) {
            haptic('light');
            const boost = (sel.asi[attr] || 0) + delta;
            const val = P.stats[attr] + boost;
            if (boost < 0 || val > 20) return;

            const featCost = sel.feat ? 2 : 0;
            const asiPts = P.pending_asi - featCost;
            const totalAllocated = Object.values(sel.asi).reduce((a, b) => a + b, 0) + delta;
            if (totalAllocated > asiPts || totalAllocated < 0) return;

            if (boost === 0) { delete sel.asi[attr]; } else { sel.asi[attr] = boost; }

            _rebuildCurrentScreen();
        }

        function selectFeat(fid) {
            haptic('medium');
            if (sel.feat === fid) {
                sel.feat = ''; sel.featStat = '';
            } else {
                sel.feat = fid; sel.featStat = '';
                const featCost = fid ? 2 : 0;
                const asiPts = P.pending_asi - featCost;
                const allocated = Object.values(sel.asi).reduce((a, b) => a + b, 0);
                if (allocated > asiPts) { sel.asi = {}; }
            }
            _rebuildCurrentScreen();
        }

        function selectFeatStat(attr) {
            haptic('light');
            sel.featStat = sel.featStat === attr ? '' : attr;
            _rebuildCurrentScreen();
        }

        function validateASI() {
            const featCost = sel.feat ? 2 : 0;
            const asiPts = P.pending_asi - featCost;
            const allocated = Object.values(sel.asi).reduce((a, b) => a + b, 0);

            if (sel.feat) {
                const f = FEATS[sel.feat];
                if (f && f.stat_choice && !sel.featStat) {
                    return 'Escolha o atributo para o talento';
                }
            }

            if (allocated !== asiPts) {
                return `Distribua todos os ${asiPts} pontos de atributo (faltam ${asiPts - allocated})`;
            }
            return null;
        }

        // ═══════════════════════════════════════════════
        // SCREEN: SKILLS (compact rows)
        // ═══════════════════════════════════════════════
        function buildSkills(el) {
            const available = getAvailableSkills();
            const needed = Math.min(P.pending_skills, available.length);
            const info = CLASS_INFO[P.hero_class] || { resource: 'MP' };

            let html = `<div class="dm-bubble">Treinos antigos voltam. Movimentos que você viu mestres fazerem, e que agora <i>seus próprios músculos lembram.</i> Escolha o que praticará daqui em diante.</div>`;
            html += `<div class="section-title">${_catIconHtml('habilidades')} Habilidades</div>`;
            html += `<div class="asi-counter">Selecionadas: <b>${sel.skills.length}</b> / <b>${needed}</b></div>`;

            // Sess\u00e3o #26 v2 (user request): ao clicar, abre detail+confirm direto.
            // Removido toggle silencioso + bot\u00e3o (i) redundante. Comportamento agora:
            // clica row \u2192 v\u00ea descri\u00e7\u00e3o completa + custo + dano \u2192 confirma na sub-screen.
            for (const s of available) {
                const isSel = sel.skills.includes(s.id);
                const _slug = _skillSlug(s.name);
                html += `<div class="skill-compact${isSel ? ' selected' : ''}" onclick="openSkillDetail('${s.id}')">
            <div class="skill-compact-check">${isSel ? '\u2713' : ''}</div>
            <span class="skill-compact-icon">${_skillIconHtml(_slug)}</span>
            <span class="skill-compact-name">${s.name}</span>
            ${s.passive ? '<span class="choice-card-badge badge-passive">Passiva</span>' :
                        `<span class="choice-card-badge badge-cost">${s.cost} ${info.resource}</span>`}
        </div>`;
            }

            if (available.length === 0) {
                html += '<div class="empty-msg">Nenhuma habilidade disponível para escolher.</div>';
            }

            el.innerHTML = html;
        }

        function openSkillDetail(sid) {
            const available = getAvailableSkills();
            const s = available.find(sk => sk.id === sid);
            if (!s) return;
            const info = CLASS_INFO[P.hero_class] || { resource: 'MP' };
            const _slug = _skillSlug(s.name);

            // Sess\u00e3o #26 v8 user request: 'fa\u00e7a a tela popup de habilidades
            // ser t\u00e3o \u00e9pica quanto a tela de talentos'. Mesmo layout do
            // openFeatDetail \u2014 hero PNG 140px + aura + raios + blocos.
            const dmg = calcDmgRange(s.effect);
            const isSel = sel.skills.includes(sid);
            const pngSrc = '../shared/img/combat/skills/' + _slug + '.webp';

            let html = `<button class="lu-sub-back" onclick="closeSubScreen()">\u25c0 Voltar</button>`;

            // HERO: PNG grande com aura dourada + raios cinematic
            html += `<div class="feat-hero">
                <div class="feat-hero-glow"></div>
                <div class="feat-hero-rays"></div>
                <img class="feat-hero-img" src="${pngSrc}" alt="${s.name}"
                     onerror="this.style.display='none'; this.parentNode.classList.add('no-png')">
                <div class="feat-hero-medal-fallback"></div>
            </div>`;
            html += `<div class="feat-hero-name">${s.name}</div>`;
            html += `<div class="feat-hero-divider">\u27e1 Habilidade \u27e1</div>`;

            html += `<div class="skill-meta-pills">`;
            if (s.passive) {
                html += '<span class="choice-card-badge badge-passive">Passiva</span>';
            } else {
                html += `<span class="choice-card-badge badge-cost">${s.cost} ${info.resource}</span>`;
            }
            html += `<span class="choice-card-badge badge-level">Nível ${s.level}</span>`;
            if (dmg) html += `<span class="choice-card-badge" style="background:rgba(228,68,85,0.15);color:#e45">${dmg} dano</span>`;
            html += '</div>';

            // Efeito mec\u00e2nico em bloco estruturado
            // 2026-05-23 (user request sess\u00e3o #27): emoji-tag prefix do effect agora
            // \u00e9 renderizado como PNG her\u00e1ldico AAA (em vez de emoji do sistema).
            if (s.effect) {
                html += `<div class="feat-detail-block">
                    <div class="feat-detail-label">Efeito</div>
                    <div class="feat-detail-value">${_renderEffectWithIcon(s.effect)}</div>
                </div>`;
            }
            // Descri\u00e7\u00e3o narrativa centralizada (mesmo estilo feat-hero-desc)
            if (s.desc) {
                html += `<div class="feat-hero-desc">${s.desc}</div>`;
            }
            // Texto t\u00e9cnico D&D 5e em bloco diferenciado
            if (s.tech) {
                html += `<div class="feat-detail-block" style="background:rgba(0,0,0,0.30)">
                    <div class="feat-detail-label">Regras D&D 5e</div>
                    <div class="feat-detail-value" style="font-style:italic;color:var(--v-text-dim, #a09484)">${s.tech}</div>
                </div>`;
            }

            // Sess\u00e3o #26 v5: badges de elementos + status detectados no texto da skill
            const _combined = [s.effect || '', s.desc || '', s.tech || ''].join(' ');
            html += _renderElementBadges(_combined);
            html += _renderStatusBadges(_combined);

            // CTA grande no rodap\u00e9 (mesmo padr\u00e3o do feat-cta)
            const needed = Math.min(P.pending_skills, available.length);
            const atCapacity = !isSel && sel.skills.length >= needed;
            if (atCapacity) {
                html += `<div class="feat-detail-block feat-detail-warn" style="margin-top:18px">
                    <div class="feat-detail-label">Capacidade atingida</div>
                    <div class="feat-detail-value">J\u00e1 escolheu ${needed} habilidade${needed>1?'s':''}. Remova uma antes de pegar esta.</div>
                </div>`;
                html += `<button class="v-btn v-btn-secondary feat-cta" style="width:100%;margin-top: var(--v-space-lg, 12px)" onclick="closeSubScreen()">Voltar</button>`;
            } else if (isSel) {
                html += `<button class="v-btn v-btn-secondary feat-cta" style="width:100%;margin-top:18px"
            onclick="toggleSkill('${sid}'); closeSubScreen()">\u21a9 Remover Habilidade</button>`;
            } else {
                html += `<button class="v-btn v-btn-primary feat-cta" style="width:100%;margin-top:18px"
            onclick="toggleSkill('${sid}'); closeSubScreen()">\u2713 Confirmar ${s.name}</button>`;
            }

            openSubScreen(html);
        }

        function toggleSkill(sid) {
            haptic('light');
            const idx = sel.skills.indexOf(sid);
            const available = getAvailableSkills();
            const needed = Math.min(P.pending_skills, available.length);

            if (idx >= 0) {
                sel.skills.splice(idx, 1);
            } else {
                if (sel.skills.length >= needed) {
                    _showValidation(`Você só pode escolher ${needed} habilidade(s)`);
                    return;
                }
                sel.skills.push(sid);
            }

            _rebuildCurrentScreen();
        }

        function validateSkills() {
            const available = getAvailableSkills();
            const needed = Math.min(P.pending_skills, available.length);
            if (sel.skills.length !== needed) {
                return `Escolha ${needed} habilidade(s) (faltam ${needed - sel.skills.length})`;
            }
            return null;
        }

        // ═══════════════════════════════════════════════
        // SCREEN: REVIEW
        // ═══════════════════════════════════════════════
        function buildReview(el) {
            const info = CLASS_INFO[P.hero_class] || { name: 'Aventureiro', resource: 'MP' };
            let html = `<div class="dm-bubble">Olhe o que escolheu. <i>O caminho fica registrado em quem voc\u00ea \u00e9, daqui em diante.</i> Confirma?</div>`;
            html += `<div class="section-title">Resumo da Subida de N\u00edvel</div>`;

            // HP/MP gains
            html += `<div class="review-section">
        <div class="review-section-title">Vitalidade</div>`;
            if (P.hp_gain) {
                html += `<div class="review-row"><span class="review-label">HP</span>
        <span class="review-value">${P.max_hp - P.hp_gain} <span class="arrow">\u2192</span> <span class="changed">${P.max_hp}</span></span></div>`;
            }
            if (P.mp_gain) {
                html += `<div class="review-row"><span class="review-label">${info.resource}</span>
        <span class="review-value">${P.max_mp - P.mp_gain} <span class="arrow">\u2192</span> <span class="changed">${P.max_mp}</span></span></div>`;
            }
            html += '</div>';

            if (P.needs_subclass && sel.subclass) {
                const subs = SUBCLASSES[P.hero_class] || {};
                const sc = subs[sel.subclass];
                html += `<div class="review-section">
            <div class="review-section-title">${_catIconHtml('subclasse')} Subclasse</div>
            <div class="review-row"><span class="review-label">Escolha:</span>
            <span class="review-value"><span class="changed">${sc ? sc.name : sel.subclass}</span> <span class="new-badge">Novo</span></span></div>
        </div>`;
            }

            if (sel.feat) {
                const f = FEATS[sel.feat];
                html += `<div class="review-section">
            <div class="review-section-title">Talento</div>
            <div class="review-row"><span class="review-label">Escolha:</span>
            <span class="review-value"><span class="changed">${f ? f.name : sel.feat}</span> <span class="new-badge">Novo</span></span></div>`;
                if (sel.featStat) {
                    const amt = f?.stat_amount || 1;
                    html += `<div class="review-row"><span class="review-label">Bonus:</span>
            <span class="review-value"><span class="changed">+${amt} ${ATTR_PT[sel.featStat]}</span></span></div>`;
                }
                html += `<div class="review-row"><span class="review-label">Custo:</span>
            <span class="review-value" style="color:#e45">-2 pontos de atributo</span></div>
        </div>`;
            }

            const asiEntries = Object.entries(sel.asi).filter(([_, v]) => v > 0);
            if (asiEntries.length > 0) {
                html += `<div class="review-section">
            <div class="review-section-title">${_catIconHtml('atributos')} Atributos</div>`;
                for (const [attr, boost] of asiEntries) {
                    const before = P.stats[attr];
                    const after = before + boost;
                    html += `<div class="review-row">
                <span class="review-label">${_attrIconHtml(attr)} ${ATTR_PT[attr]}</span>
                <span class="review-value">${before} <span class="arrow">\u2192</span> <span class="changed">${after}</span> (${fmtMod(after)})</span>
            </div>`;
                }
                html += '</div>';
            }

            if (sel.skills.length > 0) {
                html += `<div class="review-section">
            <div class="review-section-title">${_catIconHtml('habilidades')} Habilidades</div>`;
                const pool = CLASS_SKILLS[P.hero_class] || {};
                for (const sid of sel.skills) {
                    let sName = sid;
                    for (const skills of Object.values(pool)) {
                        const found = skills.find(s => s.id === sid);
                        if (found) { sName = found.name; break; }
                    }
                    html += `<div class="review-row"><span class="review-label">${_skillIconHtml(_skillSlug(sName))}</span>
            <span class="review-value"><span class="changed">${sName}</span> <span class="new-badge">Novo</span></span></div>`;
                }
                html += '</div>';
            }

            html += '<div class="hint" style="margin-top: var(--v-space-lg, 12px)">Confirme suas escolhas para finalizar a subida de nível</div>';
            el.innerHTML = html;
        }

        // ═══════════════════════════════════════════════
        // SUBMIT
        // ═══════════════════════════════════════════════
        function resetSubmitState() {
            _submitted = false;
            var btn = document.getElementById('btnNext');
            btn.disabled = false;
            btn.textContent = 'Confirmar Subida';
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        var _submitted = false;
        function submit() {
            if (_submitted) return;
            _submitted = true;
            haptic('medium');
            const asiChoices = [];
            for (const [attr, count] of Object.entries(sel.asi)) {
                for (let i = 0; i < count; i++) asiChoices.push(attr);
            }

            const payload = {
                action: 'levelup_complete',
                token: token,
                asi_choices: asiChoices,
                skill_choices: sel.skills,
                subclass: sel.subclass,
                feat: sel.feat,
                feat_stat: sel.featStat,
            };

            // Show loading overlay
            const btn = document.getElementById('btnNext');
            btn.disabled = true;
            btn.textContent = 'Enviando...';
            document.getElementById('loadingOverlay').classList.add('active');

            try {
                if (apiFallback) {
                    payload.user_id = parseInt(userId);
                    // Resiliência (sessão #82 — quebra o loop de level-up): o token de
                    // level-up é efêmero e o bot pode reiniciar antes do "Confirmar".
                    // Enviamos também a SESSÃO DE JOGO persistente (valdoria_session_<env>)
                    // como prova de identidade; o servidor aplica via autoridade do DB se
                    // o token efêmero tiver sido perdido. Sem isto: 401 → "sessão expirada"
                    // → reabre → level-up de novo (loop reportado pelo jogador).
                    try {
                        var _env = (location.hostname.indexOf('dev.') === 0 || /[?&]env=dev/.test(location.search)) ? 'dev' : 'prod';
                        var _gs = JSON.parse(localStorage.getItem('valdoria_session_' + _env) || 'null');
                        if (_gs && _gs.token && (!userId || String(_gs.user_id) === String(userId))) {
                            payload.game_session = _gs.token;
                        }
                    } catch (_e) {}
                    const _lh = {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    };
                    if (window.Telegram?.WebApp?.initData) { _lh['X-Telegram-Init-Data'] = Telegram.WebApp.initData; }
                    _lh['X-Idempotency-Key'] = crypto.randomUUID();
                    fetchT(apiFallback + '/api/levelup/apply', {
                        method: 'POST',
                        headers: _lh,
                        body: JSON.stringify(payload)
                    }).then(res => {
                        if (res.status === 401 || res.status === 403) {
                            console.error('[LEVELUP] Auth error on apply:', res.status);
                            resetSubmitState();
                            showFatalError('Sess\u00e3o expirada. Feche esta janela e reabra o jogo.');
                            return null;
                        }
                        return res.json();
                    }).then(data => {
                            if (!data) return;
                            if (data.status === 'saved' || data.ok) {
                                // Navigate to return URL if provided (webapp transition)
                                if (data.return_url) {
                                    window.__valdoria_transitioning = true; window.location.replace(data.return_url);
                                } else if (returnTo && apiFallback && token) {
                                    // Use transition API to return to origin webapp
                                    _levelupTransitionBack();
                                } else if (tg && tg.close) {
                                    tg.close();
                                } else {
                                    alert('Subida de nível confirmada!');
                                }
                            } else {
                                resetSubmitState();
                                showFatalError('Erro ao aplicar nível: ' + (data.error || 'Desconhecido'));
                            }
                        }).catch(function(e) {
                            resetSubmitState();
                            showFatalError('Erro de conexao com servidor.', e);
                        });
                }
                else if (tg && tg.sendData) {
                    setTimeout(() => {
                        tg.sendData(JSON.stringify(payload));
                        // Safety: close webapp if sendData didn't auto-close
                        setTimeout(() => { try { tg.close(); } catch (e) { console.warn('[LEVELUP] tg.close:', e); } }, 300);
                    }, 300);
                    setTimeout(function() {
                        if (document.visibilityState !== 'hidden') { resetSubmitState(); }
                    }, 5000);
                } else {
                    console.log('Level-up payload:', JSON.stringify(payload, null, 2));
                    setTimeout(function() {
                        resetSubmitState();
                        alert('Subida de nível confirmada! (modo teste)\n\n' + JSON.stringify(payload, null, 2));
                    }, 800);
                }
            } catch (e) {
                resetSubmitState();
                showFatalError('Erro ao enviar dados. Tente novamente.', e);
            }
        }
    </script>
</body>

</html>
