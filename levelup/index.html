    <style>
        /* ─── Popup Card Layout ─── */
        .lu-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: var(--v-z-base, 1); }
        .lu-card { position: relative; width: 95%; max-width: 400px; max-height: 88dvh; background: var(--v-bg-card, #2e2520); border: 1px solid rgba(196,149,58,0.3); border-radius: var(--v-radius-lg, 14px); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 60px rgba(196,149,58,0.08); }
        .lu-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--v-border, #4a3828); background: linear-gradient(180deg, rgba(196,149,58,0.1) 0%, transparent 100%); flex-shrink: 0; }
        .lu-back { background: none; border: none; color: var(--v-gold, #c4953a); font-size: 16px; cursor: pointer; padding: 4px 8px; -webkit-tap-highlight-color: transparent; transition: opacity 0.2s; }
        .lu-back:active { opacity: 0.5; }
        .lu-back.hidden { visibility: hidden; pointer-events: none; }
        .lu-title { flex: 1; font-size: 15px; font-weight: 700; color: var(--v-gold, #c4953a); text-transform: uppercase; letter-spacing: 1px; }
        .lu-dots { display: flex; gap: 6px; align-items: center; }
        .lu-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--v-border, #4a3828); transition: all 0.2s; }
        .lu-dot.active { background: var(--v-gold, #c4953a); box-shadow: 0 0 6px rgba(196,149,58,0.5); }
        .lu-dot.done { background: #4a9; }
        .lu-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px; }
        .lu-body > div { animation: luFadeIn 250ms ease; }
        @keyframes luFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .lu-footer { padding: 10px 12px; border-top: 1px solid var(--v-border, #4a3828); flex-shrink: 0; background: var(--v-bg-card, #2e2520); }
        .lu-footer .v-btn { width: 100%; }
        .lu-sub { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--v-bg-card, #2e2520); transform: translateX(100%); transition: transform 0.25s ease-out; z-index: var(--v-z-sticky, 10); display: flex; flex-direction: column; }
        .lu-sub.active { transform: translateX(0); }
        .lu-sub-content { flex: 1; padding: 10px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        .lu-sub-back { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--v-gold, #c4953a); font-size: 14px; font-weight: 600; cursor: pointer; padding: 12px 10px 8px; -webkit-tap-highlight-color: transparent; }

        /* ─── Cinematic Level Up Banner — AAA (sessão #26 2026-05-22) ─── */
        .lvl-cinema {
            position: relative;
            text-align: center;
            padding: 18px 14px 14px;
            margin: -10px -10px 14px;
            background: radial-gradient(ellipse at center top, rgba(196,149,58,0.22) 0%, rgba(196,149,58,0.06) 35%, transparent 70%),
                        linear-gradient(180deg, rgba(40,28,16,0.95) 0%, var(--v-bg-card, #2e2520) 100%);
            border-bottom: 1px solid var(--v-gold-30, rgba(196,149,58,0.3));
            overflow: hidden;
            isolation: isolate;
            min-height: 260px;
        }

        /* Class accent — overrides --lvl-accent for hero glow and aura colors */
        .lvl-cinema[data-class="bardo"]       { --lvl-accent: #d061b5; --lvl-accent-rgb: 208,97,181; }
        .lvl-cinema[data-class="mago"]        { --lvl-accent: #5b9dba; --lvl-accent-rgb: 91,157,186; }
        .lvl-cinema[data-class="clerigo"]     { --lvl-accent: #f4d896; --lvl-accent-rgb: 244,216,150; }
        .lvl-cinema[data-class="guerreiro"]   { --lvl-accent: #d05a3a; --lvl-accent-rgb: 208,90,58; }
        .lvl-cinema[data-class="patrulheiro"] { --lvl-accent: #7dba5b; --lvl-accent-rgb: 125,186,91; }
        .lvl-cinema[data-class="paladino"]    { --lvl-accent: #ffd560; --lvl-accent-rgb: 255,213,96; }
        .lvl-cinema[data-class="barbaro"]     { --lvl-accent: #a04030; --lvl-accent-rgb: 160,64,48; }
        .lvl-cinema[data-class="ladino"]      { --lvl-accent: #888888; --lvl-accent-rgb: 136,136,136; }
        .lvl-cinema[data-class="feiticeiro"]  { --lvl-accent: #d04a4a; --lvl-accent-rgb: 208,74,74; }
        .lvl-cinema[data-class="bruxo"]       { --lvl-accent: #a060d0; --lvl-accent-rgb: 160,96,208; }
        .lvl-cinema[data-class="druida"]      { --lvl-accent: #5ba07d; --lvl-accent-rgb: 91,160,125; }
        .lvl-cinema[data-class="monge"]       { --lvl-accent: #d4b86a; --lvl-accent-rgb: 212,184,106; }
        .lvl-cinema { --lvl-accent: var(--v-gold, #c4953a); --lvl-accent-rgb: 196,149,58; }

        /* Backdrop aura burst PNG (OpenAI gpt-image-2 quality=low + rembg) — divine column light */
        .lvl-cinema-aura {
            position: absolute;
            left: 50%;
            top: -5%;
            transform: translateX(-50%);
            width: 360px;
            height: 360px;
            background-image: url('../shared/img/levelup/aura-burst.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center top;
            opacity: 0.42;
            mix-blend-mode: screen;
            z-index: 0;
            pointer-events: none;
            animation: lvlAuraBreath 4s ease-in-out infinite;
        }
        @keyframes lvlAuraBreath {
            0%, 100% { opacity: 0.38; transform: translateX(-50%) scale(1); }
            50%      { opacity: 0.55; transform: translateX(-50%) scale(1.05); }
        }

        /* Magic circle PNG behind portrait (rotating slowly) */
        .lvl-cinema-magic-circle {
            position: absolute;
            top: 0px;
            left: 50%;
            width: 200px;
            height: 200px;
            margin-left: -100px;
            background-image: url('../shared/img/levelup/magic-circle.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.55;
            mix-blend-mode: screen;
            z-index: 2;
            pointer-events: none;
            animation: lvlMagicCircleRotate 45s linear infinite;
            filter: drop-shadow(0 0 12px rgba(var(--lvl-accent-rgb), 0.4));
        }
        @keyframes lvlMagicCircleRotate { to { transform: rotate(360deg); } }

        /* Divine light rays from above (animated) */
        .lvl-cinema-rays {
            position: absolute;
            inset: -20% -20% 30% -20%;
            background: conic-gradient(from 180deg at 50% 0%,
                transparent 0deg,
                rgba(var(--lvl-accent-rgb), 0.12) 20deg,
                transparent 40deg,
                rgba(var(--lvl-accent-rgb), 0.08) 60deg,
                transparent 80deg,
                rgba(var(--lvl-accent-rgb), 0.15) 100deg,
                transparent 120deg,
                rgba(var(--lvl-accent-rgb), 0.06) 140deg,
                transparent 180deg,
                rgba(var(--lvl-accent-rgb), 0.12) 220deg,
                transparent 260deg,
                rgba(var(--lvl-accent-rgb), 0.08) 300deg,
                transparent 360deg);
            mask: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 75%);
            -webkit-mask: radial-gradient(ellipse at 50% 0%, #000 0%, transparent 75%);
            opacity: 0.85;
            animation: lvlRaysRotate 22s linear infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes lvlRaysRotate { to { transform: rotate(360deg); } }

        /* Ascending gold particles (CSS-only, 8 dots) */
        .lvl-cinema-particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }
        .lvl-cinema-particles::before,
        .lvl-cinema-particles::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(circle at 12% 90%, rgba(var(--lvl-accent-rgb), 0.9) 0px, transparent 1.5px),
                radial-gradient(circle at 28% 92%, rgba(var(--lvl-accent-rgb), 0.7) 0px, transparent 1.2px),
                radial-gradient(circle at 45% 88%, rgba(var(--lvl-accent-rgb), 0.95) 0px, transparent 2px),
                radial-gradient(circle at 60% 94%, rgba(var(--lvl-accent-rgb), 0.6) 0px, transparent 1.3px),
                radial-gradient(circle at 76% 89%, rgba(var(--lvl-accent-rgb), 0.85) 0px, transparent 1.8px),
                radial-gradient(circle at 88% 93%, rgba(var(--lvl-accent-rgb), 0.7) 0px, transparent 1.4px);
            animation: lvlParticlesUp 6s linear infinite;
        }
        .lvl-cinema-particles::after {
            animation-delay: -3s;
            opacity: 0.65;
        }
        @keyframes lvlParticlesUp {
            from { transform: translateY(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 0.6; }
            to   { transform: translateY(-260px); opacity: 0; }
        }

        /* Rune ring around portrait (rotating) */
        .lvl-cinema-rune-ring {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 138px;
            height: 138px;
            border-radius: 50%;
            border: 1px dashed rgba(var(--lvl-accent-rgb), 0.45);
            box-shadow: 0 0 18px rgba(var(--lvl-accent-rgb), 0.18) inset, 0 0 24px rgba(var(--lvl-accent-rgb), 0.12);
            animation: lvlRuneRotate 30s linear infinite;
            z-index: 3;
            pointer-events: none;
        }
        .lvl-cinema-rune-ring::before,
        .lvl-cinema-rune-ring::after {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            border: 1px solid rgba(var(--lvl-accent-rgb), 0.18);
        }
        .lvl-cinema-rune-ring::after {
            inset: -8px;
            border: 1px solid rgba(var(--lvl-accent-rgb), 0.08);
            animation: lvlRunePulse 3s ease-in-out infinite;
        }
        @keyframes lvlRuneRotate { to { transform: translateX(-50%) rotate(360deg); } }
        @keyframes lvlRunePulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50%      { transform: scale(1.08); opacity: 0.85; }
        }

        /* Hero portrait (class PNG) — glowing aura, scale-pulse */
        .lvl-cinema-portrait {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--lvl-accent);
            box-shadow: 0 0 36px rgba(var(--lvl-accent-rgb), 0.55),
                        0 0 18px rgba(var(--lvl-accent-rgb), 0.3) inset,
                        0 6px 22px rgba(0,0,0,0.55);
            z-index: 4;
            background: rgba(20, 14, 10, 0.4);
            animation: lvlPortraitPulse 2.4s ease-in-out infinite;
        }
        .lvl-cinema-portrait img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: drop-shadow(0 0 6px rgba(var(--lvl-accent-rgb), 0.6));
        }
        @keyframes lvlPortraitPulse {
            0%, 100% { box-shadow: 0 0 28px rgba(var(--lvl-accent-rgb), 0.45),
                                  0 0 14px rgba(var(--lvl-accent-rgb), 0.25) inset,
                                  0 6px 22px rgba(0,0,0,0.55); }
            50%      { box-shadow: 0 0 48px rgba(var(--lvl-accent-rgb), 0.75),
                                  0 0 22px rgba(var(--lvl-accent-rgb), 0.45) inset,
                                  0 6px 22px rgba(0,0,0,0.55); }
        }

        /* Tier medal badge (bronze/silver/gold/platinum/mithral) */
        .lvl-cinema-medal {
            position: absolute;
            top: 100px;
            left: calc(50% + 38px);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0,0,0,0.6);
            border: 2px solid var(--lvl-accent);
            box-shadow: 0 0 14px rgba(var(--lvl-accent-rgb), 0.55), 0 3px 10px rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center;
            z-index: 5;
            animation: lvlMedalDrop 800ms cubic-bezier(0.34, 1.56, 0.64, 1) 350ms backwards;
        }
        .lvl-cinema-medal img { width: 40px; height: 40px; object-fit: contain; }
        @keyframes lvlMedalDrop {
            0%   { transform: translateY(-100px) scale(0.5) rotate(-180deg); opacity: 0; }
            70%  { transform: translateY(8px) scale(1.1) rotate(10deg); opacity: 1; }
            100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
        }

        /* Massive level number — reveal with scale burst */
        .lvl-cinema-level {
            position: relative;
            font-family: 'Cinzel', serif;
            font-size: clamp(56px, 16vw, 80px);
            font-weight: 800;
            color: var(--lvl-accent);
            text-shadow: 0 0 28px rgba(var(--lvl-accent-rgb), 0.7),
                         0 0 12px rgba(var(--lvl-accent-rgb), 0.9),
                         0 4px 8px rgba(0, 0, 0, 0.8);
            line-height: 1;
            margin-top: 14px;
            letter-spacing: 0.05em;
            z-index: 6;
            animation: lvlNumberReveal 900ms cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }
        @keyframes lvlNumberReveal {
            0%   { transform: scale(0.2) rotate(-15deg); opacity: 0; filter: blur(10px); }
            60%  { transform: scale(1.15) rotate(0deg); opacity: 1; filter: blur(0); }
            100% { transform: scale(1); }
        }

        .lvl-cinema-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--v-text);
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8), 0 0 12px rgba(var(--lvl-accent-rgb), 0.4);
            position: relative;
            z-index: 6;
            animation: lvlSubReveal 700ms ease 600ms backwards;
        }
        .lvl-cinema-title::before,
        .lvl-cinema-title::after {
            content: '◆';
            color: var(--lvl-accent);
            opacity: 0.7;
            margin: 0 8px;
            font-size: 10px;
        }
        @keyframes lvlSubReveal {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .lvl-cinema-class {
            font-size: 11px;
            color: var(--v-text-dim);
            margin-top: 4px;
            font-style: italic;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 6;
            animation: lvlSubReveal 700ms ease 750ms backwards;
        }
        .lvl-cinema-class b {
            color: var(--lvl-accent);
            font-style: normal;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(var(--lvl-accent-rgb), 0.4);
        }

        /* Performance-tier guards */
        body.perf-lite .lvl-cinema-rays,
        body.perf-lite .lvl-cinema-particles,
        body.perf-lite .lvl-cinema-rune-ring::after {
            display: none;
        }
        body.perf-lite .lvl-cinema-portrait {
            animation: none;
        }
        @media (prefers-reduced-motion: reduce) {
            .lvl-cinema-rays,
            .lvl-cinema-particles::before,
            .lvl-cinema-particles::after,
            .lvl-cinema-rune-ring,
            .lvl-cinema-rune-ring::after,
            .lvl-cinema-portrait,
            .lvl-cinema-level,
            .lvl-cinema-title,
            .lvl-cinema-class,
            .lvl-cinema-medal { animation: none; }
        }

        /* ─── Legacy banner (kept for back-compat — may use in subscreens) ─── */
        .lvl-banner {
            text-align: center;
            padding: 12px 12px 8px;
            background: linear-gradient(180deg, rgba(196, 149, 58, 0.15) 0%, transparent 100%);
            border-bottom: 1px solid var(--v-border);
            margin-bottom: 10px;
        }

        .lvl-banner-level {
            font-size: clamp(30px, 9vw, 38px);
            font-weight: 800;
            color: var(--v-gold);
            text-shadow: 0 0 20px rgba(196, 149, 58, 0.4);
            line-height: 1;
        }

        .lvl-banner-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--v-text);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.7);
        }

        .lvl-banner-class {
            font-size: 12px;
            color: var(--v-text-dim);
            margin-top: 2px;
        }

        .lvl-gains {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 6px;
        }

        .lvl-gain {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 600;
        }

        .lvl-gain.hp {
            color: #e45;
        }

        .lvl-gain.mp {
            color: #4af;
        }

        /* ─── Pending choices summary — AAA cards ─── */
        .pending-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 12px 0;
        }

        .pending-item {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: linear-gradient(135deg, rgba(40,28,16,0.85) 0%, rgba(30,22,14,0.7) 100%);
            border: 1px solid rgba(196,149,58,0.35);
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.4),
                        0 0 14px rgba(196,149,58,0.1),
                        inset 0 1px 0 rgba(196,149,58,0.15);
            transition: all 0.25s ease;
            overflow: hidden;
            animation: pendingReveal 0.5s ease backwards;
        }
        .pending-item:nth-child(1) { animation-delay: 1.1s; }
        .pending-item:nth-child(2) { animation-delay: 1.3s; }
        .pending-item:nth-child(3) { animation-delay: 1.5s; }
        @keyframes pendingReveal {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .pending-item::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 0% 50%, rgba(196,149,58,0.18) 0%, transparent 50%);
            opacity: 0.6;
            pointer-events: none;
        }
        .pending-item:hover {
            border-color: rgba(196,149,58,0.6);
            box-shadow: 0 4px 18px rgba(0,0,0,0.5),
                        0 0 22px rgba(196,149,58,0.25),
                        inset 0 1px 0 rgba(196,149,58,0.25);
            transform: translateY(-1px);
        }

        .pending-icon {
            font-size: 24px;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, rgba(196,149,58,0.25) 0%, rgba(196,149,58,0.05) 70%, transparent 100%);
            border-radius: 50%;
            flex-shrink: 0;
            filter: drop-shadow(0 0 8px rgba(196,149,58,0.5));
            animation: pendingIconPulse 2.5s ease-in-out infinite;
        }
        @keyframes pendingIconPulse {

    <script>
        // ═══════════════════════════════════════════════
        // INIT
        // ═══════════════════════════════════════════════
        var _vBg = '#2a2420';
        var tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready(); tg.expand(); tg.setHeaderColor(_vBg); tg.setBackgroundColor(_vBg);
            if (tg.onEvent) {
                tg.onEvent('viewportChanged', () => {
                    document.documentElement.style.setProperty('--tg-viewport-height', tg.viewportHeight + 'px');
                });
            }
        }

        var token = '';
        var P = null; // player data
        var apiFallback = '';
        var userId = '';
        var returnTo = ''; // webapp to return to after levelup (e.g., 'explore')
        var sel = { asi: {}, feat: '', featStat: '', skills: [], subclass: '' };

        // Haptic feedback helper
        function haptic(type = 'light') {
            try { tg?.HapticFeedback?.impactOccurred(type); } catch (e) { console.warn('[LEVELUP] haptic:', e); }
        }
        function hapticNotify(type = 'error') {
            try { tg?.HapticFeedback?.notificationOccurred(type); } catch (e) { console.warn('[LEVELUP] haptic:', e); }
        }

        async function _levelupTransitionBack() {
            const h = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
            if (window.Telegram?.WebApp?.initData) h['X-Telegram-Init-Data'] = Telegram.WebApp.initData;
            h['X-Idempotency-Key'] = crypto.randomUUID();
            try {
                const r = await fetchT(apiFallback + '/api/webapp/transition', {
                    method: 'POST', headers: h,
                    body: JSON.stringify({ from: 'levelup', to: returnTo, user_id: parseInt(userId), payload: {} })
                });
                if (r.status === 401 || r.status === 403) {
                    console.error('[LEVELUP] Auth error on transition:', r.status);
                    if (tg?.sendData) { tg.sendData(JSON.stringify({ action: 'webapp_reconnect', webapp: 'LEVELUP', reason: 'session_expired' })); return; }
                }
                const d = await r.json();
                if (d.url) { window.__valdoria_transitioning = true; window.location.replace(d.url); return; }
            } catch (e) { console.error('[LEVELUP] transition error:', e); }
            try { if (tg) tg.close(); } catch (e) { console.warn('[LEVELUP] tg.close:', e); }
        }

        // ═══════════════════════════════════════════════
        // SCREEN MANAGEMENT
        // ═══════════════════════════════════════════════
        var screens = [];
        var cur = 0;
        var asiMode = 'asi';


        (function init() {
            const params = new URLSearchParams(location.search);
            token = params.get('token') || '';
            apiFallback = params.get('api') || '';
            userId = params.get('uid') || '';
            // [EXIT-CONFIRM] Heartbeat for displacement detection
            if (window.SessionHeartbeat && apiFallback && token && userId) {
                SessionHeartbeat.init({ apiBase: apiFallback, token: token, uid: parseInt(userId) || 0 });
            }
            returnTo = params.get('return') || '';

            // ── Shared Error Reporter ──
            if (window.ValdoriaErrors) {
                ValdoriaErrors.init({ appName: 'LEVELUP', apiBase: apiFallback, token: token, uid: userId });
            }

            try {
                const raw = params.get('p') || '';
                if (!raw) {
                    console.error('[LEVELUP] Empty p param');
                    showFatalError('Dados de evolução não encontrados. Feche e tente novamente.'); return;
                }
                P = JSON.parse(decodeBase64Utf8(raw));
            } catch (e) {
                console.error('[LEVELUP] Payload decode failed. p length:', ((params.get('p')||'').length), 'error:', e.message);
                showFatalError('Erro ao carregar dados de evolução. Feche e tente novamente.', e); return;
            }
            if (!P || !P.hero_class || !P.stats || typeof P.level !== 'number') {
                showFatalError('Dados do personagem incompletos'); return;
            }
            for (const [k, v] of Object.entries(P.stats)) {
                if (typeof v !== 'number' || v < 1 || v > 20) {
                    showFatalError('Atributos invalidos'); return;
                }
            }
            if (typeof CLASS_SKILLS === 'undefined' || typeof FEATS === 'undefined') {
                showFatalError('Dados do jogo nao carregaram'); return;
            }
            buildScreens();
            // Hide initial loading with narrative delay
            document.getElementById('luBackdrop').style.display = '';
            if (window._lvlInitLoading) window._lvlInitLoading.hide();
        })();

        function buildScreens() {
            screens.length = 0;
            screens.push({ id: 'summary', build: buildSummary, validate: function() { return null; } });
            if (P.needs_subclass) {
                screens.push({ id: 'subclass', build: buildSubclass, validate: validateSubclass });
            }
            if (P.pending_asi > 0) {
                screens.push({ id: 'asi', build: buildASI, validate: validateASI });
            }
            if (P.pending_skills > 0) {
                var skills = getAvailableSkills();
                if (skills.length > 0) {
                    screens.push({ id: 'skills', build: buildSkills, validate: validateSkills });
                }
            }
            screens.push({ id: 'review', build: buildReview, validate: function() { return null; } });
            buildDots();
            goTo(0);
        }

        function buildDots() {
            var dotsEl = document.getElementById('luDots');
            var html = '';
            for (var i = 0; i < screens.length; i++) html += '<span class="lu-dot" id="dot_' + i + '"></span>';
            dotsEl.innerHTML = html;
        }

        function updateDots() {
            for (var i = 0; i < screens.length; i++) {
                var el = document.getElementById('dot_' + i);
                if (!el) continue;
                el.className = 'lu-dot' + (i < cur ? ' done' : i === cur ? ' active' : '');
            }
        }

        function goTo(idx) {
            if (idx < 0 || idx >= screens.length) return;
            haptic('light');
            closeSubScreen();
            cur = idx;
            var body = document.getElementById('luBody');
            var wrapper = document.createElement('div');
            screens[cur].build(wrapper);
            body.innerHTML = '';
            body.appendChild(wrapper);
            body.scrollTop = 0;
            updateDots();
            updateNavBtn();
        }

        function _rebuildCurrentScreen() {
            var wrapper = document.createElement('div');
            screens[cur].build(wrapper);
            var body = document.getElementById('luBody');
            var st = body.scrollTop;
            body.innerHTML = '';
            body.appendChild(wrapper);
            body.scrollTop = st;
        }

        function goNext() {
            var err = screens[cur].validate();
            if (err) { _showValidation(err); return; }
            if (cur === screens.length - 1) {
                submit();
            } else {
                goTo(cur + 1);
            }
        }

        function goBack() {
            if (cur > 0) { goTo(cur - 1); return; }
            // Screen 0 — close WebApp
            try { tg.close(); } catch (e) { console.warn('[LEVELUP] close failed:', e); }
        }

        function updateNavBtn() {
            var btn = document.getElementById('btnNext');
            var backBtn = document.getElementById('btnBack');
            if (cur === screens.length - 1) {
                btn.textContent = '⚔️ Confirmar Evolução';
            } else {
                btn.textContent = 'Continuar ▶';
            }
            btn.className = 'v-btn v-btn-primary';
            if (cur === 0) backBtn.classList.add('hidden');
            else backBtn.classList.remove('hidden');
            if (tg && tg.BackButton) tg.BackButton.show();
        }

        // ═══════════════════════════════════════════════
        // SUB-SCREEN MANAGEMENT (single overlay within card)
        // ═══════════════════════════════════════════════
        function openSubScreen(html) {
            var sub = document.getElementById('luSub');
            var content = document.getElementById('luSubContent');
            content.innerHTML = html;
            sub.classList.add('active');
            sub.scrollTop = 0;
            document.getElementById('luFooter').style.display = 'none';
        }

        function closeSubScreen() {
            var sub = document.getElementById('luSub');
            sub.classList.remove('active');
            document.getElementById('luFooter').style.display = '';
        }

        // ═══════════════════════════════════════════════
        // TELEGRAM BACK BUTTON
        // ═══════════════════════════════════════════════
        if (tg && tg.BackButton) {
            tg.BackButton.onClick(function() {
                var sub = document.getElementById('luSub');
                if (sub.classList.contains('active')) { closeSubScreen(); return; }
                goBack();
            });
        }

        // ═══════════════════════════════════════════════
        // HELPERS
        // ═══════════════════════════════════════════════
        function getMod(val) {
            return Math.floor((val - 10) / 2);
        }
        function fmtMod(val) {
            const m = getMod(val);
            return m >= 0 ? '+' + m : '' + m;
        }
        function getAvailableSkills() {
            const pool = CLASS_SKILLS[P.hero_class] || {};
            const result = [];
            for (const [lv, skills] of Object.entries(pool)) {
                if (parseInt(lv) <= P.level) {
                    for (const s of skills) {
                        if (!P.acquired_skills.includes(s.id)) {
                            result.push({ ...s, level: parseInt(lv) });
                        }
                    }
                }
            }
            return result;
        }

        function _showValidation(msg) {
            console.warn('[LEVELUP]', msg);
            hapticNotify('error');
            if (window.ValdoriaErrors) {
                ValdoriaErrors.showToast(msg, 3000);
            } else {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 3000);
            }
        }

        function showFatalError(msg, err = null) {
            console.error('[LEVELUP][FATAL]', msg, err || '');
            // Use shared overlay if available, fallback to local
            if (window.ValdoriaErrors) {
                ValdoriaErrors.showError(msg, err);
            } else {
                const el = document.getElementById('fatalError');
                document.getElementById('fatalMsg').textContent = msg;
                el.classList.add('active');
            }
        }

        function calcDmgRange(effect) {
            if (!effect) return '';
            const m = effect.match(/(\d+)d(\d+)(?:\s*\+\s*(\d+))?/);
            if (!m) return '';
            const n = parseInt(m[1]), d = parseInt(m[2]), b = m[3] ? parseInt(m[3]) : 0;
            return `${n + b}~${n * d + b}`;
        }

        // ═══════════════════════════════════════════════
        // SCREEN: SUMMARY
        // ═══════════════════════════════════════════════
        // Mapa hero_class (EN enum) -> PNG slug (PT-BR) + data-class CSS attribute
        // PNG files em /shared/img/combat/{slug}.png e mappings no .lvl-cinema CSS.
        const HERO_CLASS_SLUG = {
            'BARD': 'bardo', 'WIZARD': 'mago', 'MAGE': 'mago', 'CLERIC': 'clerigo',
            'FIGHTER': 'guerreiro', 'RANGER': 'patrulheiro', 'PALADIN': 'paladino',
            'BARBARIAN': 'barbaro', 'ROGUE': 'ladino', 'SORCERER': 'feiticeiro',
            'WARLOCK': 'bruxo', 'DRUID': 'druida', 'MONK': 'monge'
        };
        function _heroSlug(hc) {
            if (!hc) return 'guerreiro';
            return HERO_CLASS_SLUG[String(hc).toUpperCase()] || String(hc).toLowerCase();
        }

        function buildSummary(el) {
            const info = CLASS_INFO[P.hero_class] || { name: 'Aventureiro', resource: 'MP' };
            const _slug = _heroSlug(P.hero_class);
            let html = `
        <div class="dm-bubble">${P.name}, a energia do seu crescimento se manifesta. Você sente o poder fluindo...</div>
        <div class="lvl-cinema" data-class="${_slug}" data-tier="${P.level >= 13 ? 'mithral' : P.level >= 10 ? 'platinum' : P.level >= 8 ? 'gold' : P.level >= 5 ? 'silver' : 'bronze'}">
            <div class="lvl-cinema-aura"></div>
            <div class="lvl-cinema-magic-circle"></div>
            <div class="lvl-cinema-rays"></div>
            <div class="lvl-cinema-particles"></div>
            <div class="lvl-cinema-rune-ring"></div>
            <div class="lvl-cinema-portrait"><img src="../shared/img/combat/${_slug}.png" alt="${info.name}" onerror="this.style.display='none'"/></div>
            <div class="lvl-cinema-medal" title="${P.level >= 13 ? 'Mítico' : P.level >= 10 ? 'Lendário' : P.level >= 8 ? 'Mestre' : P.level >= 5 ? 'Veterano' : 'Iniciante'}"><img src="../shared/img/medals/${P.level >= 13 ? 'mithral' : P.level >= 10 ? 'platinum' : P.level >= 8 ? 'gold' : P.level >= 5 ? 'silver' : 'bronze'}.png" alt="tier" onerror="this.style.display='none'"/></div>
            <div class="lvl-cinema-level">${P.level}</div>
            <div class="lvl-cinema-title">Novo Nível Alcançado</div>
            <div class="lvl-cinema-class"><b>${info.name}</b> &mdash; ${P.name}</div>
            <div class="lvl-gains">
                ${P.hp_gain ? `<div class="lvl-gain hp">\u2764\ufe0f +${P.hp_gain} HP</div>` : ''}
                ${P.mp_gain ? `<div class="lvl-gain mp">\ud83d\udd37 +${P.mp_gain} ${info.resource}</div>` : ''}
            </div>
        </div>
        <div class="section-title">Escolhas Pendentes</div>
        <div class="pending-list">
    `;

            if (P.needs_subclass) {
                html += `<div class="pending-item">
            <div class="pending-icon">\ud83c\udff0</div>
            <div class="pending-text"><b>Subclasse</b><small>Escolha obrigatória no nível 3+</small></div>
            <div class="pending-badge">1</div>
        </div>`;
            }
            if (P.pending_asi > 0) {
                html += `<div class="pending-item">
            <div class="pending-icon">\ud83d\udcaa</div>
            <div class="pending-text"><b>Pontos de Atributo</b><small>Distribua entre seus atributos</small></div>
            <div class="pending-badge">${P.pending_asi}</div>
        </div>`;
            }
            if (P.pending_skills > 0) {
                html += `<div class="pending-item">
            <div class="pending-icon">\u26a1</div>
            <div class="pending-text"><b>Novas Habilidades</b><small>Escolha do pool da sua classe</small></div>
            <div class="pending-badge">${P.pending_skills}</div>
        </div>`;
            }

            html += '</div><div class="hint">Prossiga para fazer suas escolhas</div>';
            el.innerHTML = html;
        }

        // ═══════════════════════════════════════════════
        // SCREEN: SUBCLASS (compact cards)
        // ═══════════════════════════════════════════════
        function buildSubclass(el) {
            const subs = SUBCLASSES[P.hero_class] || {};
            const info = CLASS_INFO[P.hero_class] || { name: 'Classe' };

            let html = `<div class="dm-bubble">Chegou a hora de definir seu caminho. Cada especializa\u00e7\u00e3o oferece poderes \u00fanicos...</div>
        <div class="section-title">\ud83c\udff0 Subclasse: ${info.name}</div>
        <div class="hint">Escolha sua especializa\u00e7\u00e3o</div>
        <div id="subclassList">`;

            const subEntries = Object.entries(subs);
            if (subEntries.length === 0) {
                html += '<div class="empty-msg">Subclasses não disponíveis para este nível.</div>';
            } else {
                for (const [scId, sc] of subEntries) {
                    const isSel = sel.subclass === scId;
                    html += `<div class="choice-card${isSel ? ' selected' : ''}" onclick="selectSubclass('${scId}')">
                <div class="choice-card-header">
                    <div class="choice-card-icon">\ud83c\udff0</div>
                    <div class="choice-card-name">${sc.name}</div>
                    <div class="choice-card-check">${isSel ? '\u2713' : ''}</div>
                </div>
                <div class="choice-card-desc">${sc.desc}</div>
                <div class="detail-link" onclick="event.stopPropagation(); openSubclassDetail('${scId}')">Ver habilidades \u25b8</div>
            </div>`;
                }
            }

            html += '</div>';
            el.innerHTML = html;
        }

        function openSubclassDetail(scId) {
            const subs = SUBCLASSES[P.hero_class] || {};
            const sc = subs[scId];
            if (!sc) return;

            let html = `<button class="lu-sub-back" onclick="closeSubScreen()">\u25c0 Voltar</button>`;
            html += `<div class="section-title">\ud83c\udff0 ${sc.name}</div>`;
            html += `<div style="font-size:12px;color:var(--v-text-dim);margin-bottom:12px;line-height:1.4">${sc.desc}</div>`;

            const feats = sc.features || {};
            const levels = Object.keys(feats).sort((a, b) => parseInt(a) - parseInt(b));
            if (levels.length > 0) {
                html += '<div class="section-title">Habilidades por Nível</div>';
                for (const lv of levels) {
                    const f = feats[lv];
                    html += `<div class="sc-feature">
                <div class="sc-feature-level">Nível ${lv}</div>
                <div class="sc-feature-name">${f.name}</div>
                ${f.desc ? `<div class="sc-feature-desc">${f.desc}</div>` : ''}
            </div>`;
                }
            }

            const isSel = sel.subclass === scId;
            html += `<button class="v-btn ${isSel ? 'v-btn-secondary' : 'v-btn-primary'}" style="width:100%;margin-top:16px"
        onclick="selectSubclass('${scId}'); closeSubScreen()">
        ${isSel ? '\u2713 Selecionada' : `Selecionar ${sc.name}`}
    </button>`;

            openSubScreen(html);
        }

        function selectSubclass(scId) {
            haptic('light');
            sel.subclass = sel.subclass === scId ? '' : scId;
            _rebuildCurrentScreen();
        }

        function validateSubclass() {
            if (!sel.subclass) return 'Escolha uma subclasse';
            return null;
        }

        // ═══════════════════════════════════════════════
        // SCREEN: ASI + FEATS (compact)
        // ═══════════════════════════════════════════════

        function buildASI(el) {
            const totalPts = P.pending_asi;
            const featCost = sel.feat ? 2 : 0;
            const asiPts = totalPts - featCost;
            const allocated = Object.values(sel.asi).reduce((a, b) => a + b, 0);
            const remaining = asiPts - allocated;

            const availableFeats = getAvailableFeats();
            const hasFeats = Object.keys(availableFeats).length > 0 && totalPts >= 2;

            let html = '<div class="dm-bubble">Distribua sua experiência adquirida para fortalecer seus atributos — ou escolha um talento especial.</div>';

            if (hasFeats) {
                html += `<div class="mode-toggle">
            <button class="mode-toggle-btn${asiMode === 'asi' ? ' active' : ''}" onclick="setAsiMode('asi')">\ud83d\udcaa Atributos</button>
            <button class="mode-toggle-btn${asiMode === 'feat' ? ' active' : ''}" onclick="setAsiMode('feat')">\ud83c\udf96\ufe0f Talento</button>
        </div>`;
            }

            if (asiMode === 'asi') {
                html += buildASIPanel(asiPts, allocated, remaining);
            } else {
                html += buildFeatPanel(availableFeats);
            }

            el.innerHTML = html;
        }

        function buildASIPanel(asiPts, allocated, remaining) {
            let html = `<div class="asi-counter">Pontos: <b>${allocated}</b> / <b>${asiPts}</b> distribuidos</div>`;

            if (asiPts <= 0) {
                html += `<div class="empty-msg">Todos os pontos foram usados no talento selecionado.</div>`;
                return html;
            }

            html += '<div class="asi-grid">';
            const attrs = ['strength', 'dexterity', 'constitution', 'intelligence', 'wisdom', 'charisma'];
            for (const attr of attrs) {
                const base = P.stats[attr];
                const boost = sel.asi[attr] || 0;
                const val = base + boost;
                const maxed = val >= 20;

                html += `<div class="asi-card${maxed && boost === 0 ? ' maxed' : ''}">
            <div class="asi-icon">${ATTR_ICONS[attr]}</div>
            <div class="asi-name">${ATTR_ABBR[attr]}</div>
            <div class="asi-value">${val}</div>
            <div class="asi-mod">(${fmtMod(val)})</div>
            <div class="asi-boost">${boost > 0 ? '+' + boost : ''}</div>
            <div class="asi-controls">
                <button class="asi-btn minus" aria-label="Diminuir ${attr}" onclick="asiChange('${attr}',-1)" ${boost <= 0 ? 'disabled' : ''}>-</button>
                <button class="asi-btn plus" aria-label="Aumentar ${attr}" onclick="asiChange('${attr}',1)" ${(remaining <= 0 || val >= 20) ? 'disabled' : ''}>+</button>
            </div>
        </div>`;
            }
            html += '</div>';
            return html;
        }

        function buildFeatPanel(availableFeats) {
            let html = '<div class="section-title">\ud83c\udf96\ufe0f Talentos</div>';
            html += '<div class="hint">Escolher um talento consome 2 pontos de atributo</div>';

            if (sel.feat) {
                const f = FEATS[sel.feat];
                html += `<div class="choice-card selected" onclick="selectFeat('')">
            <div class="choice-card-header">
                <div class="choice-card-icon">\ud83c\udf96\ufe0f</div>
                <div class="choice-card-name">${f.name}</div>
                <div class="choice-card-badge badge-cost">-2 pts</div>
                <div class="choice-card-check">\u2713</div>
            </div>
        </div>`;

                if (f.stat_choice) {
                    html += '<div class="section-title">Escolha do Atributo</div>';
                    for (const attr of f.stat_choice) {
                        const curVal = P.stats[attr];
                        const amt = f.stat_amount || 1;
                        if (curVal + amt > 20) continue;
                        const isSel = sel.featStat === attr;
                        html += `<div class="choice-card${isSel ? ' selected' : ''}" onclick="selectFeatStat('${attr}')">
                    <div class="choice-card-header">
                        <div class="choice-card-icon">${ATTR_ICONS[attr]}</div>
                        <div class="choice-card-name">${ATTR_PT[attr]} (${curVal} \u2192 ${curVal + amt})</div>
                        <div class="choice-card-check">${isSel ? '\u2713' : ''}</div>
                    </div>
                </div>`;
                    }
                }

                html += `<button class="v-btn v-btn-secondary" style="width:100%;margin-top:12px" onclick="selectFeat('')">Remover Talento</button>`;
            } else {
                const featEntries = Object.entries(availableFeats);
                if (featEntries.length === 0) {
                    html += '<div class="empty-msg">Nenhum talento disponível para sua classe.</div>';
                } else {
                    html += '<div class="feat-scroll-list">';
                    for (const [fid, f] of featEntries) {
                        html += `<div class="choice-card" onclick="selectFeat('${fid}')">
                    <div class="choice-card-header">
                        <div class="choice-card-icon">\ud83c\udf96\ufe0f</div>
                        <div class="choice-card-name">${f.name}</div>
                        <div class="choice-card-badge badge-cost">-2 pts</div>
                        <button class="info-btn" onclick="event.stopPropagation(); openFeatDetail('${fid}')">i</button>
                    </div>
                </div>`;
                    }
                    html += '</div>';
                }
            }

            return html;
        }

        function openFeatDetail(fid) {
            const f = FEATS[fid];
            if (!f) return;


            let html = `<button class="lu-sub-back" onclick="closeSubScreen()">\u25c0 Voltar</button>`;
            html += `<div class="section-title">\ud83c\udf96\ufe0f ${f.name}</div>`;
            html += `<div style="font-size:13px;color:var(--v-text);margin-bottom:8px;line-height:1.4">${f.desc}</div>`;

            if (f.effect) {
                html += `<div style="font-size:12px;color:var(--v-text-dim);margin-bottom:8px;line-height:1.3"><b>Efeito:</b> ${f.effect}</div>`;
            }
            if (f.stat_choice) {
                html += `<div style="font-size:12px;color:var(--v-text-dim);margin-bottom:8px"><b>Bônus:</b> +${f.stat_amount || 1} em ${f.stat_choice.map(a => ATTR_PT[a]).join(' ou ')}</div>`;
            }
            if (f.req_spellcaster) {
                html += `<div style="font-size:12px;color:#e45;margin-bottom:8px"><b>Requisito:</b> Classe conjuradora</div>`;
            }

            html += `<div style="font-size:11px;color:var(--v-text-dim);margin-top:4px">Custo: 2 pontos de atributo</div>`;

            html += `<button class="v-btn v-btn-primary" style="width:100%;margin-top:16px"
        onclick="selectFeat('${fid}'); closeSubScreen()">Selecionar ${f.name}</button>`;

            openSubScreen(html);
        }

        function getAvailableFeats() {
            const result = {};
            const nonCasters = ['WARRIOR', 'ROGUE', 'BARBARIAN'];
            for (const [fid, f] of Object.entries(FEATS)) {
                if (P.feats.includes(fid)) continue;
                if (f.req_spellcaster && nonCasters.includes(P.hero_class)) continue;
                result[fid] = f;
            }
            return result;
        }

        function setAsiMode(mode) {
            asiMode = mode;
            _rebuildCurrentScreen();
        }

        function asiChange(attr, delta) {
            haptic('light');
            const boost = (sel.asi[attr] || 0) + delta;
            const val = P.stats[attr] + boost;
            if (boost < 0 || val > 20) return;

            const featCost = sel.feat ? 2 : 0;
            const asiPts = P.pending_asi - featCost;
            const totalAllocated = Object.values(sel.asi).reduce((a, b) => a + b, 0) + delta;
            if (totalAllocated > asiPts || totalAllocated < 0) return;

            if (boost === 0) { delete sel.asi[attr]; } else { sel.asi[attr] = boost; }

            _rebuildCurrentScreen();
        }

        function selectFeat(fid) {
            haptic('medium');
            if (sel.feat === fid) {
                sel.feat = ''; sel.featStat = '';
            } else {
                sel.feat = fid; sel.featStat = '';
                const featCost = fid ? 2 : 0;
                const asiPts = P.pending_asi - featCost;
                const allocated = Object.values(sel.asi).reduce((a, b) => a + b, 0);
                if (allocated > asiPts) { sel.asi = {}; }
            }
            _rebuildCurrentScreen();
        }

        function selectFeatStat(attr) {
            haptic('light');
            sel.featStat = sel.featStat === attr ? '' : attr;
            _rebuildCurrentScreen();
        }

        function validateASI() {
            const featCost = sel.feat ? 2 : 0;
            const asiPts = P.pending_asi - featCost;
            const allocated = Object.values(sel.asi).reduce((a, b) => a + b, 0);

            if (sel.feat) {
                const f = FEATS[sel.feat];
                if (f && f.stat_choice && !sel.featStat) {
                    return 'Escolha o atributo para o talento';
                }
            }

            if (allocated !== asiPts) {
                return `Distribua todos os ${asiPts} pontos de atributo (faltam ${asiPts - allocated})`;
            }
            return null;
        }

        // ═══════════════════════════════════════════════
        // SCREEN: SKILLS (compact rows)
        // ═══════════════════════════════════════════════
        function buildSkills(el) {
            const available = getAvailableSkills();
            const needed = Math.min(P.pending_skills, available.length);
            const info = CLASS_INFO[P.hero_class] || { resource: 'MP' };

            let html = `<div class="dm-bubble">Novas técnicas de combate estão ao seu alcance. Escolha com sabedoria.</div>`;
            html += `<div class="section-title">\u26a1 Habilidades</div>`;
            html += `<div class="asi-counter">Selecionadas: <b>${sel.skills.length}</b> / <b>${needed}</b></div>`;

            for (const s of available) {
                const isSel = sel.skills.includes(s.id);
                html += `<div class="skill-compact${isSel ? ' selected' : ''}" onclick="toggleSkill('${s.id}')">
            <div class="skill-compact-check">${isSel ? '\u2713' : ''}</div>
            <span class="skill-compact-icon">\u26a1</span>
            <span class="skill-compact-name">${s.name}</span>
            ${s.passive ? '<span class="choice-card-badge badge-passive">Passiva</span>' :
                        `<span class="choice-card-badge badge-cost">${s.cost} ${info.resource}</span>`}
            <button class="info-btn" onclick="event.stopPropagation(); openSkillDetail('${s.id}')">i</button>
        </div>`;
            }

            if (available.length === 0) {
                html += '<div class="empty-msg">Nenhuma habilidade disponível para escolher.</div>';
            }

            el.innerHTML = html;
        }

        function openSkillDetail(sid) {
            const available = getAvailableSkills();
            const s = available.find(sk => sk.id === sid);
            if (!s) return;
            const info = CLASS_INFO[P.hero_class] || { resource: 'MP' };

            const dmg = calcDmgRange(s.effect);
            let html = `<button class="lu-sub-back" onclick="closeSubScreen()">\u25c0 Voltar</button>`;
            html += `<div class="section-title">\u26a1 ${s.name}</div>`;

            html += `<div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">`;
            if (s.passive) {
                html += '<span class="choice-card-badge badge-passive">Passiva</span>';
            } else {
                html += `<span class="choice-card-badge badge-cost">${s.cost} ${info.resource}</span>`;
            }
            html += `<span class="choice-card-badge badge-level">Nível ${s.level}</span>`;
            if (dmg) html += `<span class="choice-card-badge" style="background:rgba(228,68,85,0.15);color:#e45">${dmg} dano</span>`;
            html += '</div>';

            if (s.effect) html += `<div style="font-size:13px;color:var(--v-text);margin-bottom:8px">\u2728 ${s.effect}</div>`;
            if (s.desc) html += `<div style="font-size:12px;color:var(--v-text-dim);margin-bottom:8px;line-height:1.4">${s.desc}</div>`;
            if (s.tech) html += `<div style="font-size:11px;color:var(--v-text-dim);font-style:italic;line-height:1.3">${s.tech}</div>`;

            const isSel = sel.skills.includes(sid);
            html += `<button class="v-btn ${isSel ? 'v-btn-secondary' : 'v-btn-primary'}" style="width:100%;margin-top:16px"
        onclick="toggleSkill('${sid}'); closeSubScreen()">
        ${isSel ? '\u2713 Selecionada' : 'Selecionar Habilidade'}
    </button>`;

            openSubScreen(html);
        }

        function toggleSkill(sid) {
            haptic('light');
            const idx = sel.skills.indexOf(sid);
            const available = getAvailableSkills();
            const needed = Math.min(P.pending_skills, available.length);

            if (idx >= 0) {
                sel.skills.splice(idx, 1);
            } else {
                if (sel.skills.length >= needed) {
                    _showValidation(`Você só pode escolher ${needed} habilidade(s)`);
                    return;
                }
                sel.skills.push(sid);
            }

            _rebuildCurrentScreen();
        }

        function validateSkills() {
            const available = getAvailableSkills();
            const needed = Math.min(P.pending_skills, available.length);
            if (sel.skills.length !== needed) {
                return `Escolha ${needed} habilidade(s) (faltam ${needed - sel.skills.length})`;
            }
            return null;
        }

        // ═══════════════════════════════════════════════
        // SCREEN: REVIEW
        // ═══════════════════════════════════════════════
        function buildReview(el) {
            const info = CLASS_INFO[P.hero_class] || { name: 'Aventureiro', resource: 'MP' };
            let html = `<div class="dm-bubble">Revise suas escolhas antes de confirmar. Uma vez feitas, n\u00e3o h\u00e1 como voltar.</div>`;
            html += `<div class="section-title">\ud83d\udcdc Resumo da Evolu\u00e7\u00e3o</div>`;

            // HP/MP gains
            html += `<div class="review-section">
        <div class="review-section-title">\u2764\ufe0f Vitalidade</div>`;
            if (P.hp_gain) {
                html += `<div class="review-row"><span class="review-label">HP</span>
        <span class="review-value">${P.max_hp - P.hp_gain} <span class="arrow">\u2192</span> <span class="changed">${P.max_hp}</span></span></div>`;
            }
            if (P.mp_gain) {
                html += `<div class="review-row"><span class="review-label">${info.resource}</span>
        <span class="review-value">${P.max_mp - P.mp_gain} <span class="arrow">\u2192</span> <span class="changed">${P.max_mp}</span></span></div>`;
            }
            html += '</div>';

            if (P.needs_subclass && sel.subclass) {
                const subs = SUBCLASSES[P.hero_class] || {};
                const sc = subs[sel.subclass];
                html += `<div class="review-section">
            <div class="review-section-title">\ud83c\udff0 Subclasse</div>
            <div class="review-row"><span class="review-label">Escolha:</span>
            <span class="review-value"><span class="changed">${sc ? sc.name : sel.subclass}</span> <span class="new-badge">Novo</span></span></div>
        </div>`;
            }

            if (sel.feat) {
                const f = FEATS[sel.feat];
                html += `<div class="review-section">
            <div class="review-section-title">\ud83c\udf96\ufe0f Talento</div>
            <div class="review-row"><span class="review-label">Escolha:</span>
            <span class="review-value"><span class="changed">${f ? f.name : sel.feat}</span> <span class="new-badge">Novo</span></span></div>`;
                if (sel.featStat) {
                    const amt = f?.stat_amount || 1;
                    html += `<div class="review-row"><span class="review-label">Bonus:</span>
            <span class="review-value"><span class="changed">+${amt} ${ATTR_PT[sel.featStat]}</span></span></div>`;
                }
                html += `<div class="review-row"><span class="review-label">Custo:</span>
            <span class="review-value" style="color:#e45">-2 pontos de atributo</span></div>
        </div>`;
            }

            const asiEntries = Object.entries(sel.asi).filter(([_, v]) => v > 0);
            if (asiEntries.length > 0) {
                html += `<div class="review-section">
            <div class="review-section-title">\ud83d\udcaa Atributos</div>`;
                for (const [attr, boost] of asiEntries) {
                    const before = P.stats[attr];
                    const after = before + boost;
                    html += `<div class="review-row">
                <span class="review-label">${ATTR_ICONS[attr]} ${ATTR_PT[attr]}</span>
                <span class="review-value">${before} <span class="arrow">\u2192</span> <span class="changed">${after}</span> (${fmtMod(after)})</span>
            </div>`;
                }
                html += '</div>';
            }

            if (sel.skills.length > 0) {
                html += `<div class="review-section">
            <div class="review-section-title">\u26a1 Habilidades</div>`;
                const pool = CLASS_SKILLS[P.hero_class] || {};
                for (const sid of sel.skills) {
                    let sName = sid;
                    for (const skills of Object.values(pool)) {
                        const found = skills.find(s => s.id === sid);
                        if (found) { sName = found.name; break; }
                    }
                    html += `<div class="review-row"><span class="review-label">\u26a1</span>
            <span class="review-value"><span class="changed">${sName}</span> <span class="new-badge">Novo</span></span></div>`;
                }
                html += '</div>';
            }

            html += '<div class="hint" style="margin-top:12px">Confirme suas escolhas para finalizar a evolução</div>';
            el.innerHTML = html;
        }

        // ═══════════════════════════════════════════════
        // SUBMIT
        // ═══════════════════════════════════════════════
        function resetSubmitState() {
            _submitted = false;
            var btn = document.getElementById('btnNext');
            btn.disabled = false;
            btn.textContent = '⚔️ Confirmar Evolução';
            document.getElementById('loadingOverlay').classList.remove('active');
        }

        var _submitted = false;
        function submit() {
            if (_submitted) return;
            _submitted = true;
            haptic('medium');
            const asiChoices = [];
            for (const [attr, count] of Object.entries(sel.asi)) {
                for (let i = 0; i < count; i++) asiChoices.push(attr);
            }

            const payload = {
                action: 'levelup_complete',
                token: token,
                asi_choices: asiChoices,
                skill_choices: sel.skills,
                subclass: sel.subclass,
                feat: sel.feat,
                feat_stat: sel.featStat,
            };

            // Show loading overlay
            const btn = document.getElementById('btnNext');
            btn.disabled = true;
            btn.textContent = 'Enviando...';
            document.getElementById('loadingOverlay').classList.add('active');

            try {
                if (apiFallback) {
                    payload.user_id = parseInt(userId);
                    const _lh = {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    };
                    if (window.Telegram?.WebApp?.initData) { _lh['X-Telegram-Init-Data'] = Telegram.WebApp.initData; }
                    _lh['X-Idempotency-Key'] = crypto.randomUUID();
                    fetchT(apiFallback + '/api/levelup/apply', {
                        method: 'POST',
                        headers: _lh,
                        body: JSON.stringify(payload)
                    }).then(res => {
                        if (res.status === 401 || res.status === 403) {
                            console.error('[LEVELUP] Auth error on apply:', res.status);
                            resetSubmitState();
                            showFatalError('Sess\u00e3o expirada. Feche esta janela e reabra o jogo.');
                            return null;
                        }
                        return res.json();
                    }).then(data => {
                            if (!data) return;
                            if (data.status === 'saved' || data.ok) {
                                // Navigate to return URL if provided (webapp transition)
                                if (data.return_url) {
                                    window.__valdoria_transitioning = true; window.location.replace(data.return_url);
                                } else if (returnTo && apiFallback && token) {
                                    // Use transition API to return to origin webapp
                                    _levelupTransitionBack();
                                } else if (tg && tg.close) {
                                    tg.close();
                                } else {
                                    alert('Evolução confirmada!');
                                }
                            } else {
                                resetSubmitState();
                                showFatalError('Erro ao aplicar evolução: ' + (data.error || 'Desconhecido'));
                            }
                        }).catch(function(e) {
                            resetSubmitState();
                            showFatalError('Erro de conexao com servidor.', e);
                        });
                }
                else if (tg && tg.sendData) {
                    setTimeout(() => {
                        tg.sendData(JSON.stringify(payload));
                        // Safety: close webapp if sendData didn't auto-close
                        setTimeout(() => { try { tg.close(); } catch (e) { console.warn('[LEVELUP] tg.close:', e); } }, 300);
                    }, 300);
                    setTimeout(function() {
                        if (document.visibilityState !== 'hidden') { resetSubmitState(); }
                    }, 5000);
                } else {
                    console.log('Level-up payload:', JSON.stringify(payload, null, 2));
                    setTimeout(function() {
                        resetSubmitState();
                        alert('Evolução confirmada! (modo teste)\n\n' + JSON.stringify(payload, null, 2));
                    }, 800);
                }
            } catch (e) {
                resetSubmitState();
                showFatalError('Erro ao enviar dados. Tente novamente.', e);
            }
        }
    </script>
