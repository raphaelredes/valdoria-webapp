<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://telegra.ph https://i.ibb.co; media-src 'self'; connect-src 'self' https: wss:; frame-src 'none'; object-src 'none'; base-uri 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a2420">
    <link rel="preload" href="../shared/fonts/medievalsharp.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../shared/fonts.css">
    <title>Compêndio - Lendas de Valdoria</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        var v = Date.now();
        document.write('<link rel="stylesheet" href="../valdoria-design.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/tabs.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/toast.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/loading.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/animations.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="codex-app.css?v=' + v + '">');
    </script>
    <script>
    document.write('<script src="../shared/font-apply.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/haptic.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/webapp-init.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/loading-guard.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/loading-controller.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/toast.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/audio-manager.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/error-reporter.js?v=' + v + '"><\/script>');
    </script>
</head>

<body>
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay" aria-busy="true">
        <div class="loading-content">
            <div class="loading-icon">📖</div>
            <div class="loading-title">Compêndio de Valdoria</div>
            <div class="loading-tip" id="loading-tip" role="status" aria-live="polite">Carregando conhecimentos ancestrais...</div>
        </div>
    </div>

    <script>
    document.write('<script src="codex-loading.js?v=' + v + '"><\/script>');
    </script>

    <!-- Main app container -->
    <div id="app" style="display:none">
        <!-- Header with progress -->
        <div class="codex-header">
            <h1 class="codex-title">📖 Compêndio</h1>
            <div class="codex-progress" id="progressBar">
                <div class="codex-progress-fill" id="progressFill"></div>
                <span class="codex-progress-text" id="progressText">0/0</span>
            </div>
        </div>

        <!-- Search bar -->
        <div class="codex-search">
            <input type="text" id="searchInput" placeholder="Buscar no compêndio..."
                   class="codex-search-input" autocomplete="off">
        </div>

        <!-- Category tabs -->
        <div class="v-tabs v-tabs-pill" id="categoryTabs"></div>

        <!-- Entry list -->
        <div class="codex-list" id="entryList"></div>

        <!-- Footer: back button -->
        <div class="codex-footer">
            <button class="codex-back-btn" id="backBtn">🔙 Voltar ao Jogo</button>
        </div>
    </div>

    <!-- Detail overlay (sub-screen) -->
    <div class="codex-detail-overlay" id="detailOverlay" style="display:none">
        <div class="codex-detail-card">
            <div class="codex-detail-header" id="detailHeader"></div>
            <div class="codex-detail-body" id="detailBody"></div>
            <div class="codex-detail-meta" id="detailMeta"></div>
            <button class="codex-detail-close" id="detailClose">🔙 Voltar à Lista</button>
        </div>
    </div>

    <script>
    document.write('<script src="codex-app.js?v=' + v + '"><\/script>');
    </script>
</body>

</html>
