<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2">
  <title>Classes AI — Símbolos Heráldicos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1510;
      --bg-card: #2a2420;
      --bg-card-hover: #332a22;
      --gold: #c4953a;
      --gold-bright: #e8c45a;
      --text: #d4c8b0;
      --text-dim: #a09484;
      --border: #4a3828;
      --shadow: rgba(0, 0, 0, 0.5);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #1f1a14 0%, #1a1510 100%);
      color: var(--text);
      font-family: 'Cinzel', 'MedievalSharp', serif;
      min-height: 100vh;
    }
    header {
      padding: var(--v-space-2xl, 24px) 32px;
      background-color: rgba(26, 21, 16, 0.85);
      border-bottom: 1px solid var(--border);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(6px);
    }
    h1 {
      margin: 0 0 var(--v-space-md, 8px) 0;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 4px;
      text-shadow: 0 0 24px rgba(196, 149, 58, 0.4);
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-dim);
      margin: 0 0 var(--v-space-md, 8px) 0;
    }
    .controls {
      display: flex;
      gap: var(--v-space-lg, 12px);
      justify-content: center;
      margin-top: var(--v-space-md, 8px);
      flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--v-radius-xs, 4px);
      color: var(--text-dim);
      font-family: 'Cinzel', serif;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .ctrl-btn:hover { border-color: var(--gold); color: var(--gold); }
    main {
      padding: var(--v-space-2xl, 24px) var(--v-space-xl, 16px) 80px;
      max-width: 1600px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .class-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: var(--v-space-xl, 16px);
      text-align: center;
      transition: all 0.2s ease;
    }
    .class-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--shadow);
    }
    .class-icon-wrap {
      aspect-ratio: 1;
      background: rgba(0, 0, 0, 0.3);
      border-radius: var(--v-radius, 10px);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--border);
      margin-bottom: var(--v-space-lg, 12px);
      cursor: zoom-in;
      transition: all 0.2s ease;
    }
    .class-icon-wrap:hover {
      border-color: var(--gold);
    }
    .class-icon-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: var(--v-space-md-lg, 10px);
    }
    .class-icon-wrap.empty::before {
      content: '⏳';
      font-size: 48px;
      opacity: 0.4;
    }
    .class-name {
      font-size: 16px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .class-slug {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: var(--v-space-sm, 4px);
      letter-spacing: 1px;
    }
    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: zoom-out;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border: 2px solid var(--gold);
      border-radius: 8px;
      background: rgba(20, 16, 12, 0.6);
    }
    .lightbox-caption {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      color: var(--gold);
      padding: var(--v-space-md, 8px) 20px;
      border-radius: var(--v-radius-xs, 4px);
      font-size: 14px;
      letter-spacing: 2px;
    }
    @media (max-width: 768px) {
      header { padding: var(--v-space-xl, 16px) var(--v-space-lg, 12px); }
      h1 { font-size: 20px; letter-spacing: 2px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--v-space-lg, 12px); }
    }
  </style>
</head>
<body>
  <header>
    <h1>CLASSES AI — SÍMBOLOS</h1>
    <p class="subtitle">12 classes D&D 5e · ícones heráldicos AAA · clique para zoom</p>
    <div class="controls">
      <button class="ctrl-btn" id="refresh-btn">⟳ Refresh</button>
    </div>
  </header>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <script>
  (function () {
    'use strict';
    var BASE = '../shared/img/combat/';
    // 12 classes do D&D 5e — mesma ordem do simulador
    var CLASSES = [
      { slug: 'mago',         name: 'Mago' },
      { slug: 'clerigo',      name: 'Clérigo' },
      { slug: 'barbaro',      name: 'Bárbaro' },
      { slug: 'ladino',       name: 'Ladino' },
      { slug: 'guerreiro',    name: 'Guerreiro' },
      { slug: 'patrulheiro',  name: 'Patrulheiro' },
      { slug: 'paladino',     name: 'Paladino' },
      { slug: 'bardo',        name: 'Bardo' },
      { slug: 'druida',       name: 'Druida' },
      { slug: 'monge',        name: 'Monge' },
      { slug: 'feiticeiro',   name: 'Feiticeiro' },
      { slug: 'bruxo',        name: 'Bruxo' }
    ];

    function bust() { return '?v=' + Date.now(); }

    function renderCard(c) {
      var src = BASE + c.slug + '.png' + bust();
      return '<div class="class-card">' +
        '<div class="class-icon-wrap" data-slug="' + c.slug + '" data-name="' + c.name + '">' +
          '<img src="' + src + '" alt="' + c.name + '" ' +
                'onerror="this.style.display=\'none\';this.parentElement.classList.add(\'empty\');">' +
        '</div>' +
        '<div class="class-name">' + c.name + '</div>' +
        '<div class="class-slug">' + c.slug + '</div>' +
      '</div>';
    }

    function render() {
      document.getElementById('grid').innerHTML = CLASSES.map(renderCard).join('');
      bindLightbox();
    }

    function bindLightbox() {
      var lightbox = document.getElementById('lightbox');
      var lbImg = document.getElementById('lightbox-img');
      var lbCap = document.getElementById('lightbox-caption');
      document.querySelectorAll('.class-icon-wrap').forEach(function (wrap) {
        wrap.addEventListener('click', function () {
          var img = wrap.querySelector('img');
          if (!img || !img.src || img.style.display === 'none') return;
          lbImg.src = img.src;
          var name = wrap.getAttribute('data-name') || '';
          var slug = wrap.getAttribute('data-slug') || '';
          lbCap.textContent = name + ' · ' + slug;
          lightbox.classList.add('active');
        });
      });
      lightbox.addEventListener('click', function () {
        lightbox.classList.remove('active');
      });
    }

    document.getElementById('refresh-btn').addEventListener('click', render);
    render();
  })();
  </script>
</body>
</html>
