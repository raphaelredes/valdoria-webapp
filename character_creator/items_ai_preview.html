  <style>
    :root {
      --bg: #1a1510;
      --bg-card: #2a2420;
      --bg-card-hover: #332a22;
      --gold: #c4953a;
      --gold-bright: #e8c45a;
      --text: #d4c8b0;
      --text-dim: #a09484;
      --border: #4a3828;
      --shadow: rgba(0, 0, 0, 0.5);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #1f1a14 0%, #1a1510 100%);
      color: var(--text);
      font-family: 'Cinzel', 'MedievalSharp', serif;
      min-height: 100vh;
    }
    header {
      padding: 24px 32px;
      background: linear-gradient(180deg, #2a2420 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(6px);
      background-color: rgba(26, 21, 16, 0.85);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 4px;
      text-shadow: 0 0 24px rgba(196, 149, 58, 0.4);
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-dim);
      margin: 0;
    }
    .stats {
      display: flex;
      gap: 24px;
      justify-content: center;
      align-items: center;
      margin-top: 12px;
      font-size: 13px;
      flex-wrap: wrap;
    }
    .stat {
      padding: 6px 14px;
      background: rgba(196, 149, 58, 0.1);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--gold-bright);
    }
    .stat .num {
      font-weight: 700;
      font-size: 16px;
      color: var(--gold);
    }
    .progress-bar {
      width: 100%;
      max-width: 600px;
      height: 6px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 3px;
      overflow: hidden;
      margin: 12px auto 0;
      border: 1px solid var(--border);
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--gold), var(--gold-bright));
      transition: width 1s ease-out;
      box-shadow: 0 0 8px rgba(196, 149, 58, 0.6);
    }
    main {
      padding: 24px 16px 80px;
      max-width: 1600px;
      margin: 0 auto;
    }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-dim);
      font-size: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      transition: all 0.25s ease;
      position: relative;
      cursor: pointer;
      animation: slideIn 0.4s ease-out;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .item:hover {
      background: var(--bg-card-hover);
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px var(--shadow);
    }
    .item.new {
      border-color: var(--gold-bright);
      box-shadow: 0 0 12px rgba(232, 196, 90, 0.3);
    }
    .item.new::before {
      content: 'NEW';
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--gold);
      color: #1a1510;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 1px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .item-img-wrap {
      width: 100%;
      aspect-ratio: 1;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }
    .item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 8px;
    }
    .item-name {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      margin: 0 0 4px 0;
      letter-spacing: 0.5px;
      line-height: 1.3;
    }
    .item-meta {
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .item-meta .cat {
      padding: 1px 6px;
      background: rgba(196, 149, 58, 0.15);
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .item-meta .time {
      color: #888;
    }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 4px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      font-family: 'Cinzel', serif;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .ctrl-btn:hover, .ctrl-btn.active {
      border-color: var(--gold);
      color: var(--gold);
    }
    .filter-input {
      padding: 4px 12px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: 'Cinzel', serif;
      font-size: 12px;
      width: 200px;
      outline: none;
    }
    .filter-input:focus {
      border-color: var(--gold);
    }
    .error {
      color: #ff8060;
      text-align: center;
      padding: 24px;
      background: rgba(255, 128, 96, 0.1);
      border-radius: 6px;
      margin: 24px auto;
      max-width: 600px;
    }
    @media (max-width: 768px) {
      header { padding: 16px 12px; }
      h1 { font-size: 20px; letter-spacing: 2px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
      .item { padding: 10px; }
    }
  </style>

  <script>
  (function () {
    'use strict';
    var PNG_BASE = '../shared/img/items/';
    var NEW_THRESHOLD = 5 * 60 * 1000; // items added < 5min ago get NEW badge

    var state = {
      items: [],
      sort: 'newest',
      filter: '',
      paused: false,
      knownSlugs: new Set(),
    };

    function slugToTitle(slug) {
      return slug.split('-')
        .map(function (w) {
          if (w.length === 0) return w;
          // Lowercase connectives
          if (['de', 'do', 'da', 'das', 'dos', 'e'].indexOf(w) >= 0) return w;
          return w.charAt(0).toUpperCase() + w.slice(1);
        })
        .join(' ');
    }

    function timeAgo(ts) {
      if (!ts) return '--';
      var date = new Date(ts);
      var diffMs = Date.now() - date.getTime();
      if (diffMs < 0) return 'agora';
      var s = Math.floor(diffMs / 1000);
      if (s < 60) return s + 's atrás';
      var m = Math.floor(s / 60);
      if (m < 60) return m + 'min atrás';
      var h = Math.floor(m / 60);
      if (h < 24) return h + 'h atrás';
      var d = Math.floor(h / 24);
      return d + 'd atrás';
    }

    function isNew(item) {
      if (!item.timestamp) return false;
      return (Date.now() - new Date(item.timestamp).getTime()) < NEW_THRESHOLD;
    }

    function renderItem(item) {
      var newClass = isNew(item) ? ' new' : '';
      var altText = slugToTitle(item.slug).replace(/"/g, '&quot;');
      return '<div class="item' + newClass + '" data-slug="' + item.slug + '">' +
             '<div class="item-img-wrap">' +
               '<img src="' + PNG_BASE + item.slug + '.png" ' +
                    'alt="' + altText + '" loading="lazy">' +
             '</div>' +
             '<div class="item-name">' + slugToTitle(item.slug) + '</div>' +
             '<div class="item-meta">' +
               '<span class="cat">' + (item.category || '?') + '</span>' +
               '<span class="time">' + timeAgo(item.timestamp) + '</span>' +
             '</div>' +
           '</div>';
    }

    function sortItems(items, mode) {
      var sorted = items.slice();
      if (mode === 'newest') {
        sorted.sort(function (a, b) {
          return (b.timestamp || '').localeCompare(a.timestamp || '');
        });
      } else if (mode === 'oldest') {
        sorted.sort(function (a, b) {
          return (a.timestamp || '').localeCompare(b.timestamp || '');
        });
      } else if (mode === 'alpha') {
        sorted.sort(function (a, b) { return a.slug.localeCompare(b.slug); });
      } else if (mode === 'category') {
        sorted.sort(function (a, b) {
          return (a.category || '').localeCompare(b.category || '') ||
                 (b.timestamp || '').localeCompare(a.timestamp || '');
        });
      }
      return sorted;
    }

    function applyFilter(items, q) {
      if (!q) return items;
      q = q.toLowerCase().trim();
      return items.filter(function (it) {
        return it.slug.indexOf(q) !== -1 ||
               (it.category || '').indexOf(q) !== -1 ||
               slugToTitle(it.slug).toLowerCase().indexOf(q) !== -1;
      });
    }

    function render() {
      var filtered = applyFilter(state.items, state.filter);
      var sorted = sortItems(filtered, state.sort);

      var grid = document.getElementById('grid');
      var empty = document.getElementById('empty-state');

      if (sorted.length === 0) {
        empty.style.display = 'block';
        empty.textContent = state.items.length === 0
          ? 'Aguardando primeiros items...'
          : 'Nenhum item bate com o filtro "' + state.filter + '"';
        grid.style.display = 'none';
      } else {
        empty.style.display = 'none';
        grid.style.display = 'grid';
        grid.innerHTML = sorted.map(renderItem).join('');
      }

      // Stats
      document.getElementById('stat-count').textContent = state.items.length;
      var totalCost = state.items.reduce(function (s, i) { return s + (i.cost || 0); }, 0);
      document.getElementById('stat-cost').textContent = totalCost.toFixed(2);

      var newest = sortItems(state.items, 'newest')[0];
      document.getElementById('stat-last').textContent = newest ? timeAgo(newest.timestamp) : '--';

      var pct = (state.items.length / 540) * 100;
      document.getElementById('progress-fill').style.width = pct.toFixed(1) + '%';
    }

    function loadInlineData() {
      var data = window.AI_ITEMS_DATA || [];
      var newItems = data.map(function (it) {
        return {
          slug: it.slug,
          timestamp: it.timestamp,
          cost: it.cost || 0,
          quality: it.quality || '?',
          category: it.category || '?',
        };
      });

      var newCount = 0;
      newItems.forEach(function (it) {
        if (!state.knownSlugs.has(it.slug)) {
          state.knownSlugs.add(it.slug);
          newCount++;
        }
      });
      if (newCount > 0 && state.items.length > 0) {
        console.info('[items-ai] +' + newCount + ' new items');
      }

      state.items = newItems;
      document.getElementById('error-display').innerHTML = '';
      render();
    }

    function reloadPage() {
      // For "Refresh agora" — reload the page to get freshly injected data
      window.location.reload();
    }

    function setupControls() {
      document.querySelectorAll('.ctrl-btn[data-sort]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.ctrl-btn[data-sort]').forEach(function (b) {
            b.classList.remove('active');
          });
          btn.classList.add('active');
          state.sort = btn.getAttribute('data-sort');
          render();
        });
      });

      document.getElementById('filter-input').addEventListener('input', function (e) {
        state.filter = e.target.value;
        render();
      });

      document.getElementById('refresh-btn').addEventListener('click', reloadPage);

      document.getElementById('pause-btn').addEventListener('click', function () {
        state.paused = !state.paused;
        this.textContent = state.paused ? '▶ Retomar auto-reload' : '⏸ Pausar auto-reload';
        this.classList.toggle('active', state.paused);
      });
    }

    function startAutoReload() {
      // Auto-reload page every 5 min to pick up new injected data
      // (file:// blocks fetch, then data is injected server-side periodically)
      setInterval(function () {
        if (!state.paused) {
          console.info('[items-ai] auto-reloading to pick up new data...');
          window.location.reload();
        }
      }, 5 * 60 * 1000);
    }

    // Init
    setupControls();
    loadInlineData();
    startAutoReload();

    // Update timestamps every 30s (relative time display only — no reload)
    setInterval(function () {
      if (state.items.length > 0) render();
    }, 30000);

    // Show last generation time in subtitle
    if (window.AI_GENERATED_AT) {
      var sub = document.querySelector('.subtitle');
      if (sub) sub.textContent += ' · dados de: ' + window.AI_GENERATED_AT;
    }
  })();
  </script>
</body>
</html>
