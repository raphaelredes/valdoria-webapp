<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2">
  <title>Skills AI — Heraldic Icons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1510;
      --bg-card: #2a2420;
      --gold: #c4953a;
      --gold-bright: #e8c45a;
      --text: #d4c8b0;
      --text-dim: #a09484;
      --border: #4a3828;
      --shadow: rgba(0, 0, 0, 0.5);
      --attack-c: #c4453a;
      --buff-c: #c4953a;
      --heal-c: #3aa455;
      --reaction-c: #5a9ac4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #1f1a14 0%, #1a1510 100%);
      color: var(--text);
      font-family: 'Cinzel', 'MedievalSharp', serif;
      min-height: 100vh;
    }
    header {
      padding: var(--v-space-2xl, 24px) 32px;
      background-color: rgba(26, 21, 16, 0.85);
      border-bottom: 1px solid var(--border);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(6px);
    }
    h1 {
      margin: 0 0 var(--v-space-md, 8px) 0;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 4px;
      text-shadow: 0 0 24px rgba(196, 149, 58, 0.4);
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-dim);
      margin: 0 0 var(--v-space-md, 8px) 0;
    }
    .controls {
      display: flex;
      gap: var(--v-space-md, 8px);
      justify-content: center;
      margin-top: var(--v-space-md, 8px);
      flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 6px var(--v-space-lg, 12px);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--v-radius-xs, 4px);
      color: var(--text-dim);
      font-family: 'Cinzel', serif;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 1px;
    }
    .ctrl-btn:hover, .ctrl-btn.active { border-color: var(--gold); color: var(--gold); }
    .filter-input {
      padding: 6px var(--v-space-lg, 12px);
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: var(--v-radius-xs, 4px);
      color: var(--text);
      font-family: 'Cinzel', serif;
      font-size: 12px;
      min-width: 180px;
    }
    .filter-input:focus { outline: none; border-color: var(--gold); }
    main { padding: var(--v-space-xl, 16px); max-width: 1800px; margin: 0 auto; }
    .stat-bar {
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      margin-bottom: var(--v-space-xl, 16px);
      letter-spacing: 1px;
    }
    .stat-bar .num { color: var(--gold); font-weight: 700; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: var(--v-space-lg, 12px);
    }
    .skill-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--v-radius, 10px);
      padding: var(--v-space-md-lg, 10px);
      text-align: center;
      transition: all 0.2s ease;
      position: relative;
    }
    .skill-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px var(--shadow);
    }
    .skill-card.kind-attack { border-top: 2px solid var(--attack-c); }
    .skill-card.kind-buff { border-top: 2px solid var(--buff-c); }
    .skill-card.kind-heal { border-top: 2px solid var(--heal-c); }
    .skill-card.kind-reaction { border-top: 2px solid var(--reaction-c); }
    .skill-wrap {
      aspect-ratio: 1;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      margin-bottom: var(--v-space-md, 8px);
      cursor: zoom-in;
      transition: all 0.2s ease;
    }
    .skill-wrap:hover { border-color: var(--gold); }
    .skill-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 6px;
    }
    .skill-wrap.empty::before {
      content: '⏳';
      font-size: 36px;
      opacity: 0.4;
    }
    .skill-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.5px;
      line-height: 1.2;
      min-height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .skill-meta {
      font-size: 9px;
      color: var(--text-dim);
      margin-top: var(--v-space-sm, 4px);
      letter-spacing: 0.5px;
    }
    .skill-classes {
      font-size: 9px;
      color: var(--gold);
      margin-top: var(--v-space-sm, 4px);
      opacity: 0.7;
    }
    .skill-slug {
      font-size: 8px;
      color: var(--text-dim);
      margin-top: var(--v-space-sm, 4px);
      letter-spacing: 0.5px;
      opacity: 0.6;
      word-break: break-all;
    }
    /* LIGHTBOX */
    .lightbox {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none; align-items: center; justify-content: center;
      z-index: 1000; cursor: zoom-out;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 90vw; max-height: 90vh;
      object-fit: contain;
      border: 2px solid var(--gold);
      border-radius: 8px;
      background: rgba(20, 16, 12, 0.6);
    }
    .lightbox-caption {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8); color: var(--gold);
      padding: var(--v-space-md, 8px) 20px; border-radius: var(--v-radius-xs, 4px);
      font-size: 14px; letter-spacing: 2px;
    }
    @media (max-width: 768px) {
      header { padding: var(--v-space-xl, 16px) var(--v-space-lg, 12px); }
      h1 { font-size: 20px; letter-spacing: 2px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: var(--v-space-md, 8px); }
    }
  </style>
</head>
<body>
  <header>
    <h1>SKILLS AI — HERALDIC ICONS</h1>
    <p class="subtitle">135 skills D&D 5e através de 12 classes · clique para zoom</p>
    <div class="controls">
      <input type="text" id="filter-input" class="filter-input" placeholder="Filtrar por nome ou slug...">
      <button class="ctrl-btn active" data-class="all">Todos</button>
      <button class="ctrl-btn" data-class="Mago">Mago</button>
      <button class="ctrl-btn" data-class="Clérigo">Clérigo</button>
      <button class="ctrl-btn" data-class="Guerreiro">Guerreiro</button>
      <button class="ctrl-btn" data-class="Ladino">Ladino</button>
      <button class="ctrl-btn" data-class="Bárbaro">Bárbaro</button>
      <button class="ctrl-btn" data-class="Patrulheiro">Patrulheiro</button>
      <button class="ctrl-btn" data-class="Paladino">Paladino</button>
      <button class="ctrl-btn" data-class="Bardo">Bardo</button>
      <button class="ctrl-btn" data-class="Druida">Druida</button>
      <button class="ctrl-btn" data-class="Monge">Monge</button>
      <button class="ctrl-btn" data-class="Feiticeiro">Feiticeiro</button>
      <button class="ctrl-btn" data-class="Bruxo">Bruxo</button>
      <button class="ctrl-btn" id="refresh-btn">⟳</button>
    </div>
  </header>

  <main>
    <div class="stat-bar">Mostrando: <span class="num" id="count-visible">0</span> / <span class="num" id="count-total">0</span></div>
    <div id="grid" class="grid"></div>
  </main>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <script src="_skills_data_inline.js"></script>
  <script>
  (function () {
    'use strict';
    var BASE = '../shared/img/combat/skills/';
    var SKILLS = window.SKILLS_DATA || [];
    var currentClass = 'all';
    var currentFilter = '';

    function bust() { return '?v=' + Date.now(); }

    function renderCard(s) {
      var src = BASE + s.slug + '.webp' + bust();
      var meta = (s.kind || '?') + (s.dmg ? ' · ' + s.dmg : '');
      var classes = s.classes.join(', ');
      return '<div class="skill-card kind-' + (s.kind || 'unknown') +
                '" data-classes="' + classes + '" data-name="' + s.name + '" data-slug="' + s.slug + '">' +
        '<div class="skill-wrap" data-slug="' + s.slug + '" data-name="' + s.name + '">' +
          '<img src="' + src + '" alt="' + s.name + '" ' +
                'onerror="this.style.display=\'none\';this.parentElement.classList.add(\'empty\');">' +
        '</div>' +
        '<div class="skill-name">' + s.name + '</div>' +
        '<div class="skill-meta">' + meta + '</div>' +
        '<div class="skill-classes">' + classes + '</div>' +
        '<div class="skill-slug">' + s.slug + '</div>' +
      '</div>';
    }

    function render() {
      var filtered = SKILLS.filter(function (s) {
        if (currentClass !== 'all' && s.classes.indexOf(currentClass) < 0) return false;
        if (currentFilter) {
          var hay = (s.name + ' ' + s.slug + ' ' + s.classes.join(' ')).toLowerCase();
          if (hay.indexOf(currentFilter.toLowerCase()) < 0) return false;
        }
        return true;
      });
      document.getElementById('grid').innerHTML = filtered.map(renderCard).join('');
      document.getElementById('count-visible').textContent = filtered.length;
      document.getElementById('count-total').textContent = SKILLS.length;
      bindLightbox();
    }

    function bindLightbox() {
      var lightbox = document.getElementById('lightbox');
      var lbImg = document.getElementById('lightbox-img');
      var lbCap = document.getElementById('lightbox-caption');
      document.querySelectorAll('.skill-wrap').forEach(function (wrap) {
        wrap.addEventListener('click', function () {
          var img = wrap.querySelector('img');
          if (!img || !img.src || img.style.display === 'none') return;
          lbImg.src = img.src;
          var name = wrap.getAttribute('data-name') || '';
          var slug = wrap.getAttribute('data-slug') || '';
          lbCap.textContent = name + ' · ' + slug;
          lightbox.classList.add('active');
        });
      });
      lightbox.addEventListener('click', function () { lightbox.classList.remove('active'); });
    }

    document.getElementById('refresh-btn').addEventListener('click', render);
    document.getElementById('filter-input').addEventListener('input', function (e) {
      currentFilter = e.target.value;
      render();
    });
    document.querySelectorAll('.ctrl-btn[data-class]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentClass = btn.getAttribute('data-class');
        document.querySelectorAll('.ctrl-btn[data-class]').forEach(function (b) {
          b.classList.remove('active');
        });
        btn.classList.add('active');
        render();
      });
    });
    render();
  })();
  </script>
</body>
</html>
