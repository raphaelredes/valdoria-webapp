<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2">
  <title>Inimigos AI — Portraits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1510;
      --bg-card: #2a2420;
      --gold: #c4953a;
      --gold-bright: #e8c45a;
      --text: #d4c8b0;
      --text-dim: #a09484;
      --border: #4a3828;
      --shadow: rgba(0, 0, 0, 0.5);
      --red-boss: #8b1810;
      --green-fey: #2d6b3e;
      --gray-undead: #6a6a6a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #1f1a14 0%, #1a1510 100%);
      color: var(--text);
      font-family: 'Cinzel', 'MedievalSharp', serif;
      min-height: 100vh;
    }
    header {
      padding: 24px 32px;
      background-color: rgba(26, 21, 16, 0.85);
      border-bottom: 1px solid var(--border);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(6px);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 4px;
      text-shadow: 0 0 24px rgba(196, 149, 58, 0.4);
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-dim);
      margin: 0 0 8px 0;
    }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      font-family: 'Cinzel', serif;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .ctrl-btn:hover, .ctrl-btn.active { border-color: var(--gold); color: var(--gold); }
    main { padding: 24px 16px 80px; max-width: 1600px; margin: 0 auto; }
    .section { margin-bottom: 40px; }
    .section-title {
      font-size: 18px;
      color: var(--gold-bright);
      letter-spacing: 3px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      text-transform: uppercase;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .enemy-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      transition: all 0.2s ease;
    }
    .enemy-card.boss {
      border-color: var(--red-boss);
      background: linear-gradient(180deg, #2a1815 0%, #2a2420 100%);
    }
    .enemy-card:hover {
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--shadow);
    }
    .enemy-card.boss:hover { border-color: #c43820; }
    .enemy-wrap {
      aspect-ratio: 1;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--border);
      margin-bottom: 12px;
      cursor: zoom-in;
      transition: all 0.2s ease;
      position: relative;
    }
    .enemy-wrap:hover { border-color: var(--gold); }
    .enemy-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .enemy-wrap.empty::before {
      content: '⏳';
      font-size: 48px;
      opacity: 0.4;
    }
    .enemy-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 1.5px;
    }
    .enemy-slug {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 4px;
      letter-spacing: 1px;
    }
    .enemy-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      justify-content: center;
      margin-top: 8px;
    }
    .tag {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: rgba(196, 149, 58, 0.15);
      color: var(--gold);
      border: 1px solid rgba(196, 149, 58, 0.3);
    }
    .tag.undead { background: rgba(106, 106, 106, 0.15); color: var(--gray-undead); border-color: rgba(106, 106, 106, 0.3); }
    .tag.fey { background: rgba(45, 107, 62, 0.15); color: var(--green-fey); border-color: rgba(45, 107, 62, 0.3); }
    .tag.boss { background: rgba(139, 24, 16, 0.25); color: #ff4030; border-color: rgba(139, 24, 16, 0.5); font-weight: 700; }
    /* LIGHTBOX */
    .lightbox {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none; align-items: center; justify-content: center;
      z-index: 1000; cursor: zoom-out;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 90vw; max-height: 90vh;
      object-fit: contain;
      border: 2px solid var(--gold);
      border-radius: 8px;
      background: rgba(20, 16, 12, 0.6);
    }
    .lightbox-caption {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8); color: var(--gold);
      padding: 8px 20px; border-radius: 4px;
      font-size: 14px; letter-spacing: 2px;
    }
    @media (max-width: 768px) {
      header { padding: 16px 12px; }
      h1 { font-size: 20px; letter-spacing: 2px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>INIMIGOS AI — PORTRAITS</h1>
    <p class="subtitle">Portrait único por criatura do projeto · clique para zoom</p>
    <div class="controls">
      <button class="ctrl-btn" id="refresh-btn">⟳ Refresh</button>
      <button class="ctrl-btn" id="filter-all" data-filter="all">Todos</button>
      <button class="ctrl-btn" data-filter="humanoid">Humanoides</button>
      <button class="ctrl-btn" data-filter="beast">Bestas</button>
      <button class="ctrl-btn" data-filter="undead">Mortos-vivos</button>
      <button class="ctrl-btn" data-filter="caster">Conjuradores</button>
      <button class="ctrl-btn" data-filter="boss">Bosses</button>
    </div>
  </header>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <script>
  (function () {
    'use strict';
    var BASE = '../shared/img/combat/enemies/';
    // Inventory inline — sync com logs/inventory_enemies.json
    var ENEMIES = [
      { slug: 'goblin', name: 'Goblin', tags: ['humanoid'] },
      { slug: 'orc', name: 'Orc', tags: ['humanoid'] },
      { slug: 'esqueleto', name: 'Esqueleto', tags: ['undead'] },
      { slug: 'aranha-gigante', name: 'Aranha Gigante', tags: ['beast'] },
      { slug: 'sapo-gigante', name: 'Sapo Gigante', tags: ['beast'] },
      { slug: 'homem-lagarto', name: 'Homem-Lagarto', tags: ['humanoid'] },
      { slug: 'crocodilo', name: 'Crocodilo', tags: ['beast'] },
      { slug: 'cobra-constritora-gigante', name: 'Cobra Constritora Gigante', tags: ['beast'] },
      { slug: 'bruxa-verde', name: 'Bruxa Verde', tags: ['fey'] },
      { slug: 'mimico', name: 'Mímico', tags: ['monstrosity'] },
      { slug: 'acolito', name: 'Acólito', tags: ['humanoid', 'caster'] },
      { slug: 'aprendiz-de-mago', name: 'Aprendiz de Mago', tags: ['humanoid', 'caster'] },
      { slug: 'cultista-fanatico', name: 'Cultista Fanático', tags: ['humanoid', 'caster'] },
      { slug: 'mago-hostil', name: 'Mago Hostil', tags: ['humanoid', 'caster'] },
      { slug: 'lobo', name: 'Lobo', tags: ['beast'] },
      { slug: 'bandido', name: 'Bandido', tags: ['humanoid'] },
      { slug: 'orc-guerreiro', name: 'Orc Guerreiro', tags: ['humanoid'] },
      { slug: 'fogo-fatuo', name: 'Fogo-Fátuo', tags: ['undead'] },
      { slug: 'troll', name: 'Troll', tags: ['giant'] },
      { slug: 'zumbi', name: 'Zumbi', tags: ['undead'] },
      { slug: 'aguia-gigante', name: 'Águia Gigante', tags: ['beast'] },
      { slug: 'escorpiao-gigante', name: 'Escorpião Gigante', tags: ['beast'] },
      { slug: 'leao-da-areia', name: 'Leão da Areia', tags: ['beast'] },
      { slug: 'yeti-congelado', name: 'Yeti Congelado', tags: ['monstrosity'] },
      { slug: 'lobo-da-tundra', name: 'Lobo da Tundra', tags: ['beast'] },
      { slug: 'troll-das-cavernas', name: 'Troll das Cavernas', tags: ['giant'] },
      { slug: 'morcego-gigante', name: 'Morcego Gigante', tags: ['beast'] },
      { slug: 'elemental-de-lava-menor', name: 'Elemental de Lava (Menor)', tags: ['elemental'] },
      { slug: 'brakthar', name: 'Brakthar (Chefe Orc)', tags: ['humanoid', 'boss'] }
    ];

    var currentFilter = 'all';
    function bust() { return '?v=' + Date.now(); }

    function tagClass(t) {
      if (t === 'undead') return 'undead';
      if (t === 'fey') return 'fey';
      if (t === 'boss') return 'boss';
      return '';
    }

    function renderCard(e) {
      var src = BASE + e.slug + '.webp' + bust();
      var isBoss = e.tags.indexOf('boss') >= 0;
      var tagsHtml = e.tags.map(function (t) {
        return '<span class="tag ' + tagClass(t) + '">' + t + '</span>';
      }).join('');
      return '<div class="enemy-card' + (isBoss ? ' boss' : '') +
                '" data-tags="' + e.tags.join(' ') + '">' +
        '<div class="enemy-wrap" data-slug="' + e.slug + '" data-name="' + e.name + '">' +
          '<img src="' + src + '" alt="' + e.name + '" ' +
                'onerror="this.style.display=\'none\';this.parentElement.classList.add(\'empty\');">' +
        '</div>' +
        '<div class="enemy-name">' + e.name + '</div>' +
        '<div class="enemy-slug">' + e.slug + '</div>' +
        '<div class="enemy-tags">' + tagsHtml + '</div>' +
      '</div>';
    }

    function render() {
      var filtered = currentFilter === 'all' ? ENEMIES :
        ENEMIES.filter(function (e) { return e.tags.indexOf(currentFilter) >= 0; });
      document.getElementById('grid').innerHTML = filtered.map(renderCard).join('');
      bindLightbox();
    }

    function bindLightbox() {
      var lightbox = document.getElementById('lightbox');
      var lbImg = document.getElementById('lightbox-img');
      var lbCap = document.getElementById('lightbox-caption');
      document.querySelectorAll('.enemy-wrap').forEach(function (wrap) {
        wrap.addEventListener('click', function () {
          var img = wrap.querySelector('img');
          if (!img || !img.src || img.style.display === 'none') return;
          lbImg.src = img.src;
          var name = wrap.getAttribute('data-name') || '';
          var slug = wrap.getAttribute('data-slug') || '';
          lbCap.textContent = name + ' · ' + slug;
          lightbox.classList.add('active');
        });
      });
      lightbox.addEventListener('click', function () { lightbox.classList.remove('active'); });
    }

    document.getElementById('refresh-btn').addEventListener('click', render);
    document.querySelectorAll('.ctrl-btn[data-filter]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        currentFilter = btn.getAttribute('data-filter');
        document.querySelectorAll('.ctrl-btn[data-filter]').forEach(function (b) {
          b.classList.remove('active');
        });
        btn.classList.add('active');
        render();
      });
    });
    document.getElementById('filter-all').classList.add('active');
    render();
  })();
  </script>
</body>
</html>
