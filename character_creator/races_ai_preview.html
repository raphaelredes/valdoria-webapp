<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2">
  <title>Raças AI — Generated Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1510;
      --bg-card: #2a2420;
      --bg-card-hover: #332a22;
      --gold: #c4953a;
      --gold-bright: #e8c45a;
      --text: #d4c8b0;
      --text-dim: #a09484;
      --border: #4a3828;
      --shadow: rgba(0, 0, 0, 0.5);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #1f1a14 0%, #1a1510 100%);
      color: var(--text);
      font-family: 'Cinzel', 'MedievalSharp', serif;
      min-height: 100vh;
    }
    header {
      padding: 24px 32px;
      background: linear-gradient(180deg, #2a2420 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(6px);
      background-color: rgba(26, 21, 16, 0.85);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 4px;
      text-shadow: 0 0 24px rgba(196, 149, 58, 0.4);
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-dim);
      margin: 0 0 8px 0;
    }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      font-family: 'Cinzel', serif;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .ctrl-btn:hover, .ctrl-btn.active {
      border-color: var(--gold);
      color: var(--gold);
    }
    main {
      padding: 24px 16px 80px;
      max-width: 1800px;
      margin: 0 auto;
    }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-dim);
      font-size: 16px;
    }
    .grid {
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    .race-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.25s ease;
    }
    .race-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--gold);
    }
    .race-name {
      font-size: 24px;
      font-weight: 700;
      color: var(--gold);
      margin: 0 0 20px 0;
      letter-spacing: 3px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .race-portraits {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }
    .portrait-wrap {
      aspect-ratio: 1;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--border);
      position: relative;
      cursor: zoom-in;
      transition: all 0.25s ease;
    }
    .portrait-wrap:hover {
      border-color: var(--gold);
      transform: scale(1.04);
      box-shadow: 0 8px 24px var(--shadow);
      z-index: 10;
    }
    .portrait-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .portrait-wrap.empty::before {
      content: '⏳';
      font-size: 48px;
      opacity: 0.4;
    }
    .portrait-label {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: var(--gold);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 5px;
      letter-spacing: 1px;
      border: 1px solid var(--border);
    }
    /* LIGHTBOX for full-size view on click */
    .lightbox {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: zoom-out;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border: 2px solid var(--gold);
      border-radius: 8px;
    }
    .lightbox-caption {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: var(--gold);
      padding: 8px 20px;
      border-radius: 4px;
      font-size: 14px;
      letter-spacing: 2px;
    }
    @media (max-width: 768px) {
      header { padding: 16px 12px; }
      h1 { font-size: 20px; letter-spacing: 2px; }
      .race-portraits { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>RAÇAS AI — PREVIEW</h1>
    <p class="subtitle">AI-generated race portraits (gpt-image-2) · M + F versions · D&D 5e canonical</p>
    <div class="controls">
      <button class="ctrl-btn" id="refresh-btn">⟳ Refresh</button>
    </div>
  </header>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <script>
  (function () {
    'use strict';
    var RACE_BASE = 'races/';
    var RACES = [
      'Human', 'Elf', 'Dwarf', 'Halfling', 'Gnome',
      'HalfElf', 'HalfOrc', 'Dragonborn', 'Tiefling',
    ];
    var VARIANTS = ['default', 'warrior', 'noble', 'mystic', 'wild', 'veteran'];

    function portraitImg(race, gender, variant) {
      var variantSuffix = variant === 'default' ? '' : '_' + variant;
      var genderSuffix = gender === 'F' ? '-f' : '';
      var bust = Date.now();
      var src = RACE_BASE + race + variantSuffix + genderSuffix + '.png?v=' + bust;
      return '<div class="portrait-wrap">' +
        '<img src="' + src + '" alt="' + race + ' ' + variant + ' ' + gender + '" ' +
              'onerror="this.style.display=\'none\';this.parentElement.classList.add(\'empty\');">' +
        '<span class="portrait-label">' + gender + ' · ' + variant + '</span>' +
      '</div>';
    }

    function symbolImg(race, option) {
      var bust = Date.now();
      var suffix = option === 1 ? '' : '_opt' + option;
      var src = RACE_BASE + race + suffix + '.png?v=' + bust;
      return '<div class="portrait-wrap" style="aspect-ratio:1">' +
        '<img src="' + src + '" alt="' + race + ' opt' + option + '" ' +
              'onerror="this.style.display=\'none\';this.parentElement.classList.add(\'empty\');">' +
        '<span class="portrait-label">OPT ' + option + '</span>' +
      '</div>';
    }

    function renderCard(race) {
      var html = '';
      for (var i = 1; i <= 6; i++) {
        html += symbolImg(race, i);
      }
      return '<div class="race-card">' +
        '<div class="race-name">' + race + ' — 6 symbol options</div>' +
        '<div class="race-portraits">' +
          html +
        '</div>' +
      '</div>';
    }

    function render() {
      document.getElementById('grid').innerHTML = RACES.map(renderCard).join('');
      bindLightbox();
    }

    function bindLightbox() {
      var lightbox = document.getElementById('lightbox');
      var lbImg = document.getElementById('lightbox-img');
      var lbCap = document.getElementById('lightbox-caption');
      document.querySelectorAll('.portrait-wrap').forEach(function (wrap) {
        wrap.addEventListener('click', function () {
          var img = wrap.querySelector('img');
          if (!img || !img.src) return;
          lbImg.src = img.src;
          var label = wrap.querySelector('.portrait-label');
          lbCap.textContent = label ? label.textContent : '';
          lightbox.classList.add('active');
        });
      });
      lightbox.addEventListener('click', function () {
        lightbox.classList.remove('active');
      });
    }

    document.getElementById('refresh-btn').addEventListener('click', render);
    render();
  })();
  </script>
</body>
</html>
