<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2">
  <title>Raças AI — Generated Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1510;
      --bg-card: #2a2420;
      --bg-card-hover: #332a22;
      --gold: #c4953a;
      --gold-bright: #e8c45a;
      --text: #d4c8b0;
      --text-dim: #a09484;
      --border: #4a3828;
      --shadow: rgba(0, 0, 0, 0.5);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #1f1a14 0%, #1a1510 100%);
      color: var(--text);
      font-family: 'Cinzel', 'MedievalSharp', serif;
      min-height: 100vh;
    }
    header {
      padding: 24px 32px;
      background: linear-gradient(180deg, #2a2420 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(6px);
      background-color: rgba(26, 21, 16, 0.85);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 4px;
      text-shadow: 0 0 24px rgba(196, 149, 58, 0.4);
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-dim);
      margin: 0 0 8px 0;
    }
    .controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      font-family: 'Cinzel', serif;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .ctrl-btn:hover, .ctrl-btn.active {
      border-color: var(--gold);
      color: var(--gold);
    }
    main {
      padding: 24px 16px 80px;
      max-width: 1600px;
      margin: 0 auto;
    }
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-dim);
      font-size: 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .race-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      transition: all 0.25s ease;
    }
    .race-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--gold);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px var(--shadow);
    }
    .race-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--gold);
      margin: 0 0 12px 0;
      letter-spacing: 2px;
    }
    .race-portraits {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .portrait-wrap {
      aspect-ratio: 1;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      position: relative;
    }
    .portrait-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .portrait-wrap.empty::before {
      content: '⏳';
      font-size: 32px;
      opacity: 0.4;
    }
    .portrait-label {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: var(--gold);
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      letter-spacing: 1px;
    }
    @media (max-width: 768px) {
      header { padding: 16px 12px; }
      h1 { font-size: 20px; letter-spacing: 2px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>RAÇAS AI — PREVIEW</h1>
    <p class="subtitle">AI-generated race portraits (gpt-image-2) · M + F versions · D&D 5e canonical</p>
    <div class="controls">
      <button class="ctrl-btn" id="refresh-btn">⟳ Refresh</button>
    </div>
  </header>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <script>
  (function () {
    'use strict';
    var RACE_BASE = 'races/';
    var RACES = [
      'Human', 'Elf', 'Dwarf', 'Halfling', 'Gnome',
      'HalfElf', 'HalfOrc', 'Dragonborn', 'Tiefling',
    ];

    function renderCard(race) {
      var bust = Date.now();
      return '<div class="race-card">' +
        '<div class="race-name">' + race + '</div>' +
        '<div class="race-portraits">' +
          '<div class="portrait-wrap">' +
            '<img src="' + RACE_BASE + race + '.png?v=' + bust + '" ' +
                  'alt="' + race + ' male" ' +
                  'onerror="this.style.display=\'none\';this.parentElement.classList.add(\'empty\');">' +
            '<span class="portrait-label">M</span>' +
          '</div>' +
          '<div class="portrait-wrap">' +
            '<img src="' + RACE_BASE + race + '-f.png?v=' + bust + '" ' +
                  'alt="' + race + ' female" ' +
                  'onerror="this.style.display=\'none\';this.parentElement.classList.add(\'empty\');">' +
            '<span class="portrait-label">F</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    function render() {
      document.getElementById('grid').innerHTML = RACES.map(renderCard).join('');
    }

    document.getElementById('refresh-btn').addEventListener('click', render);
    render();
  })();
  </script>
</body>
</html>
