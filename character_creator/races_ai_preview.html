<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2">
  <title>Raças AI — Símbolos Oficiais</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a1510;
      --bg-card: #2a2420;
      --bg-card-hover: #332a22;
      --gold: #c4953a;
      --gold-bright: #e8c45a;
      --text: #d4c8b0;
      --text-dim: #a09484;
      --border: #4a3828;
      --shadow: rgba(0, 0, 0, 0.5);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #1f1a14 0%, #1a1510 100%);
      color: var(--text);
      font-family: 'Cinzel', 'MedievalSharp', serif;
      min-height: 100vh;
    }
    header {
      padding: var(--v-space-2xl, 24px) 32px;
      background: linear-gradient(180deg, #2a2420 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(6px);
      background-color: rgba(26, 21, 16, 0.85);
    }
    h1 {
      margin: 0 0 var(--v-space-md, 8px) 0;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 4px;
      text-shadow: 0 0 24px rgba(196, 149, 58, 0.4);
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-dim);
      margin: 0 0 var(--v-space-md, 8px) 0;
    }
    .controls {
      display: flex;
      gap: var(--v-space-lg, 12px);
      justify-content: center;
      margin-top: var(--v-space-md, 8px);
      flex-wrap: wrap;
    }
    .ctrl-btn {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: var(--v-radius-xs, 4px);
      color: var(--text-dim);
      font-family: 'Cinzel', serif;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .ctrl-btn:hover, .ctrl-btn.active {
      border-color: var(--gold);
      color: var(--gold);
    }
    main {
      padding: var(--v-space-2xl, 24px) var(--v-space-xl, 16px) 80px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--v-space-2xl, 24px);
    }
    .race-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px var(--v-space-xl, 16px);
      transition: all 0.25s ease;
      text-align: center;
    }
    .race-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--gold);
    }
    .race-name {
      font-size: 22px;
      font-weight: 700;
      color: var(--gold);
      margin: 0 0 var(--v-space-sm, 4px) 0;
      letter-spacing: 3px;
    }
    .race-opt-label {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 2px;
      margin-bottom: var(--v-space-lg, 12px);
      text-transform: uppercase;
    }
    .race-opt-label .num {
      color: var(--gold-bright);
      font-weight: 700;
    }
    .official-portrait {
      aspect-ratio: 1;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--gold);
      position: relative;
      cursor: zoom-in;
      transition: all 0.25s ease;
      box-shadow: 0 0 24px rgba(196, 149, 58, 0.2),
                  inset 0 0 24px rgba(196, 149, 58, 0.05);
      margin-bottom: var(--v-space-lg, 12px);
    }
    .official-portrait:hover {
      border-color: var(--gold-bright);
      transform: scale(1.02);
      box-shadow: 0 8px 32px var(--shadow),
                  0 0 32px rgba(232, 196, 90, 0.3);
    }
    .official-portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .official-portrait.empty::before {
      content: '⏳';
      font-size: 48px;
      opacity: 0.4;
    }
    .official-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(196, 149, 58, 0.95);
      color: #1a1510;
      font-size: 10px;
      font-weight: 700;
      padding: 3px var(--v-space-md, 8px);
      border-radius: var(--v-radius-xs, 4px);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .alt-options {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: var(--v-space-lg, 12px);
      padding-top: var(--v-space-lg, 12px);
      border-top: 1px solid var(--border);
    }
    .alt-options-label {
      font-size: 9px;
      color: var(--text-dim);
      letter-spacing: 1.5px;
      margin-bottom: var(--v-space-md, 8px);
      text-transform: uppercase;
      opacity: 0.7;
    }
    .alt-opt {
      aspect-ratio: 1;
      background: rgba(0, 0, 0, 0.2);
      border-radius: var(--v-radius-sm, 6px);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: zoom-in;
      opacity: 0.45;
      transition: all 0.2s ease;
      position: relative;
    }
    .alt-opt:hover {
      opacity: 1;
      border-color: var(--gold);
      transform: scale(1.1);
    }
    .alt-opt img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .alt-opt.empty::before {
      content: '·';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      color: var(--text-dim);
      opacity: 0.4;
    }
    .alt-opt-num {
      position: absolute;
      bottom: 2px;
      right: 2px;
      background: rgba(0, 0, 0, 0.8);
      color: var(--text-dim);
      font-size: 8px;
      font-weight: 700;
      padding: 1px var(--v-space-sm, 4px);
      border-radius: 3px;
      line-height: 1;
    }
    /* LIGHTBOX */
    .lightbox {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: zoom-out;
    }
    .lightbox.active { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border: 2px solid var(--gold);
      border-radius: 8px;
    }
    .lightbox-caption {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: var(--gold);
      padding: var(--v-space-md, 8px) 20px;
      border-radius: var(--v-radius-xs, 4px);
      font-size: 14px;
      letter-spacing: 2px;
    }
    @media (max-width: 768px) {
      header { padding: var(--v-space-xl, 16px) var(--v-space-lg, 12px); }
      h1 { font-size: 20px; letter-spacing: 2px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: var(--v-space-xl, 16px); }
      .race-card { padding: 14px var(--v-space-md-lg, 10px); }
      .race-name { font-size: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>RAÇAS — SÍMBOLOS OFICIAIS</h1>
    <p class="subtitle">Símbolos canônicos selecionados (1 por raça) · alternativas dimmed</p>
    <div class="controls">
      <button class="ctrl-btn" id="refresh-btn">⟳ Refresh</button>
      <button class="ctrl-btn" id="toggle-alt-btn">Mostrar alternativas: ON</button>
    </div>
  </header>

  <main>
    <div id="grid" class="grid"></div>
  </main>

  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <script>
  (function () {
    'use strict';
    var RACE_BASE = 'races/';

    // Mapeamento canônico: race -> opt selecionado pelo usuário (2026-05-16)
    var OFFICIAL = {
      Human:      3,
      Elf:        3,
      Dwarf:      2,
      Halfling:   1,
      Gnome:      1,
      HalfElf:    4,
      HalfOrc:    1,
      Dragonborn: 4,
      Tiefling:   6,
    };

    // Render order — preserva ordem do D&D 5e PHB
    var RACE_ORDER = ['Human','Elf','Dwarf','Halfling','Gnome',
                      'HalfElf','HalfOrc','Dragonborn','Tiefling'];

    var showAlt = true;

    function bustParam() { return '?v=' + Date.now(); }

    function fileFor(race, opt) {
      var suffix = opt === 1 ? '' : '_opt' + opt;
      return RACE_BASE + race + suffix + '.webp' + bustParam();
    }

    function officialImg(race, opt) {
      var src = fileFor(race, opt);
      return '<div class="official-portrait" data-race="' + race + '" data-opt="' + opt + '">' +
        '<img src="' + src + '" alt="' + race + ' opt' + opt + '" ' +
              'onerror="this.style.display=\'none\';this.parentElement.classList.add(\'empty\');">' +
        '<span class="official-badge">Oficial · opt ' + opt + '</span>' +
      '</div>';
    }

    function altImg(race, opt) {
      var src = fileFor(race, opt);
      return '<div class="alt-opt" data-race="' + race + '" data-opt="' + opt + '">' +
        '<img src="' + src + '" alt="' + race + ' opt' + opt + '" ' +
              'onerror="this.style.display=\'none\';this.parentElement.classList.add(\'empty\');">' +
        '<span class="alt-opt-num">' + opt + '</span>' +
      '</div>';
    }

    function renderCard(race) {
      var chosen = OFFICIAL[race] || 1;
      var altHTML = '';
      if (showAlt) {
        var alts = '';
        for (var i = 1; i <= 6; i++) {
          if (i === chosen) continue;
          alts += altImg(race, i);
        }
        altHTML =
          '<div class="alt-options-label">Alternativas</div>' +
          '<div class="alt-options">' + alts + '</div>';
      }
      return '<div class="race-card">' +
        '<div class="race-name">' + race + '</div>' +
        '<div class="race-opt-label">Símbolo · opt <span class="num">' + chosen + '</span></div>' +
        officialImg(race, chosen) +
        altHTML +
      '</div>';
    }

    function render() {
      document.getElementById('grid').innerHTML = RACE_ORDER.map(renderCard).join('');
      bindLightbox();
    }

    function bindLightbox() {
      var lightbox = document.getElementById('lightbox');
      var lbImg = document.getElementById('lightbox-img');
      var lbCap = document.getElementById('lightbox-caption');
      var allBoxes = document.querySelectorAll('.official-portrait, .alt-opt');
      allBoxes.forEach(function (wrap) {
        wrap.addEventListener('click', function () {
          var img = wrap.querySelector('img');
          if (!img || !img.src || img.style.display === 'none') return;
          lbImg.src = img.src;
          var race = wrap.getAttribute('data-race') || '';
          var opt = wrap.getAttribute('data-opt') || '';
          lbCap.textContent = race + ' · opt ' + opt;
          lightbox.classList.add('active');
        });
      });
      lightbox.addEventListener('click', function () {
        lightbox.classList.remove('active');
      });
    }

    document.getElementById('refresh-btn').addEventListener('click', render);
    document.getElementById('toggle-alt-btn').addEventListener('click', function () {
      showAlt = !showAlt;
      this.textContent = 'Mostrar alternativas: ' + (showAlt ? 'ON' : 'OFF');
      render();
    });
    render();
  })();
  </script>
</body>
</html>
