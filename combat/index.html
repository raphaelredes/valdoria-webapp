                <circle class="mc-energy-arc mc-arc-2" cx="150" cy="150" r="96" fill="none" stroke="rgba(123,32,32,0.5)" stroke-width="1.5" stroke-linecap="round"/>
            </svg>

    <!-- Loading controller (narrative tips + min load) -->
    <script>
    (function() {
        var TIPS = [
            'Sua mão encontra o cabo da arma enquanto você se posiciona para o combate...',
            'O chão treme sob seus pés — o inimigo se aproxima...',
            'Você respira fundo e foca a mente. Cada segundo conta numa batalha.',
            'O brilho de aço reflete nos olhos do adversário à sua frente...',
            'Adrenalina percorre suas veias enquanto o confronto se aproxima...',
            'Você analisa o terreno, buscando vantagem tática...',
            'O som de armaduras tilintando ecoa enquanto ambos os lados se preparam...',
            'Uma brisa fria corta o ar tenso entre você e seu oponente...',
            '⚔️ Dica: Rolagens de ataque 20 são acertos críticos — dano dobrado!',
            '🛡️ Dica: Cobertura parcial concede +2 na CA contra ataques à distância.',
            '⚔️ Dica: Ações bônus como Investida Imprudente podem virar o jogo.',
            '🛡️ Dica: Efeitos de status como Amedrontado impõem desvantagem nos ataques.',
            '⚔️ Dica: Posicionamento tático pode garantir ataques de oportunidade.',
            '🛡️ Dica: Curar-se no momento certo pode ser melhor que atacar.',
            '⚔️ Dica: Habilidades de classe têm usos limitados — use com sabedoria.',
            '🛡️ Dica: Resistência a dano reduz o dano recebido pela metade.',
        ];
        var tipEl = document.getElementById('loading-tip');
        var progressEl = document.getElementById('loading-progress');
        var overlay = document.getElementById('combatLoading');
        var tipIndex = Math.floor(Math.random() * TIPS.length);
        if (tipEl) tipEl.textContent = TIPS[tipIndex];
        var _tipInterval;
        var _loadStart = '20260314';
        var MIN_LOAD_MS = window.VALDORIA_MIN_LOAD_MS || 5000;
        var _progress = 0;

        var _progressTimer = setInterval(function() {
            _progress += (90 - _progress) * 0.08;
            if (progressEl) progressEl.style.width = _progress + '%';
        }, 200);

        _tipInterval = setInterval(function() {
            tipIndex = (tipIndex + 1) % TIPS.length;
            if (tipEl) {
                tipEl.classList.add('tip-exit');
                setTimeout(function() {
                    tipEl.textContent = TIPS[tipIndex];
                    tipEl.classList.remove('tip-exit');
                    tipEl.classList.add('tip-enter');
                    setTimeout(function() { tipEl.classList.remove('tip-enter'); }, 350);
                }, 300);
            }
        }, 5000);

        window._combatLoadingCtrl = {
            hide: function() {
                clearInterval(_tipInterval);
                clearInterval(_progressTimer);
                if (!overlay || overlay.classList.contains('hidden')) return;
                var elapsed = '20260314' - _loadStart;
                var remaining = MIN_LOAD_MS - elapsed;
                if (remaining > 0) {
                    setTimeout(function() { window._combatLoadingCtrl.hide(); }, remaining);
                    return;
                }
                if (progressEl) progressEl.style.width = '100%';
                var waves = overlay.querySelectorAll('.mc-completion-wave');
                waves.forEach(function(w) { w.classList.add('active'); });
                try {
                    if (window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
                        Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
                    }
                } catch(_) {}
                setTimeout(function() {
                    overlay.classList.add('exit-cinematic');
                    setTimeout(function() {
                        overlay.classList.add('hidden');
                    }, 950);
                }, 150);
            }
        };
    })();
    </script>
