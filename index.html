<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="theme-color" content="#2a2420">
    <meta name="description" content="Lendas de Valdoria - RPG medieval de fantasia via Telegram, inspirado em D&D 5e">
    <meta property="og:title" content="Lendas de Valdoria">
    <meta property="og:description"
        content="RPG medieval de fantasia via Telegram com dados 3D, criador de personagens e oficina de artesanato">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.json">
    <title>Lendas de Valdoria</title>
    <link rel="preload" href="shared/fonts/medievalsharp.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="shared/fonts.css">
    <script src="shared/font-apply.js"></script>
    <script>
        var v = Date.now();
        var lk = document.createElement('link');
        lk.rel = 'stylesheet';
        lk.href = 'valdoria-design.css?v=' + v;
        document.head.appendChild(lk);
        var lk2 = document.createElement('link');
        lk2.rel = 'stylesheet';
        lk2.href = 'shared/loading-title.css?v=' + v;
        document.head.appendChild(lk2);
    </script>
    <style>
        html {
            background: var(--v-bg-deep, #1a1510);
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
        }

        /* ─── Hero Header ─── */
        .hero {
            width: 100%;
            padding: 28px 16px 24px;
            text-align: center;
            background: radial-gradient(ellipse at 50% 60%, #3a2e20 0%, var(--v-bg, #2a2420) 70%);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--v-crimson, #7b2020), var(--v-gold, #c4953a), var(--v-crimson, #7b2020), transparent);
        }

        /* ── Hero particles ── */
        .hero-particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .hero-particles .hp {
            position: absolute;
            border-radius: 50%;
            background: var(--v-gold, #c4953a);
            opacity: 0;
            animation: heroEmber 16s ease-in infinite;
        }

        .hero-particles .hp:nth-child(1) { left: 15%; bottom: -4px; width: 2px; height: 2px; animation-delay: 0s; }
        .hero-particles .hp:nth-child(2) { left: 40%; bottom: -4px; width: 3px; height: 3px; animation-delay: 3s; }
        .hero-particles .hp:nth-child(3) { left: 65%; bottom: -4px; width: 2px; height: 2px; animation-delay: 1.5s; }
        .hero-particles .hp:nth-child(4) { left: 85%; bottom: -4px; width: 2px; height: 2px; animation-delay: 5s; }

        @keyframes heroEmber {
            0% { opacity: 0; transform: translateY(0) translateX(0); }
            10% { opacity: 0.6; }
            50% { opacity: 0.4; transform: translateY(-120px) translateX(10px); }
            80% { opacity: 0.1; }
            100% { opacity: 0; transform: translateY(-220px) translateX(-6px); }
        }

        /* ── Hero Orb — override title-orb-wrap for inline use ── */
        .hero .title-orb-wrap {
            margin: 0 auto var(--v-space-lg, 12px);
            animation: fadeSlideIn 0.8s ease 0.1s both, titleOrbFloat 6s ease-in-out 0.9s infinite;
        }

        /* ── Hero title ── */
        .hero-title {
            margin: 0 0 var(--v-space-md, 8px);
            animation: fadeSlideIn 0.6s ease 0.2s both;
        }

        .hero-title-top {
            display: block;
            font-family: var(--v-font-display, 'Cinzel', serif);
            font-weight: 700;
            font-size: clamp(22px, 7vw, 32px);
            color: var(--v-gold, #c4953a);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(196, 149, 58, 0.4), 0 0 40px rgba(196, 149, 58, 0.2);
            line-height: 1.2;
        }

        .hero-title-sub {
            display: block;
            font-family: var(--v-font-display, 'Cinzel', serif);
            font-weight: 700;
            font-size: clamp(28px, 9vw, 42px);
            color: var(--v-gold, #c4953a);
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 25px rgba(196, 149, 58, 0.5), 0 0 50px rgba(196, 149, 58, 0.25);
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: var(--v-font-base, 13px);
            color: var(--v-text-dim, #a09484);
            letter-spacing: 1px;
            animation: fadeSlideIn 0.6s ease 0.3s both;
        }

        /* ── Hero divider ── */
        .hero-divider {
            width: 60%;
            max-width: 200px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--v-gold-dim, #9a7530), transparent);
            margin: var(--v-space-xl, 16px) auto 0;
            position: relative;
            animation: fadeSlideIn 0.6s ease 0.35s both;
        }

        .hero-divider::after {
            content: '\25C6';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8px;
            color: var(--v-gold-dim, #9a7530);
            background: var(--v-bg, #2a2420);
            padding: 0 8px;
        }

        /* ── Hero CTA ── */
        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: var(--v-space-md, 8px);
            margin-top: var(--v-space-xl, 16px);
            padding: 12px 28px;
            background: linear-gradient(135deg, var(--v-gold, #c4953a), var(--v-gold-dim, #9a7530));
            color: var(--v-bg, #2a2420);
            border: none;
            border-radius: var(--v-radius, 10px);
            font-family: var(--v-font-display, 'Cinzel', serif);
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform var(--v-transition-fast, 0.15s ease), box-shadow var(--v-transition-fast, 0.15s ease);
            box-shadow: 0 4px 16px rgba(196, 149, 58, 0.3), 0 2px 8px rgba(0, 0, 0, 0.4);
            animation: fadeSlideIn 0.6s ease 0.45s both;
        }

        .hero-cta:active {
            transform: scale(0.96);
        }

        .hero-cta-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--v-space-md, 8px);
            margin-top: var(--v-space-xl, 16px);
            animation: fadeSlideIn 0.6s ease 0.45s both;
        }

        .hero-cta-group .hero-cta {
            margin-top: 0;
        }

        .hero-cta-alt {
            background: transparent !important;
            border: 1px solid var(--v-gold, #c4953a);
            color: var(--v-gold, #c4953a) !important;
            box-shadow: 0 0 12px rgba(196, 149, 58, 0.15);
        }

        .final-cta-alt {
            background: transparent !important;
            border: 1px solid var(--v-gold, #c4953a);
            color: var(--v-gold, #c4953a) !important;
            box-shadow: 0 0 12px rgba(196, 149, 58, 0.15);
        }

        .section-label {
            font-family: var(--v-font-display, 'Cinzel', serif);
            font-size: var(--v-font-sm, 11px);
            color: var(--v-text-dim, #a09484);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: var(--v-space-lg, 12px);
        }

        /* ─── Support Section ─── */
        .support-section {
            width: 100%;
            max-width: 380px;
            padding: 0 var(--v-space-lg, 12px) var(--v-space-xl, 16px);
        }

        .support-card {
            display: flex;
            align-items: center;
            gap: var(--v-space-lg, 12px);
            padding: var(--v-space-lg, 12px) var(--v-space-xl, 16px);
            background: linear-gradient(165deg, var(--v-bg-card, #2e2520) 0%, #241e18 100%);
            border: 1px solid rgba(196, 149, 58, 0.25);
            border-radius: var(--v-radius, 10px);
            text-decoration: none;
            cursor: pointer;
            transition: all var(--v-transition-base, 0.3s ease);
            box-shadow: var(--v-shadow-sm, 0 2px 8px rgba(0, 0, 0, 0.3));
            animation: fadeSlideIn 0.4s ease 0.5s both;
        }

        .support-card:active {
            transform: scale(0.97);
        }

        .support-card:hover {
            border-color: var(--v-gold-dim, #9a7530);
            box-shadow: var(--v-shadow-gold, 0 0 12px rgba(196, 149, 58, 0.25));
        }

        .support-icon {
            font-size: var(--v-font-icon, 28px);
            flex-shrink: 0;
        }

        .support-info {
            text-align: left;
        }

        .support-name {
            font-family: var(--v-font-display, 'Cinzel', serif);
            font-size: var(--v-font-body, 14px);
            font-weight: 700;
            color: var(--v-text-bright, #e8dcc8);
            margin-bottom: var(--v-space-xs, 2px);
        }

        .support-desc {
            font-size: var(--v-font-sm, 11px);
            color: var(--v-text-dim, #a09484);
            line-height: 1.3;
        }

        /* ─── Final CTA Block ─── */
        .final-cta {
            width: 100%;
            padding: var(--v-space-2xl, 24px) var(--v-space-xl, 16px);
            text-align: center;
            background: linear-gradient(180deg, transparent 0%, rgba(26, 21, 16, 0.6) 100%);
            margin-top: var(--v-space-md, 8px);
        }

        .final-cta-text {
            font-family: var(--v-font-display, 'Cinzel', serif);
            font-size: var(--v-font-lg, 15px);
            color: var(--v-text-dim, #a09484);
            letter-spacing: 1px;
            margin-bottom: var(--v-space-lg, 12px);
        }

        .final-cta-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--v-space-md, 8px);
            padding: 10px 24px;
            background: linear-gradient(135deg, var(--v-gold, #c4953a), var(--v-gold-dim, #9a7530));
            color: var(--v-bg, #2a2420);
            border: none;
            border-radius: var(--v-radius, 10px);
            font-family: var(--v-font-display, 'Cinzel', serif);
            font-size: var(--v-font-body, 14px);
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform var(--v-transition-fast, 0.15s ease);
            box-shadow: 0 3px 12px rgba(196, 149, 58, 0.3);
        }

        .final-cta-btn:active {
            transform: scale(0.96);
        }

        /* ─── Footer ─── */
        .hub-footer {
            margin-top: auto;
            padding: var(--v-space-xl, 16px) var(--v-space-lg, 12px) var(--v-space-2xl, 20px);
            text-align: center;
            width: 100%;
        }

        .footer-divider {
            width: 40%;
            max-width: 120px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--v-border, #4a3828), transparent);
            margin: 0 auto var(--v-space-lg, 12px);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: var(--v-space-xl, 16px);
            margin-bottom: var(--v-space-md, 8px);
        }

        .footer-link {
            font-size: var(--v-font-sm, 11px);
            color: var(--v-gold-dim, #9a7530);
            text-decoration: none;
            letter-spacing: 0.5px;
            transition: color var(--v-transition-fast, 0.15s ease);
        }

        .footer-link:hover {
            color: var(--v-gold, #c4953a);
        }

        .footer-version {
            font-size: var(--v-font-micro, 10px);
            color: var(--v-border, #4a3828);
            margin-top: var(--v-space-sm, 4px);
        }

        /* ── Fade-slide animation ── */
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── Reduced motion ── */
        @media (prefers-reduced-motion: reduce) {
            .hero-particles .hp,
            .title-orb,
            .title-orb-wrap,
            .title-orb-nebula,
            .title-orb-rays {
                animation: none !important;
            }

            .hero-title,
            .hero-subtitle,
            .hero-divider,
            .hero-cta,
            .app-card,
            .support-card {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>
</head>

<body>

    <div class="hero">
        <!-- Particles -->
        <div class="hero-particles">
            <div class="hp"></div>
            <div class="hp"></div>
            <div class="hp"></div>
            <div class="hp"></div>
        </div>

        <!-- 3D Orb of Valdoria -->
        <div class="title-orb-wrap">
            <div class="title-orb-rays"></div>
            <div class="title-orb-ambient"></div>
            <div class="title-orb">
                <div class="title-orb-nebula">
                    <div class="title-orb-neb1"></div>
                    <div class="title-orb-neb2"></div>
                    <div class="title-orb-neb3"></div>
                    <div class="title-orb-neb4"></div>
                    <div class="title-orb-wisp title-orb-w1"></div>
                    <div class="title-orb-wisp title-orb-w2"></div>
                    <div class="title-orb-wisp title-orb-w3"></div>
                    <div class="title-orb-wisp title-orb-w4"></div>
                    <div class="title-orb-wisp title-orb-w5"></div>
                    <div class="title-orb-spark title-orb-sp1"></div>
                    <div class="title-orb-spark title-orb-sp2"></div>
                    <div class="title-orb-spark title-orb-sp3"></div>
                </div>
                <div class="title-orb-core"></div>
                <div class="title-orb-core-fl"></div>
                <div class="title-orb-intlight"></div>
                <div class="title-orb-term"></div>
                <div class="title-orb-fresnel"></div>
                <div class="title-orb-sss"></div>
                <div class="title-orb-gp"></div>
                <div class="title-orb-gs"></div>
                <div class="title-orb-grim"></div>
                <div class="title-orb-gcaus"></div>
                <div class="title-orb-gel"></div>
                <div class="title-orb-ger"></div>
                <div class="title-orb-spec"></div>
            </div>
            <div class="title-orb-floor"></div>
        </div>

        <!-- Title -->
        <h1 class="hero-title">
            <span class="hero-title-top">Lendas de</span>
            <span class="hero-title-sub">Valdoria</span>
        </h1>
        <div class="hero-subtitle">RPG Medieval de Fantasia</div>
        <div class="hero-divider"></div>

        <!-- Primary CTA -->
        <div class="hero-cta-group">
            <a href="https://t.me/LendasDeValdoriaBOT" target="_blank" rel="noopener" class="hero-cta">Jogar no Telegram</a>
            <a href="web/" class="hero-cta hero-cta-alt">Jogar no Navegador</a>
        </div>
    </div>

    <!-- Comece sua aventura -->
    <div class="final-cta">
        <div class="final-cta-text">Comece sua aventura</div>
        <div class="hero-cta-group">
            <a href="https://t.me/LendasDeValdoriaBOT" target="_blank" rel="noopener" class="final-cta-btn">Jogar no Telegram</a>
            <a href="web/" class="final-cta-btn final-cta-alt">Jogar no Navegador</a>
        </div>
    </div>

    <!-- Apoio -->
    <div class="support-section">
        <div class="section-label">Apoio</div>
        <a href="apoie/" class="support-card">
            <div class="support-icon">💎</div>
            <div class="support-info">
                <div class="support-name">Apoiar o Projeto</div>
                <div class="support-desc">Contribua para o desenvolvimento do jogo</div>
            </div>
        </a>
    </div>

    <!-- Footer -->
    <div class="hub-footer">
        <div class="footer-divider"></div>
        <div class="footer-links">
            <a href="https://t.me/LendasDeValdoriaBOT" target="_blank" rel="noopener"
                class="footer-link">Telegram Bot</a>
            <a href="https://t.me/lendasdevaldoria" target="_blank" rel="noopener"
                class="footer-link">Canal de Noticias</a>
        </div>
        <div class="footer-version">v5.0</div>
    </div>
</body>

</html>
