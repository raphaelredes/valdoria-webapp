<!DOCTYPE html>
<!--
  MAPA_IA - valdoria-webapp/exploracao/index.html
  (FASE 1 planejada 2026-04-22: exploracao.html e fonte canonica do simulador
   de exploracao hex autonomous.)

  AGENTE IA: LEIA PRIMEIRO docs/sistemas/exploracao-master-index.md (entry
  point unico). Contem indice de funcoes do simulador, contrato sim<->servidor,
  6 invariantes obrigatorias e FAQs.

  Este index.html e um SHIM que redireciona para exploracao.html preservando
  a query string (token/api/uid/map_id/o/snap/_cb) E location.hash
  (#tgWebAppData). O engine/UI vive 100% em exploracao.html - que detecta
  window.__EXPLORE_MODE=remote quando `token+api` estao presentes e hidrata
  state via URL param `snap=b64(zlib(perfil))` sem nenhuma chamada HTTP de
  boot.

  NUNCA edite valdoria-webapp/exploracao/exploracao.html manualmente - e copia
  sincronizada do master via scripts/sync_exploracao_to_webapp.py. Edite
  simuladores/exploracao.html, valide em file://, rode sync, commit webapp.

  Docs canonical (ordem de leitura):
    docs/sistemas/exploracao-master-index.md      ← ENTRY POINT
    docs/sistemas/exploracao-canonical.md         ← proposta + contrato
    docs/sistemas/exploracao.md                   ← sistema legado (coexiste)
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2a2420">
<meta http-equiv="Cache-Control" content="no-cache">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta http-equiv="refresh" content="0; url=./exploracao.html">
<title>Exploração - Valdória</title>
<style>
html, body {
  background: #1a1510;
  color: #d4c8b0;
  margin: 0;
  padding: 0;
  height: 100dvh;
  overflow: hidden;
  font-family: 'MedievalSharp', 'Cinzel', serif;
}
@keyframes expRingCW { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
@keyframes expRingCCW { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
@keyframes expCorePulse { 0%, 100% { transform: scale(0.92); opacity: 0.7; } 50% { transform: scale(1.1); opacity: 1; } }
@keyframes expTextShimmer { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
@keyframes expEmberFloat { 0% { transform: translate3d(0, 0, 0); opacity: 0; } 20% { opacity: 0.8; } 80% { opacity: 0.4; } 100% { transform: translate3d(var(--ex, 8px), -45px, 0); opacity: 0; } }

.loading-shim {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  background: radial-gradient(ellipse at center, #261c14 0%, #1a1510 60%, #0d0a08 100%);
  pointer-events: none;
  z-index: 99999;
}
</style>
<script>
(function () {
    /* Unregister any stale service workers + caches (regra Zero Cache SUPREME
       RULE #0). SW legado de build antigo pode estar cacheando — desativar. */
    try {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
                rs.forEach(function (reg) { reg.unregister(); });
            });
        }
        if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
            });
        }
    } catch (e) {}
})();
/* Redirect para exploracao.html preservando query params (token, api, uid,
   map_id, o, snap, delta, _cb) E location.hash (tgWebAppData do Telegram SDK,
   necessario pra silent auth). */
(function () {
    var qs = location.search || '';
    /* Cache-bust adicional por seguranca. */
    var sep = qs.indexOf('?') === 0 ? '&' : '?';
    var cb = sep + '_rv=' + Date.now();
    var hash = location.hash || '';
    location.replace('./exploracao.html' + qs + cb + hash);
})();
</script>
</head>
<body>
<div class="loading-shim" aria-busy="true">
  <div style="position:relative;width:68px;height:68px;display:flex;align-items:center;justify-content:center">
    <div style="position:absolute;inset:0;border-radius:50%;border:1.5px solid rgba(196,149,58,.22);border-top-color:#c4953a;border-bottom-color:rgba(212,170,74,.6);box-shadow:0 0 16px rgba(196,149,58,.2);animation:expRingCW 7s linear infinite"></div>
    <div style="position:absolute;inset:10px;border-radius:50%;border:1px dashed rgba(220,180,80,.5);border-left-color:#f0c050;border-right-color:#f0c050;animation:expRingCCW 4.5s linear infinite"></div>
    <div style="font-size:16px;color:#f3d17a;text-shadow:0 0 10px rgba(243,209,122,.8),0 0 20px rgba(196,149,58,.5);animation:expCorePulse 2.8s ease-in-out infinite;user-select:none">◆</div>
    <div style="position:absolute;left:28%;bottom:8px;width:3px;height:3px;border-radius:50%;background:#f3d17a;box-shadow:0 0 5px #f3d17a;--ex:-10px;animation:expEmberFloat 3s ease-in-out infinite"></div>
    <div style="position:absolute;left:64%;bottom:6px;width:2.5px;height:2.5px;border-radius:50%;background:#c4953a;box-shadow:0 0 5px #c4953a;--ex:12px;animation:expEmberFloat 3.8s ease-in-out infinite 1.2s"></div>
    <div style="position:absolute;left:46%;bottom:10px;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 5px #fff;--ex:4px;animation:expEmberFloat 2.5s ease-in-out infinite 0.6s"></div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
    <div style="font-family:'Cinzel',serif;color:#c4953a;font-size:14px;font-weight:700;letter-spacing:3px;text-shadow:0 0 12px rgba(196,149,58,.35);animation:expTextShimmer 3s ease-in-out infinite">Desbravando Valdória…</div>
    <div style="font-family:'Marcellus',serif;color:rgba(196,149,58,.7);font-size:11px;letter-spacing:1.5px;font-style:italic">Preparando a expedição aos ermos…</div>
  </div>
</div>
</body>
</html>
