<!DOCTYPE html>
<!-- MAPA_IA — Editor de posicionamento dos ícones de local sobre o mapa-bioma OpenAI.
  PADRAO_LOCAIS / pedido do user (sessão #71e): "crie uma página que eu consiga
  posicionar no mapa gerado pelo OpenAI os locais (imagens low OpenAI) e salvar, e
  sejam clicáveis dentro do jogo." Ferramenta DEV standalone (file:// ou deployada).
  - Fundo: /shared/img/map/world-map.webp (mapa só-bioma, sem texto).
  - Locais: window.CartShared.CART_BIOMES (key,name,x,y) + /shared/img/map/locations/<key>.webp.
  - Arrasta p/ mover · roda do mouse (ou slider) p/ escalar · "Salvar" → JSON
    {key:{x,y,scale}} (normalizado 0–1). O renderer (cartografia-shared.js) consome
    esse JSON via map-locations-coords.json. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Editor do Mapa — Lendas de Valdoria</title>
<style>
  :root { --gold:#c4953a; }
  * { box-sizing: border-box; }
  body { margin:0; background:#15110c; color:#e8dcc8; font-family:'Cinzel',Georgia,serif; }
  #bar { position:fixed; top:0; left:0; right:0; height:52px; display:flex; align-items:center;
    gap: var(--v-space-md-lg, 10px); padding: 0 var(--v-space-lg, 12px); background:#1f1812; border-bottom:1px solid #4a3828; z-index:50; flex-wrap:wrap; }
  #bar h1 { font-size:15px; margin:0; color:var(--gold); letter-spacing:1px; }
  button { background:linear-gradient(180deg,rgba(196,149,58,.30),rgba(196,149,58,.12));
    border:1px solid var(--gold); color:#e8dcc8; padding:7px 14px; border-radius: var(--v-radius-sm, 6px);
    cursor:pointer; font-family:inherit; font-size:12px; letter-spacing:.5px; }
  button:hover { background:rgba(196,149,58,.4); }
  #stage-wrap { position:fixed; top:52px; left:0; right:0; bottom:0; overflow:hidden;
    background:#15110c; touch-action:none; cursor:grab; }
  #stage-wrap.panning { cursor:grabbing; }
  #stage { position:absolute; left:0; top:0; transform-origin:0 0; box-shadow:0 0 30px rgba(0,0,0,.6); }
  /* Controles de zoom (sessão #74): canto inferior-esquerdo (não cobre o #out à direita) */
  #ed-zoomctl { position:fixed; left:14px; bottom:14px; z-index:55; display:flex; flex-direction:column;
    gap:6px; align-items:center; }
  #ed-zoomctl button { width:40px; height:40px; padding:0; font-size:19px; line-height:1;
    display:flex; align-items:center; justify-content:center; }
  #ed-zoom-pct { font-size:11px; color:var(--gold); background:rgba(15,17,12,.85);
    border:1px solid #4a3828; border-radius:5px; padding: var(--v-space-xs, 2px) 7px; font-family:system-ui,sans-serif; }
  #stage img.bg { display:block; width:100%; height:100%; }
  .loc { position:absolute; transform:translate(-50%,-50%); cursor:grab; user-select:none;
    text-align:center; }
  .loc.sel { outline:2px dashed var(--gold); outline-offset:3px; }
  .loc img { display:block; width:100%; height:auto; pointer-events:none;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  .loc .lbl { font-size:9px; color:#3a2a18; background:rgba(244,228,200,.7); padding:0 3px;
    border-radius:3px; margin-top:1px; white-space:nowrap; }
  .loc.missing img { opacity:.25; }
  #hint { font-size:11px; color:#a09484; letter-spacing:0; font-family:system-ui,sans-serif; }
  #scaleBox { display:flex; align-items:center; gap:6px; font-size:11px; }
  #out { position:fixed; right:12px; bottom:12px; width:340px; max-width:46vw; height:220px;
    background:#0d0a06; color:#9fe0a0; border:1px solid #4a3828; border-radius: var(--v-radius-sm, 6px); padding: var(--v-space-md, 8px);
    font-family:ui-monospace,monospace; font-size:10px; z-index:60; display:none; }
</style>
<!-- sessão #74: cache-busting do cartografia (Bucket B é immutable) — sem ?v= o editor
     servia a versão ANTIGA cacheada (não refletia trilhas afinadas/fog/mudanças do mapa).
     Carrega via DOM (createElement) ordenado: bundle-version → cartografia?v=hash → boot
     do editor (__editorMain), adiado até o CartShared existir. VBUNDLE_HASH rotaciona
     quando qualquer Bucket B muda; fallback Date.now(). -->
<script>
(function(){
  function ld(src, cb){ var s = document.createElement('script'); s.src = src; s.onload = cb; s.onerror = cb; document.head.appendChild(s); }
  function boot(){
    if (window.__editorMain) { window.__editorMain(); }
    else { document.addEventListener('DOMContentLoaded', function(){ if (window.__editorMain) window.__editorMain(); }); }
  }
  ld('/bundle-version.js', function(){
    ld('./cartografia-shared.js?v=' + (window.VBUNDLE_HASH || Date.now()), boot);
  });
})();
</script>
</head>
<body>
<div id="bar">
  <h1>Editor do Mapa</h1>
  <button id="btn-save">Salvar posições (JSON)</button>
  <button id="btn-reset">↺ Resetar p/ padrão</button>
  <span id="scaleBox">Escala do selecionado: <input id="scale" type="range" min="4" max="22" step="0.5" value="5" disabled> <b id="scalev">—</b></span>
  <span id="hint">Arraste locais · roda sobre um local = escala · arraste o fundo = mover · roda no fundo / botões = zoom</span>
</div>
<div id="stage-wrap"><div id="stage"></div></div>
<div id="ed-zoomctl">
  <span id="ed-zoom-pct">100%</span>
  <button id="ed-zoom-in" title="Aproximar">+</button>
  <button id="ed-zoom-out" title="Afastar">−</button>
  <button id="ed-zoom-reset" title="Centralizar / resetar zoom">⌂</button>
</div>
<textarea id="out" readonly></textarea>
<script>
// sessão #74: boot nomeado (não auto-exec) — chamado pelo loader do <head> só DEPOIS
// que o cartografia-shared.js?v=hash carregar (garante window.CartShared disponível).
function __editorMain(){
  var MAP = '/shared/img/map/world-map.webp';
  var ICON_DIR = '/shared/img/map/locations/';
  var stage = document.getElementById('stage');
  var out = document.getElementById('out');
  var scaleInput = document.getElementById('scale');
  var scaleV = document.getElementById('scalev');
  var BIOMES = (window.CartShared && window.CartShared.CART_BIOMES) || [];
  var state = {};   // key -> {x,y,scale,name,el}
  var sel = null;

  // === Zoom/Pan do editor (sessão #74) ======================================
  // User: "permita dar zoom no map-editor para fazer as edições dos locais do mapa".
  // CSS transform no #stage (translate+scale, origin 0,0). O drag dos locais (wireDrag)
  // usa getBoundingClientRect (PÓS-transform) → continua exato em qualquer zoom, sem
  // ajuste. Pan = arrastar o fundo; zoom = roda do mouse no fundo / botões / pinça.
  var ed = { zoom: 1, panX: 0, panY: 0, baseW: 0, inited: false };
  function applyEdTransform(){
    stage.style.transform = 'translate(' + ed.panX + 'px,' + ed.panY + 'px) scale(' + ed.zoom + ')';
    var zi = document.getElementById('ed-zoom-pct');
    if (zi) zi.textContent = Math.round(ed.zoom * 100) + '%';
  }
  function edCenter(){
    var wrap = document.getElementById('stage-wrap');
    ed.panX = Math.max(0, (wrap.clientWidth - ed.baseW) / 2);
    ed.panY = Math.max(8, (wrap.clientHeight - ed.baseW) / 2);
    applyEdTransform();
  }
  function edSetZoom(nz, ax, ay){
    nz = Math.max(0.4, Math.min(5, nz));
    var k = nz / ed.zoom;
    ed.panX = ax - (ax - ed.panX) * k;   // mantém o ponto (ax,ay) fixo sob o cursor
    ed.panY = ay - (ay - ed.panY) * k;
    ed.zoom = nz;
    applyEdTransform();
  }

  // Auth/API (mesma sessão do jogo): lê token/api/uid da URL ou do record
  // canônico `valdoria_session_<env>` gravado por vAuthTokenStore (localStorage
  // compartilhado por origem — funciona ao abrir o editor direto na MESMA aba/
  // navegador onde o jogo está logado). FIX 2026-06-03: o record usa as chaves
  // `api_base`/`user_id` (não `api`/`uid`) — ler errado deixava API/UID vazios e
  // o botão Salvar caía no fallback de download (janela de salvar arquivo) em vez
  // de gravar direto no servidor. Ver shared/auth-token-store.js setToken().
  function _qs(k){ try { return new URL(location.href).searchParams.get(k); } catch(_) { return null; } }
  // Env canônico: ?env > sessão dev presente > sessão prod presente > 'dev'. A MESMA
  // fonte alimenta a sessão (API/token/uid) E a chave do rascunho — sem incoerência
  // (antes a sessão era dev-first incondicional e o rascunho seguia ?env → divergiam).
  var ENVK = _qs('env') || (localStorage.getItem('valdoria_session_dev') ? 'dev'
            : (localStorage.getItem('valdoria_session_prod') ? 'prod' : 'dev'));
  function _sessRec(){
    try { return JSON.parse(localStorage.getItem('valdoria_session_' + ENVK) || '{}') || {}; }
    catch(_){ return {}; }
  }
  var _SR = _sessRec();
  var API = _qs('api') || _SR.api_base || '';
  var TOKEN = _qs('token') || _SR.token || '';
  var UID = _qs('uid') || _SR.user_id || '';
  function _api(path){ return (API ? API.replace(/\/$/, '') : '') + path; }

  // === Autosave de rascunho (2026-06-29) ===================================
  // O editor não tinha autosave: se o save falhasse (sessão/admin) ou a aba
  // fechasse, o arranjo em andamento sumia. Agora todo arrasto/escala grava um
  // rascunho em localStorage (por-env — Environment Isolation). É SÓ um rascunho
  // de UI do editor, não estado de jogo — permitido pela regra Server-Only State.
  // ENVK (acima) é a fonte única do ambiente → chave do rascunho no mesmo env da sessão.
  var DRAFT_KEY = 'valdoria_mapeditor_draft_' + ENVK;
  var _draftTimer = null;
  function _coordsOnly(){
    var o = {};
    Object.keys(state).forEach(function(k){
      o[k] = { x: +state[k].x.toFixed(4), y: +state[k].y.toFixed(4), scale: +state[k].scale.toFixed(1) };
    });
    return o;
  }
  function _saveDraft(){ try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ coords: _coordsOnly(), ts: Date.now() })); } catch(_){} }
  function _scheduleDraft(){ if (_draftTimer) clearTimeout(_draftTimer); _draftTimer = setTimeout(_saveDraft, 400); }
  function _clearDraft(){ try { localStorage.removeItem(DRAFT_KEY); } catch(_){} }
  function _readDraft(){ try { var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); return (d && d.coords) ? d : null; } catch(_){ return null; } }
  function _coordsDiffer(a, b){
    a = a || {}; b = b || {};
    var ka = Object.keys(a);
    if (ka.length !== Object.keys(b).length) return true;
    for (var i = 0; i < ka.length; i++){
      var k = ka[i], x = a[k], y = b[k];
      if (!y) return true;
      if (Math.abs((x.x||0)-(y.x||0)) > 0.001 || Math.abs((x.y||0)-(y.y||0)) > 0.001 || Math.abs((x.scale||0)-(y.scale||0)) > 0.05) return true;
    }
    return false;
  }
  function _applyDraft(coords){
    Object.keys(coords).forEach(function(k){
      if (state[k]) { state[k].x = coords[k].x; state[k].y = coords[k].y; state[k].scale = coords[k].scale; }
    });
    layout();
  }
  function _maybeOfferDraft(serverCoords){
    var d = _readDraft();
    if (!d) return;
    if (!_coordsDiffer(d.coords, serverCoords || {})) { _clearDraft(); return; }
    var bn = document.createElement('div');
    /* HARDCODED: DEV tool standalone, sem design-system (todo o arquivo usa literais; --gold é o único token, definido inline no :root) */
    bn.style.cssText = 'position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:70;background:#1f1812;border:1px solid var(--gold,#c4953a);border-radius:8px;padding:8px 12px;display:flex;gap:10px;align-items:center;font-family:system-ui,sans-serif;font-size:12px;color:#e8dcc8;box-shadow:0 4px 16px rgba(0,0,0,.5);';
    var ts = '';
    try { ts = new Date(d.ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); } catch(_){}
    var msg = document.createElement('span');
    msg.textContent = 'Rascunho não salvo' + (ts ? ' (' + ts + ')' : '') + ' encontrado.';
    var bApply = document.createElement('button'); bApply.textContent = 'Aplicar';
    var bDiscard = document.createElement('button'); bDiscard.textContent = 'Descartar';
    bApply.onclick = function(){ _applyDraft(d.coords); bn.remove(); };
    bDiscard.onclick = function(){ _clearDraft(); bn.remove(); };
    bn.appendChild(msg); bn.appendChild(bApply); bn.appendChild(bDiscard);
    document.body.appendChild(bn);
  }

  // Nível sugerido (referência existente): min_level da região (REGIONAL_MAP_CATALOG)
  // + tier do local (CART_BIOMES). Sugerido = max(regionMin, tier, 1).
  var REGION_MIN_LEVEL = {
    'Mapa das Planícies': 1, 'Mapa da Floresta': 2, 'Mapa do Deserto': 2,
    'Mapa do Pântano': 3, 'Mapa do Ermo Gelado': 3, 'Mapa das Montanhas': 5,
    'Mapa Vulcânico': 7
  };
  function suggestedLevel(b){
    var rm = REGION_MIN_LEVEL[b.mapKey] || 0;
    return Math.max(1, rm, (typeof b.tier === 'number' ? b.tier : 0));
  }

  // mapa de fundo (quadrado 1024 → mantemos aspecto 1:1, largura responsiva)
  var bg = new Image();
  bg.className = 'bg'; bg.src = MAP;
  bg.onload = function(){ layout(); };
  stage.appendChild(bg);

  // P-mapa sessão #73 (user: "mostre o caminho entre os locais do mapa também no
  // map-editor"): overlay de canvas com as MESMAS estradas do jogo (CART_PATHS +
  // _drawCartPath do engine cartografia-shared), redesenhado a cada layout pra
  // acompanhar os locais enquanto o admin arrasta. Fica ACIMA do mapa-fundo e ABAIXO
  // dos ícones (.loc são appended depois no DOM → renderizam por cima).
  var pathCanvas = document.createElement('canvas');
  pathCanvas.id = 'path-overlay';
  pathCanvas.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;';
  stage.appendChild(pathCanvas);
  var pathCtx = pathCanvas.getContext('2d');
  function drawPaths(sz){
    var dp = window.CartShared && window.CartShared._drawCartPath;
    var PATHS = (window.CartShared && window.CartShared.CART_PATHS) || [];
    if (!dp || !pathCtx) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    pathCanvas.width = Math.round(sz.w * dpr);
    pathCanvas.height = Math.round(sz.h * dpr);
    pathCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pathCtx.clearRect(0, 0, sz.w, sz.h);
    // biomas resolvidos com as coords ATUAIS do editor (state) — a estrada segue o
    // local enquanto arrasta, e usa as coords padrão pros que ainda não moveram.
    var rb = BIOMES.map(function(b){
      var s = state[b.key] || {};
      return { key: b.key, x: (typeof s.x === 'number' ? s.x : b.x), y: (typeof s.y === 'number' ? s.y : b.y) };
    });
    PATHS.forEach(function(p){ dp(pathCtx, p[0], p[1], sz.w, sz.h, rb); });
  }

  function stageSize(){
    var wrap = document.getElementById('stage-wrap');
    var avail = Math.min(wrap ? wrap.clientWidth : window.innerWidth,
                         wrap ? wrap.clientHeight : window.innerHeight) - 24;
    var w = Math.max(220, Math.min(avail, 900));
    stage.style.width = w + 'px';
    stage.style.height = w + 'px'; // world-map é 1:1
    return { w: w, h: w };
  }

  function makeLoc(b, ov){
    var d = document.createElement('div');
    d.className = 'loc';
    d.dataset.key = b.key;
    var img = new Image();
    img.src = ICON_DIR + b.key + '.webp';
    img.onerror = function(){ d.classList.add('missing'); img.src =
      'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><circle cx="20" cy="20" r="16" fill="%23c4953a" opacity="0.4"/></svg>'; };
    var lbl = document.createElement('div'); lbl.className = 'lbl';
    lbl.textContent = b.name + ' · Nv ' + suggestedLevel(b) + '+ · T' + (b.tier || 0);
    d.appendChild(img); d.appendChild(lbl);
    stage.appendChild(d);
    state[b.key] = {
      x: (ov && typeof ov.x === 'number') ? ov.x : b.x,
      y: (ov && typeof ov.y === 'number') ? ov.y : b.y,
      scale: (ov && typeof ov.scale === 'number') ? ov.scale : 5, // % da largura (default 5)
      name: b.name, el: d
    };
    wireDrag(d, b.key);
    return d;
  }

  function layout(){
    var sz = stageSize();
    ed.baseW = sz.w;
    Object.keys(state).forEach(function(k){
      var s = state[k];
      s.el.style.left = (s.x * sz.w) + 'px';
      s.el.style.top = (s.y * sz.h) + 'px';
      s.el.style.width = (s.scale / 100 * sz.w) + 'px';
    });
    drawPaths(sz);  // P-mapa sessão #73: redesenha as estradas acompanhando os locais
    // sessão #74: 1ª montagem centraliza (zoom 1); depois preserva o pan/zoom atual.
    if (!ed.inited) { ed.inited = true; edCenter(); } else applyEdTransform();
  }

  function wireDrag(d, key){
    var dragging = false, ox = 0, oy = 0;
    d.addEventListener('mousedown', function(e){
      e.preventDefault(); select(key); dragging = true; d.style.cursor = 'grabbing';
      var r = d.getBoundingClientRect();
      ox = e.clientX - (r.left + r.width / 2); oy = e.clientY - (r.top + r.height / 2);
    });
    window.addEventListener('mousemove', function(e){
      if(!dragging) return;
      var sr = stage.getBoundingClientRect();
      var nx = (e.clientX - ox - sr.left) / sr.width;
      var ny = (e.clientY - oy - sr.top) / sr.height;
      state[key].x = Math.max(0, Math.min(1, nx));
      state[key].y = Math.max(0, Math.min(1, ny));
      layout();
      _scheduleDraft();
    });
    window.addEventListener('mouseup', function(){ if(dragging){ dragging = false; d.style.cursor = 'grab'; } });
    d.addEventListener('wheel', function(e){
      e.preventDefault(); e.stopPropagation();   // sessão #74: roda sobre LOCAL = escala dele (não zoom do mapa)
      select(key);
      state[key].scale = Math.max(4, Math.min(22, state[key].scale + (e.deltaY < 0 ? 0.5 : -0.5)));
      scaleInput.value = state[key].scale; scaleV.textContent = state[key].scale;
      layout();
      _scheduleDraft();
    }, { passive: false });
  }

  function select(key){
    if(sel && state[sel]) state[sel].el.classList.remove('sel');
    sel = key; state[key].el.classList.add('sel');
    scaleInput.disabled = false; scaleInput.value = state[key].scale; scaleV.textContent = state[key].scale;
  }
  scaleInput.addEventListener('input', function(){
    if(!sel) return; state[sel].scale = parseFloat(scaleInput.value); scaleV.textContent = scaleInput.value; layout(); _scheduleDraft();
  });

  document.getElementById('btn-save').addEventListener('click', function(){
    var o = _coordsOnly();
    out.style.display = 'block'; out.value = JSON.stringify(o, null, 0);
    // SEMPRE confirma antes de salvar (janela popup).
    if (!window.confirm('Salvar as posições dos locais?\n\nReflete no jogo imediatamente e mantém os últimos 5 backups (5 alterações).')) return;
    if (!API || !TOKEN) {
      // fallback offline (sem sessão): baixa o JSON.
      try { var blob = new Blob([JSON.stringify(o, null, 2)], { type: 'application/json' }); var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'map-locations-coords.json'; a.click(); } catch(_){}
      window.alert('Sem sessão (API/token) — baixei o JSON. Abra o editor a partir do jogo (/play) para salvar direto no servidor.');
      return;
    }
    var btn = this; var oldTxt = btn.textContent; btn.disabled = true; btn.textContent = '⏳ Salvando...';
    fetch(_api('/api/exploracao/map-coords'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: TOKEN, user_id: +UID, coords: o })
    }).then(function(r){ return r.json().catch(function(){ return { error: 'bad_json', status: r.status }; }); })
      .then(function(j){
        btn.disabled = false; btn.textContent = oldTxt;
        if (j && j.ok) {
          _clearDraft();
          var dur = j.seed_written ? '\n\nLayout gravado no seed VERSIONADO (durável) — será levado ao PROD no próximo Deploy.' : '';
          window.alert('✓ Salvo! As posições já refletem no jogo.\nBackups mantidos: ' + (j.backups != null ? j.backups : '?') + '/5.' + dur);
          return;
        }
        // Mensagens claras por causa (não baixa arquivo — o save É via servidor).
        var err = (j && j.error) || '';
        if (err === 'invalid_session') window.alert('Sessão expirada. Reabra o editor a partir do jogo (/play) para renovar a sessão e salvar.');
        else if (err === 'not_admin') window.alert('Apenas admin pode editar o mapa (config global).\nSua conta (uid ' + UID + ') não é admin neste ambiente. Use a conta admin ou peça para adicioná-la em data/admins.json.');
        else window.alert('Falha ao salvar: ' + ((j && (j.message || err)) || 'erro') + (j && j.status ? (' (HTTP ' + j.status + ')') : ''));
      }).catch(function(e){ btn.disabled = false; btn.textContent = oldTxt; window.alert('Erro de rede ao salvar: ' + e); });
  });
  document.getElementById('btn-reset').addEventListener('click', function(){
    Object.keys(state).forEach(function(k){
      var b = BIOMES.find(function(x){ return x.key === k; });
      if(b){ state[k].x = b.x; state[k].y = b.y; state[k].scale = 5; }
    });
    layout();
    // NÃO grava rascunho no Reset: um reset-sem-salvar não deve reaparecer como
    // "rascunho recuperado" (confundiria com trabalho real). O Save é que persiste.
  });
  window.addEventListener('resize', layout);

  // === Handlers de zoom/pan (sessão #74) ====================================
  (function wireZoomPan(){
    var wrap = document.getElementById('stage-wrap');
    if (!wrap) return;
    // Roda do mouse no FUNDO = zoom (sobre um local o .loc faz stopPropagation → não
    // chega aqui). Âncora no cursor (mantém o ponto sob o mouse fixo).
    wrap.addEventListener('wheel', function(e){
      e.preventDefault();
      var r = wrap.getBoundingClientRect();
      edSetZoom(ed.zoom * (e.deltaY < 0 ? 1.12 : 0.89), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });
    // Arrastar o FUNDO = pan (clicar num local cai no wireDrag, sem panar).
    var panning = false, plx = 0, ply = 0;
    wrap.addEventListener('mousedown', function(e){
      if (e.target.closest('.loc')) return;
      panning = true; plx = e.clientX; ply = e.clientY; wrap.classList.add('panning');
    });
    window.addEventListener('mousemove', function(e){
      if (!panning) return;
      ed.panX += (e.clientX - plx); ed.panY += (e.clientY - ply);
      plx = e.clientX; ply = e.clientY; applyEdTransform();
    });
    window.addEventListener('mouseup', function(){ if (panning) { panning = false; wrap.classList.remove('panning'); } });
    // Touch: pinça (2 dedos) = zoom · 1 dedo no fundo = pan.
    function _td(t){ var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.sqrt(dx*dx + dy*dy); }
    var t0 = 0, tz = 1, tpan = false, tlx = 0, tly = 0;
    wrap.addEventListener('touchstart', function(e){
      if (e.target.closest('.loc')) return;
      if (e.touches.length === 2) { t0 = _td(e.touches); tz = ed.zoom; tpan = false; }
      else if (e.touches.length === 1) { tpan = true; tlx = e.touches[0].clientX; tly = e.touches[0].clientY; }
    }, { passive: false });
    wrap.addEventListener('touchmove', function(e){
      if (e.touches.length === 2 && t0 > 0) {
        e.preventDefault();
        var r = wrap.getBoundingClientRect();
        var mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left;
        var my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - r.top;
        edSetZoom(tz * (_td(e.touches) / t0), mx, my);
      } else if (e.touches.length === 1 && tpan) {
        e.preventDefault();
        ed.panX += e.touches[0].clientX - tlx; ed.panY += e.touches[0].clientY - tly;
        tlx = e.touches[0].clientX; tly = e.touches[0].clientY; applyEdTransform();
      }
    }, { passive: false });
    wrap.addEventListener('touchend', function(e){ if (e.touches.length === 0) { tpan = false; t0 = 0; } });
    // Botões de zoom (âncora no centro do viewport).
    function _ctrZoom(f){ var r = wrap.getBoundingClientRect(); edSetZoom(ed.zoom * f, r.width / 2, r.height / 2); }
    var bi = document.getElementById('ed-zoom-in'); if (bi) bi.onclick = function(){ _ctrZoom(1.25); };
    var bo = document.getElementById('ed-zoom-out'); if (bo) bo.onclick = function(){ _ctrZoom(0.8); };
    var br = document.getElementById('ed-zoom-reset'); if (br) br.onclick = function(){ ed.zoom = 1; edCenter(); };
  })();

  // boot: carrega posições salvas do servidor (se houver sessão), senão usa as
  // coords padrão de CART_BIOMES.
  function boot(ov){ ov = ov || {}; BIOMES.forEach(function(b){ makeLoc(b, ov[b.key]); }); if (bg.complete) layout(); _maybeOfferDraft(ov); }
  if (API && TOKEN) {
    fetch(_api('/api/exploracao/map-coords') + '?token=' + encodeURIComponent(TOKEN) + '&user_id=' + encodeURIComponent(UID))
      .then(function(r){ return r.ok ? r.json() : {}; })
      .then(function(j){ boot((j && j.coords) || {}); })
      .catch(function(){ boot({}); });
  } else { boot({}); }
}
</script>
