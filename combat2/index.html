<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2a2420">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Combate</title>
<link rel="stylesheet" href="../valdoria-design.css">
<style>
body { font-family: var(--v-font); color: var(--v-text); background: var(--v-bg); margin: 0; padding: 12px; }
.c2 { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; justify-content: space-between; padding: 8px 12px; background: var(--v-bg-raised); border: 1px solid var(--v-border); border-radius: 6px; }
.row.active { border-color: var(--v-gold); box-shadow: 0 0 6px rgba(196,149,58,0.4); }
.row.dead { opacity: 0.4; text-decoration: line-through; }
.bar { height: 6px; background: var(--v-bg); border-radius: 3px; overflow: hidden; margin-top: -6px; }
.fill { height: 100%; background: linear-gradient(90deg, #5a8a3e, #8ab04e); transition: width .3s; }
.fill.low { background: linear-gradient(90deg, #a04a2a, #c06a3a); }
.log { max-height: 160px; overflow-y: auto; padding: 8px; background: var(--v-bg-card); border: 1px solid var(--v-border); border-radius: 6px; font-size: 13px; }
.log div { padding: 2px 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1; padding: 12px; background: var(--v-bg-raised); border: 1px solid var(--v-border); color: var(--v-text); border-radius: 6px; font: inherit; cursor: pointer; }
.btn.primary { background: linear-gradient(180deg, rgba(196,149,58,.3), rgba(139,100,32,.3)); border-color: var(--v-gold); color: var(--v-gold); font-weight: 600; }
.end { text-align: center; padding: 24px; font-size: 22px; }
.end.victory { color: #8ab04e; }
.end.defeat { color: #c06a3a; }
.end.fled { color: var(--v-text-dim); }
.dice-wrap { display: flex; justify-content: center; padding: 8px 0; }
#dice-canvas { width: 140px; height: 140px; }
.phase { text-align: center; color: var(--v-text-dim); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>
<div id="app"><div class="phase">Carregando...</div></div>
<script>
var v = Date.now();
function L(src){var s=document.createElement('script');s.src=src+'?v='+v;s.async=false;document.body.appendChild(s);}
L('../shared/api-discovery.js');
L('../shared/dice-3d.js');
L('combat2.js');
</script>
</body>
</html>
