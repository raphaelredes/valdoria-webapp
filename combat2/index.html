<!DOCTYPE html>
<!--
  MAPA_IA — valdoria-webapp/combat2/index.html
  (Regra: CLAUDE.md "WebApp index.html — MAPA_IA". Atualizar este mapa se a estrutura mudar.)
  Ordem vertical do ficheiro:

  1. WebApp combat2: estado GET/POST /api/combat2; lógica em combat2.js; CSS reutiliza combat/*.css + combat2.css.
  2. <head> — meta UTF-8, viewport, theme-color, cache no-store (3 meta), title.
  3. <head> — style inline html{background} (anti-FOUC; nunca opacity:0 no html).
  4. <head> — script: var v=Date.now(), BASE GitHub Pages, loadCSS() → fonts, valdoria-design, coin, status-bars,
     animations, cadeia CSS combat/* (...), combat2.css via document.write com ?v= (cache bust).
  5. <body> — class biome-*, canvas#vfxCanvas (CombatVFX), #app + mensagem loading inicial.
  6. Script externo — telegram-web-app.js.
  7. IIFE document.write — motion.js, combat-vfx.js, combat-battlefield-pan-zoom.js (pan/zoom arena),
     audio-manager.js, combat/combat-audio.js, console-collector.js, error-reporter.js (ordem preflight / error-reporter após collector).
  8. combat2.js — boot: THREE → dice-3d → fetch estado → render (detalhe no .js).
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2a2420">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Combate — Valdoria</title>
<!-- DEV/PROD: evita WebApp antigo por SW/cache do browser (não substitui deploy do backend). -->
<script>
(function () {
    try {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
                rs.forEach(function (reg) { reg.unregister(); });
            });
        }
        if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
            });
        }
    } catch (e) { /* intentionally silent */ }
})();
</script>
<style>html{background:#2a2420}</style>
<script>
var v = Date.now();
var BASE = 'https://jogo.lendasdevaldoria.com.br';
function loadCSS(href) {
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = BASE + href + '?v=' + v;
    document.head.appendChild(l);
}
loadCSS('/shared/fonts.css');
loadCSS('/valdoria-design.css');
loadCSS('/shared/coin-icon.css');
loadCSS('/shared/status-bars.css');
loadCSS('/shared/animations.css');
loadCSS('/combat/combat.css');
loadCSS('/combat/combat-battlefield.css');
loadCSS('/combat/combat-turn-queue.css');
loadCSS('/combat/combat-grid.css');
loadCSS('/combat/combat-actions-popup.css');
loadCSS('/combat/combat-init-overlay.css');
loadCSS('/combat/combat-init-popup.css');
loadCSS('/combat/combat-dice-banner.css');
loadCSS('/combat/combat-effects.css');
loadCSS('/combat/combat-entities.css');
loadCSS('/combat/combat-layout.css');
loadCSS('/combat/combat-polish.css');
loadCSS('/combat/combat-screens.css');
loadCSS('/combat/combat-themes.css');
loadCSS('/combat/combat-vfx.css');
document.write('<link rel="stylesheet" href="combat2.css?v=' + v + '">');
</script>
</head>
<body class="biome-forest">
<canvas id="vfxCanvas"></canvas>
<div id="app">
    <div class="loading-msg">Carregando combate...</div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Mesmo pipeline do combate legado (combat/index.html): motion + canvas VFX */
(function () {
    var v = Date.now();
    var B = 'https://jogo.lendasdevaldoria.com.br';
    document.write('<script src="' + B + '/shared/motion.js?v=' + v + '"><\/script>');
    document.write('<script src="' + B + '/shared/combat-vfx.js?v=' + v + '"><\/script>');
    document.write('<script src="' + B + '/shared/audio-manager.js?v=' + v + '"><\/script>');
    document.write('<script src="' + B + '/combat/combat-audio.js?v=' + v + '"><\/script>');
    document.write('<script src="' + B + '/shared/console-collector.js?v=' + v + '"><\/script>');
    document.write('<script src="' + B + '/shared/error-reporter.js?v=' + v + '"><\/script>');
    document.write('<script src="' + B + '/shared/overlay-registry.js?v=' + v + '"><\/script>');
    document.write('<script src="' + B + '/shared/combat-battlefield-pan-zoom.js?v=' + v + '"><\/script>');
})();
</script>
<script src="combat2.js"></script>
</body>
</html>
