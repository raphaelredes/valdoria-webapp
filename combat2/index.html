<!DOCTYPE html>
<!--
  MAPA_IA - valdoria-webapp/combat2/index.html
  (FASE 1 PoC 2026-04-20: combate.html virou fonte canonica.)

  Este index.html vira um SHIM que redireciona para combate.html preservando
  a query string (token/api/uid/o/env/_cb). O engine/UI vive 100% em
  combate.html - que detecta window.__COMBAT_MODE=remote quando `token+api`
  estao presentes e substitui o motor local por POST /api/combat2.

  Proposta completa: docs/sistemas/combat2-arch-canonical-proposal.md
  Sync tool: scripts/sync_combate_to_webapp.py
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2a2420">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Combate - Valdoria</title>
<style>html,body{background:#1a1510;color:#d4c8b0;margin:0;padding:0;height:100dvh;font-family:serif}
.loading-shim{display:flex;align-items:center;justify-content:center;height:100dvh;letter-spacing:2px;opacity:.8}</style>
<script>
(function () {
    try {
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
                rs.forEach(function (reg) { reg.unregister(); });
            });
        }
        if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
                keys.forEach(function (k) { caches.delete(k); });
            });
        }
    } catch (e) {}
})();
/* Redirect para combate.html preservando query params (token, api, uid, o, env, _cb)
   E location.hash (tgWebAppData do Telegram SDK, necessario pra silent auth). */
(function () {
    var qs = location.search || '';
    /* Cache-bust adicional por seguranca. */
    var sep = qs.indexOf('?') === 0 ? '&' : '?';
    var cb = sep + '_rv=' + Date.now();
    var hash = location.hash || '';
    location.replace('./combate.html' + qs + cb + hash);
})();
</script>
</head>
<body>
<div class="loading-shim">Carregando combate...</div>
</body>
</html>
