<!DOCTYPE html>
<!--
  Combat2 WebApp — frontend real do combate reescrito.
  Consume /api/combat2 do backend. Render copiado do simulador
  (simuladores/combate.html). Mantido em sync manualmente por ora.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2a2420">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Combate — Valdoria</title>
<style>html{background:#2a2420}</style>
<script>
var v = Date.now();
var BASE = 'https://jogo.lendasdevaldoria.com.br';
function loadCSS(href) {
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = BASE + href + '?v=' + v;
    document.head.appendChild(l);
}
loadCSS('/shared/fonts.css');
loadCSS('/valdoria-design.css');
loadCSS('/shared/coin-icon.css');
loadCSS('/shared/status-bars.css');
loadCSS('/shared/animations.css');
loadCSS('/combat/combat.css');
loadCSS('/combat/combat-battlefield.css');
loadCSS('/combat/combat-turn-queue.css');
loadCSS('/combat/combat-grid.css');
loadCSS('/combat/combat-actions-popup.css');
loadCSS('/combat/combat-init-overlay.css');
loadCSS('/combat/combat-init-popup.css');
loadCSS('/combat/combat-dice-banner.css');
loadCSS('/combat/combat-effects.css');
loadCSS('/combat/combat-entities.css');
loadCSS('/combat/combat-layout.css');
loadCSS('/combat/combat-polish.css');
loadCSS('/combat/combat-screens.css');
loadCSS('/combat/combat-themes.css');
loadCSS('/combat/combat-vfx.css');
</script>
<link rel="stylesheet" href="combat2.css">
</head>
<body class="biome-forest">
<canvas id="vfxCanvas"></canvas>
<div id="app">
    <div class="loading-msg">Carregando combate...</div>
</div>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Mesmo pipeline do combate legado (combat/index.html): motion + canvas VFX */
(function () {
    var v = Date.now();
    var B = 'https://jogo.lendasdevaldoria.com.br';
    document.write('<script src="' + B + '/shared/motion.js?v=' + v + '"><\/script>');
    document.write('<script src="' + B + '/shared/combat-vfx.js?v=' + v + '"><\/script>');
})();
</script>
<script src="combat2.js"></script>
</body>
</html>
