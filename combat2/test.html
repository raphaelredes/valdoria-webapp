<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Combate — Teste Standalone</title>
<link rel="stylesheet" href="../valdoria-design.css">
<style>
body { font-family: var(--v-font); color: var(--v-text); background: var(--v-bg); margin: 0; padding: 12px; max-width: 430px; margin: 0 auto; }
.banner { background: #5a3a1a; padding: 8px; text-align: center; border-radius: 6px; margin-bottom: 12px; font-size: 12px; color: #ffcc77; }
.c2 { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; justify-content: space-between; padding: 8px 12px; background: var(--v-bg-raised); border: 1px solid var(--v-border); border-radius: 6px; }
.row.active { border-color: var(--v-gold); box-shadow: 0 0 6px rgba(196,149,58,0.4); }
.row.dead { opacity: 0.4; text-decoration: line-through; }
.bar { height: 6px; background: var(--v-bg); border-radius: 3px; overflow: hidden; margin-top: -6px; }
.fill { height: 100%; background: linear-gradient(90deg, #5a8a3e, #8ab04e); transition: width .3s; }
.fill.low { background: linear-gradient(90deg, #a04a2a, #c06a3a); }
.log { max-height: 160px; overflow-y: auto; padding: 8px; background: var(--v-bg-card); border: 1px solid var(--v-border); border-radius: 6px; font-size: 13px; }
.log div { padding: 2px 0; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { flex: 1; padding: 12px; background: var(--v-bg-raised); border: 1px solid var(--v-border); color: var(--v-text); border-radius: 6px; font: inherit; cursor: pointer; }
.btn.primary { background: linear-gradient(180deg, rgba(196,149,58,.3), rgba(139,100,32,.3)); border-color: var(--v-gold); color: var(--v-gold); font-weight: 600; }
.end { text-align: center; padding: 24px; font-size: 22px; }
.end.victory { color: #8ab04e; }
.end.defeat { color: #c06a3a; }
.end.fled { color: var(--v-text-dim); }
.dice-wrap { display: flex; justify-content: center; padding: 8px 0; }
#dice-canvas { width: 140px; height: 140px; }
.phase { text-align: center; color: var(--v-text-dim); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="banner">MODO TESTE — lógica em JS, zero backend, zero token</div>
<div id="app"><div class="phase">Carregando...</div></div>

<script>
/* Port fiel do step() Python para JS. */
function roll(n) { return Math.floor(Math.random() * n) + 1; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* Catalogo REAL dos monstros do jogo (src/game/enemies/). */
var BESTIARY = [
    { name: 'Goblin',                    hp: 7,  ac: 15, atk: 4, die: 6, dex: 14, icon: '👺' },
    { name: 'Orc',                       hp: 15, ac: 13, atk: 5, die: 12, dex: 12, icon: '👹' },
    { name: 'Esqueleto',                 hp: 13, ac: 13, atk: 4, die: 6, dex: 14, icon: '💀' },
    { name: 'Aranha Gigante',            hp: 26, ac: 14, atk: 5, die: 8, dex: 16, icon: '🕷️' },
    { name: 'Sapo Gigante',              hp: 18, ac: 11, atk: 3, die: 6, dex: 13, icon: '🐸' },
    { name: 'Homem-Lagarto',             hp: 22, ac: 15, atk: 4, die: 6, dex: 10, icon: '🦎' },
    { name: 'Crocodilo',                 hp: 19, ac: 12, atk: 4, die: 10, dex: 10, icon: '🐊' },
    { name: 'Cobra Constritora Gigante', hp: 60, ac: 12, atk: 6, die: 10, dex: 14, icon: '🐍' },
    { name: 'Bruxa Verde',               hp: 82, ac: 17, atk: 6, die: 8, dex: 12, icon: '🧙‍♀️' },
    { name: 'Mímico',                    hp: 58, ac: 12, atk: 5, die: 8, dex: 12, icon: '📦' },
];

/* Personagens ficticios aleatorios para testes. */
var CHAR_NAMES = ['Kael', 'Elara', 'Thorne', 'Miriel', 'Garrick', 'Sylas', 'Vaela', 'Rurik', 'Isen', 'Brynn'];
var CHAR_CLASSES = [
    { cls: 'Guerreiro', hp: [28, 40], ac: [16, 18], atk: [5, 7], die: 10, dex: [12, 14], icon: '⚔️' },
    { cls: 'Mago',      hp: [18, 26], ac: [12, 13], atk: [3, 5], die: 6,  dex: [12, 16], icon: '🧙' },
    { cls: 'Ladino',    hp: [22, 30], ac: [14, 15], atk: [4, 6], die: 8,  dex: [16, 18], icon: '🗡️' },
    { cls: 'Clérigo',   hp: [24, 32], ac: [15, 17], atk: [4, 6], die: 8,  dex: [10, 12], icon: '🛡️' },
];
function rng(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

function randomPlayer() {
    var cls = pick(CHAR_CLASSES);
    var hp = rng(cls.hp[0], cls.hp[1]);
    return {
        t: 'p', name: pick(CHAR_NAMES) + ' o ' + cls.cls, cls: cls.cls, icon: cls.icon,
        hp: hp, mhp: hp,
        ac: rng(cls.ac[0], cls.ac[1]),
        atk: rng(cls.atk[0], cls.atk[1]),
        die: cls.die,
        dex: rng(cls.dex[0], cls.dex[1]),
        alive: true,
    };
}

function randomEnemies() {
    var n = rng(1, 3);
    var es = [];
    for (var i = 0; i < n; i++) {
        var b = pick(BESTIARY);
        es.push({ t: 'e', name: b.name + (n > 1 ? ' ' + (i + 1) : ''),
                  hp: b.hp, mhp: b.hp, ac: b.ac, atk: b.atk, die: b.die,
                  dex: b.dex, icon: b.icon, alive: true });
    }
    return es;
}

function newCombat(player, enemies) {
    var p = player || randomPlayer();
    var es = enemies || randomEnemies();
    var order = [p].concat(es);
    order.forEach(function (c) { c.init = roll(20) + Math.floor((c.dex - 10) / 2); });
    order.sort(function (a, b) { return b.init - a.init || (a.t === 'p' ? -1 : 1); });
    var p_idx = order.findIndex(function (c) { return c.t === 'p'; });
    return { phase: 'init', order: order, p_idx: p_idx, active_idx: 0, round: 1, log: [], last: null };
}

function step(s, action) {
    var t = action.type;
    if (s.phase === 'init' && t === 'start') {
        s.phase = 'active';
        runNpcsUntilPlayer(s);
        return s;
    }
    if (s.phase !== 'active') return s;
    if (t === 'flee') {
        s.phase = 'fled';
        s.log.push(s.order[s.p_idx].name + ' foge.');
        return s;
    }
    if (t === 'attack') hit(s, s.p_idx, action.target);
    if (checkEnd(s)) return s;
    s.active_idx = (s.p_idx + 1) % s.order.length;
    runNpcsUntilPlayer(s);
    return s;
}

function runNpcsUntilPlayer(s) {
    while (s.active_idx !== s.p_idx && s.phase === 'active') {
        var c = s.order[s.active_idx];
        if (c.alive) hit(s, s.active_idx, s.p_idx);
        if (checkEnd(s)) return;
        var nxt = (s.active_idx + 1) % s.order.length;
        if (nxt === 0) s.round++;
        s.active_idx = nxt;
    }
}

function hit(s, aIdx, tIdx) {
    var a = s.order[aIdx], d = s.order[tIdx];
    if (!a || !d || !d.alive) return;
    var r = roll(20);
    if (r + a.atk < d.ac && r !== 20) {
        s.log.push(a.name + ' erra ' + d.name + ' (d20=' + r + ').');
        s.last = { a: a.name, t: d.name, roll: r, hit: false };
        return;
    }
    var dmg = Math.max(1, roll(a.die) + (r === 20 ? roll(a.die) : 0));
    d.hp = Math.max(0, d.hp - dmg);
    d.alive = d.hp > 0;
    s.log.push(a.name + ' causa ' + dmg + ' em ' + d.name + ' (d20=' + r + ').');
    s.last = { a: a.name, t: d.name, roll: r, hit: true, dmg: dmg, crit: r === 20 };
}

function checkEnd(s) {
    if (!s.order[s.p_idx].alive) { s.phase = 'defeat'; return true; }
    if (!s.order.some(function (c) { return c.t === 'e' && c.alive; })) { s.phase = 'victory'; return true; }
    return false;
}

/* --- UI ---------------------------------------------------------- */
var _s = null, _dice = null;

function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
}

function btn(label, primary, fn) {
    var b = el('button', 'btn' + (primary ? ' primary' : ''), label);
    b.addEventListener('click', fn);
    return b;
}

function row(c, active) {
    var w = el('div');
    var r = el('div', 'row' + (active ? ' active' : '') + (!c.alive ? ' dead' : ''));
    r.appendChild(el('span', null, (c.icon || (c.t === 'p' ? '🗡️' : '👹')) + ' ' + c.name));
    r.appendChild(el('span', null, c.hp + '/' + c.mhp));
    w.appendChild(r);
    var bar = el('div', 'bar');
    var fill = el('div', 'fill' + ((c.hp / c.mhp) < .33 ? ' low' : ''));
    fill.style.width = Math.max(0, (c.hp / c.mhp) * 100) + '%';
    bar.appendChild(fill);
    w.appendChild(bar);
    return w;
}

function render(s) {
    _s = s;
    var app = document.getElementById('app');
    while (app.firstChild) app.removeChild(app.firstChild);
    var wrap = el('div', 'c2');
    wrap.appendChild(el('div', 'phase', s.phase + ' · rodada ' + s.round));

    if (s.phase === 'victory' || s.phase === 'defeat' || s.phase === 'fled') {
        var lbl = { victory: 'VITÓRIA', defeat: 'DERROTA', fled: 'VOCÊ FUGIU' }[s.phase];
        wrap.appendChild(el('div', 'end ' + s.phase, lbl));
        wrap.appendChild(btn('🔄 Reiniciar', true, function () { render(newCombat()); }));
        app.appendChild(wrap);
        return;
    }

    if (s.phase === 'init') {
        wrap.appendChild(el('div', 'phase', 'Iniciativa'));
        s.order.forEach(function (c) {
            var r = el('div', 'row');
            r.appendChild(el('span', null, (c.icon || (c.t === 'p' ? '🗡️' : '👹')) + ' ' + c.name));
            r.appendChild(el('span', null, 'd20 = ' + c.init));
            wrap.appendChild(r);
        });
        wrap.appendChild(btn('⚔️ Iniciar Combate', true, function () { render(step(s, { type: 'start' })); }));
        app.appendChild(wrap);
        return;
    }

    s.order.forEach(function (c, i) { wrap.appendChild(row(c, i === s.active_idx)); });

    if (s.log && s.log.length) {
        var log = el('div', 'log');
        s.log.slice(-6).forEach(function (line) { log.appendChild(el('div', null, line)); });
        wrap.appendChild(log);
    }

    var actions = el('div', 'actions');
    if (s.active_idx === s.p_idx) {
        var firstEnemy = s.order.findIndex(function (c) { return c.t === 'e' && c.alive; });
        if (firstEnemy >= 0) actions.appendChild(btn('⚔️ Atacar', true, function () { doAction({ type: 'attack', target: firstEnemy }); }));
        actions.appendChild(btn('🏃 Fugir', false, function () { render(step(s, { type: 'flee' })); }));
    } else {
        actions.appendChild(el('div', 'phase', '⏳ Turno de ' + s.order[s.active_idx].name));
    }
    wrap.appendChild(actions);
    app.appendChild(wrap);
}

function showDice(result, cb) {
    if (!window.Dice3D) { cb && cb(); return; }
    var app = document.getElementById('app');
    var wrap = el('div', 'dice-wrap');
    var canvas = el('canvas'); canvas.id = 'dice-canvas'; canvas.width = 140; canvas.height = 140;
    wrap.appendChild(canvas);
    app.insertBefore(wrap, app.firstChild);
    try {
        _dice = new window.Dice3D(canvas, { sides: 20 });
        _dice.roll(result, function () { setTimeout(function () { wrap.remove(); cb && cb(); }, 600); });
    } catch (e) { wrap.remove(); cb && cb(); }
}

function doAction(a) {
    var next = step(_s, a);
    if (next.last && next.last.roll) {
        showDice(next.last.roll, function () { render(next); });
    } else {
        render(next);
    }
}

/* Inicia com combate novo */
render(newCombat());
</script>
<script>
/* Carrega dice-3d opcional. Se falhar, cai para modo sem dado animado. */
var ds = document.createElement('script');
ds.src = '../shared/dice-3d.js?v=' + Date.now();
ds.async = false;
document.body.appendChild(ds);
</script>
</body>
</html>
