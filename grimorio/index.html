<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self'; connect-src 'self' https: wss:; frame-src 'none'; object-src 'none'; base-uri 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1510">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>html{background:#1a1510}</style>
    <link rel="preload" href="../shared/fonts/medievalsharp.woff2" as="font" type="font/woff2" crossorigin>
    <meta name="description" content="Fragmentos de Valdoria - Lore misteriosa sobre a Esfera Dourada">
    <meta property="og:title" content="Fragmentos de Valdoria">
    <meta property="og:description" content="Registros antigos sobre um artefato que ninguem compreende">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../shared/fonts.css">
    <title>Fragmentos de Valdoria</title>
    <script>
        /* cache busting — project standard (see CLAUDE.md "Cache Busting" rule) */
        var v = Date.now();
    </script>
    <script>
        var _link = function(href) {
            var l = document.createElement('link');
            l.rel = 'stylesheet';
            l.href = href + '?v=' + v;
            document.head.appendChild(l);
        };
        _link('../valdoria-design.css');
        _link('lore-book.css');
        /* Load shared error reporter + audio manager (project standard) */
        var _scr = function(src) {
            var s = document.createElement('script');
            s.src = src + '?v=' + v;
            document.head.appendChild(s);
        };
        _scr('../shared/console-collector.js');
        _scr('../shared/error-reporter.js');
        _scr('../shared/audio-manager.js');
    </script>
</head>

<body>
    <!-- SVG filters — only edge distortion effects (subtle, not texture) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <defs>
            <!-- Burn edge — organic displacement for charred borders -->
            <filter id="burn-edge" x="-2%" y="-2%" width="104%" height="104%">
                <feTurbulence type="turbulence" baseFrequency="0.03" numOctaves="3" seed="15" result="warp"/>
                <feDisplacementMap in="SourceGraphic" in2="warp" scale="4" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
            <!-- Torn paper — jagged displacement for ripped edges -->
            <filter id="torn-paper" x="-2%" y="-2%" width="104%" height="104%">
                <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="4" seed="42" result="tear"/>
                <feDisplacementMap in="SourceGraphic" in2="tear" scale="5" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
        </defs>
    </svg>

    <div id="book-container" class="book-container">
        <!-- Cover -->
        <div id="cover" class="page cover active">
            <div class="cover-particles">
                <div class="cover-particle"></div>
                <div class="cover-particle"></div>
                <div class="cover-particle"></div>
                <div class="cover-particle"></div>
                <div class="cover-particle"></div>
                <div class="cover-particle"></div>
            </div>
            <div class="cover-inner">
                <img src="logo-3d.png" alt="Lendas de Valdoria" class="cover-logo" width="280" height="280">
                <div class="cover-divider"></div>
                <p class="cover-subtitle">Fragmentos sobre a Esfera Dourada</p>
                <p class="cover-subtitle dim">Coletados de fontes diversas ao longo das eras</p>
                <button id="btn-start" class="cover-btn" aria-label="Abrir o grimorio">Abrir</button>
            </div>
        </div>

        <!-- Index page -->
        <div id="page-index" class="page index-page">
            <div class="page-parchment">
                <h2 class="index-title">Indice dos Fragmentos</h2>
                <div id="index-list" class="index-list"></div>
            </div>
            <div class="page-nav">
                <button class="nav-arrow nav-left" data-dir="prev" aria-label="Pagina anterior">&#9664;</button>
                <span id="page-counter" class="page-counter"></span>
                <button class="nav-arrow nav-right" data-dir="next" aria-label="Proxima pagina">&#9654;</button>
            </div>
        </div>

        <!-- Fragment spread (contains left + right pages for desktop, single for mobile) -->
        <div id="page-fragment" class="page fragment-page">
            <!-- Top bar: index button + type/era info -->
            <div class="fragment-topbar">
                <button id="btn-index" class="btn-index" aria-label="Indice" title="Indice">&#9776;</button>
                <div class="fragment-topbar-info">
                    <span id="frag-icon" class="fragment-icon"></span>
                    <span id="frag-type" class="fragment-type"></span>
                </div>
                <span id="frag-era" class="fragment-era"></span>
            </div>
            <div class="spread-container">
                <!-- Left page (always visible) -->
                <div id="parchment" class="page-parchment spread-left">
                    <div class="reading-particles">
                        <div class="reading-particle"></div>
                        <div class="reading-particle"></div>
                        <div class="reading-particle"></div>
                        <div class="reading-particle"></div>
                    </div>
                    <h2 id="frag-title" class="fragment-title"></h2>
                    <div class="fragment-meta">
                        <span id="frag-author" class="fragment-author"></span>
                    </div>
                    <div id="frag-content" class="fragment-content"></div>
                    <div id="frag-notes" class="fragment-notes"></div>
                </div>
                <!-- Spine shadow (desktop/tablet only) -->
                <div class="book-spine"></div>
                <!-- Right page (desktop/tablet only) -->
                <div id="parchment-right" class="page-parchment spread-right">
                    <div class="reading-particles">
                        <div class="reading-particle"></div>
                        <div class="reading-particle"></div>
                    </div>
                    <h2 id="frag-title-r" class="fragment-title"></h2>
                    <div class="fragment-meta">
                        <span id="frag-author-r" class="fragment-author"></span>
                    </div>
                    <div id="frag-content-r" class="fragment-content"></div>
                    <div id="frag-notes-r" class="fragment-notes"></div>
                </div>
            </div>
            <div class="page-nav">
                <div class="progress-bar-track"><div id="progress-bar" class="progress-bar-fill" style="width:0%"></div></div>
                <button class="nav-arrow nav-left" data-dir="prev" aria-label="Pagina anterior">&#9664;</button>
                <span id="page-counter-frag" class="page-counter"></span>
                <button class="nav-arrow nav-right" data-dir="next" aria-label="Proxima pagina">&#9654;</button>
            </div>
        </div>
    </div>

    <!-- Tooltip for interactive words -->
    <div id="lore-tooltip" class="lore-tooltip">
        <button class="lore-tooltip-close" aria-label="Fechar">&times;</button>
        <div class="lore-tooltip-title" id="tooltip-title"></div>
        <div class="lore-tooltip-text" id="tooltip-text"></div>
        <div class="lore-tooltip-refs" id="tooltip-refs"></div>
    </div>

    <!-- Drawer overlay + half-sheet for expanded text -->
    <div id="drawer-overlay" class="lore-drawer-overlay"></div>
    <div id="lore-drawer" class="lore-drawer">
        <div class="lore-drawer-handle"></div>
        <div class="lore-drawer-header">
            <span class="lore-drawer-title" id="drawer-title">Texto Completo</span>
            <button class="lore-drawer-close" id="drawer-close" aria-label="Fechar">&times;</button>
        </div>
        <div class="lore-drawer-body" id="drawer-body"></div>
    </div>

    <script>
    (function() {
        var s = document.createElement('script');
        s.src = 'fragments-data.js?v=' + v;
        s.onload = function() {
            var s2 = document.createElement('script');
            s2.src = 'lore-book.js?v=' + v;
            document.body.appendChild(s2);
        };
        document.body.appendChild(s);
    })();
    </script>
</body>

</html>
