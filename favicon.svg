<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Orb gradient (matches loading-title.css .title-orb) -->
    <radialGradient id="orb" cx="0.38" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="20%" stop-color="#e8c45a"/>
      <stop offset="50%" stop-color="#c4953a"/>
      <stop offset="80%" stop-color="#8b6420"/>
      <stop offset="100%" stop-color="#5a3e10"/>
    </radialGradient>
    <!-- Inner highlight -->
    <radialGradient id="hi" cx="0.38" cy="0.30" r="0.25">
      <stop offset="0%" stop-color="#fff4d0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff4d0" stop-opacity="0"/>
    </radialGradient>
    <!-- Outer glow -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c4953a" stop-opacity="0"/>
      <stop offset="60%" stop-color="#c4953a" stop-opacity="0"/>
      <stop offset="80%" stop-color="#c4953a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c4953a" stop-opacity="0"/>
    </radialGradient>
    <!-- Background -->
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2e2520"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </radialGradient>
    <!-- Orb shadow -->
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#c4953a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Dark background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>

  <!-- Outer glow -->
  <circle cx="32" cy="32" r="30" fill="url(#glow)"/>

  <!-- Main orb -->
  <circle cx="32" cy="30" r="16" fill="url(#orb)" filter="url(#sh)"/>

  <!-- Inner highlight (shine) -->
  <ellipse cx="28" cy="25" rx="6" ry="5" fill="url(#hi)"/>

  <!-- Bottom reflection -->
  <ellipse cx="34" cy="39" rx="4" ry="2" fill="#5a3e10" opacity="0.3"/>

  <!-- Rim light (top-left) -->
  <path d="M20 24 A16 16 0 0 1 38 18" fill="none" stroke="#fff4d0" stroke-width="0.8" opacity="0.25"/>
</svg>
