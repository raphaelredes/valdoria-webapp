<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://telegra.ph; media-src 'self'; connect-src 'self' https: wss:; frame-src 'none'; object-src 'none'; base-uri 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a2420">
    <link rel="preload" href="../shared/fonts/medievalsharp.woff2" as="font" type="font/woff2" crossorigin>
    <title>Prologo - Lendas de Valdoria</title>
    <link rel="stylesheet" href="../shared/fonts.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
        var v = Date.now();
        document.write('<link rel="stylesheet" href="../valdoria-design.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/animations.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/loading.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="prologue.css?v=' + v + '">');
    </script>
    <script>
    document.write('<script src="../shared/font-apply.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/bounce-back.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/haptic.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/webapp-init.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/session-heartbeat.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/exit-confirm.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/loading-guard.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/audio-manager.js?v=' + v + '"><\/script>');
    </script>
</head>

<body>
    <!-- Main viewport with horizontal slide transitions -->
    <div id="viewport">
        <div id="track"></div>
    </div>

    <!-- Sub-screen overlay for long lore text -->
    <div class="sub-screen" id="loreOverlay">
        <div class="sub-screen-header">
            <button class="v-btn v-btn-secondary v-btn-pill" onclick="closeLoreOverlay()">← Voltar</button>
        </div>
        <div class="sub-screen-body" id="loreOverlayBody"></div>
    </div>

    <!-- Dice overlay for distract skill check -->
    <div class="dice-overlay" id="diceOverlay">
        <div class="dice-content">
            <div class="dice-title" id="diceTitle">TESTE DE SOBREVIVÊNCIA</div>
            <div class="dice-container">
                <div class="dice3d-canvas" id="prologueDice3dCanvas"></div>
                <div class="dice-d20" id="diceD20" style="display:none">?</div>
            </div>
            <div class="dice-breakdown" id="diceBreakdown"></div>
            <div class="dice-result-label" id="diceResultLabel"></div>
            <div class="dice-narrative" id="diceNarrative"></div>
            <div class="dice-actions" id="diceActions"></div>
        </div>
    </div>

    <!-- Result overlay for gate/lore interaction -->
    <div class="result-overlay" id="resultOverlay">
        <div class="result-content">
            <div class="result-text" id="resultText"></div>
            <div class="result-effects" id="resultEffects"></div>
            <button class="v-skip-btn" id="resultSkip">Pular ▸</button>
        </div>
    </div>

    <!-- Initial loading (magic circle with narrative) -->
    <div id="initLoading" class="loading-overlay">
        <div class="loading-particles">
            <div class="particle ember p1"></div>
            <div class="particle ember p2"></div>
            <div class="particle ember p3"></div>
            <div class="particle spark s1"></div>
            <div class="particle spark s2"></div>
            <div class="particle mote m1"></div>
            <div class="particle arcane ar1"></div>
            <div class="particle arcane ar2"></div>
        </div>
        <!-- Magic summoning circle -->
        <div class="magic-circle">
            <!-- Aura glow layers -->
            <div class="mc-aura"></div>
            <div class="mc-aura mc-aura-2"></div>

            <!-- Outer rune ring (Elder Futhark runes rotating CW) -->
            <svg class="mc-ring mc-outer" viewBox="0 0 300 300">
                <defs>
                    <path id="runeOuter" d="M150,150 m-125,0 a125,125 0 1,1 250,0 a125,125 0 1,1 -250,0"/>
                </defs>
                <circle cx="150" cy="150" r="125" fill="none" stroke="rgba(196,149,58,0.06)" stroke-width="1"/>
                <circle cx="150" cy="150" r="127" fill="none" stroke="rgba(196,149,58,0.04)" stroke-width="0.5" stroke-dasharray="4 8"/>
                <text class="mc-rune-text" fill="rgba(196,149,58,0.5)">
                    <textPath href="#runeOuter" startOffset="0%">&#5792; &#5794; &#5798; &#5800; &#5809; &#5810; &#5815; &#5817; &#5818; &#5822; &#5825; &#5827; &#5831; &#5832; &#5833; &#5834; &#5839; &#5842; &#5846; &#5848; &#5850; &#5852; &#5853; &#5855;</textPath>
                </text>
            </svg>

            <!-- Mid energy ring (arcs rotating CCW) -->
            <svg class="mc-ring mc-mid" viewBox="0 0 300 300">
                <circle cx="150" cy="150" r="102" fill="none" stroke="rgba(196,149,58,0.05)" stroke-width="0.5"/>
                <circle class="mc-energy-arc mc-arc-1" cx="150" cy="150" r="102" fill="none" stroke="rgba(196,149,58,0.6)" stroke-width="1.5" stroke-linecap="round"/>
                <circle class="mc-energy-arc mc-arc-2" cx="150" cy="150" r="96" fill="none" stroke="rgba(123,32,32,0.5)" stroke-width="1.5" stroke-linecap="round"/>
                <!-- Geometric marks at cardinal points -->
                <g opacity="0.3" fill="none" stroke="rgba(196,149,58,0.6)" stroke-width="1">
                    <line x1="150" y1="44" x2="150" y2="54"/>
                    <line x1="150" y1="246" x2="150" y2="256"/>
                    <line x1="44" y1="150" x2="54" y2="150"/>
                    <line x1="246" y1="150" x2="256" y2="150"/>
                    <!-- Diagonal marks -->
                    <line x1="78" y1="78" x2="85" y2="85" opacity="0.5"/>
                    <line x1="222" y1="78" x2="215" y2="85" opacity="0.5"/>
                    <line x1="78" y1="222" x2="85" y2="215" opacity="0.5"/>
                    <line x1="222" y1="222" x2="215" y2="215" opacity="0.5"/>
                </g>
            </svg>

            <!-- Inner text ring (VALDORIA rotating CW faster) -->
            <svg class="mc-ring mc-inner" viewBox="0 0 300 300">
                <defs>
                    <path id="runeInner" d="M150,150 m-75,0 a75,75 0 1,1 150,0 a75,75 0 1,1 -150,0"/>
                </defs>
                <circle cx="150" cy="150" r="75" fill="none" stroke="rgba(196,149,58,0.06)" stroke-width="0.5"/>
                <text class="mc-inner-text" fill="rgba(196,149,58,0.35)">
                    <textPath href="#runeInner" startOffset="0%">&#9670; VALDORIA &#9670; LENDAS &#9670; VALDORIA &#9670; LENDAS </textPath>
                </text>
            </svg>

            <!-- Magic pulse (periodic radial flash) -->
            <div class="mc-pulse"></div>
            <div class="mc-pulse mc-pulse-2"></div>
            </div>

            <!-- Completion pulse waves (triggered at 100%) -->
            <div class="mc-completion-wave"></div>
            <div class="mc-completion-wave wave-2"></div>
        </div>

        <div class="loading-flash"></div>
        <div class="loading-brand">
            <div class="loading-title">PRÓLOGO</div>
            <div class="loading-divider"><span class="divider-rune">&#9670;</span></div>
        </div>
        <div class="loading-progress-wrap">
            <div class="loading-progress-track">
                <div id="init-loading-progress" class="loading-progress-fill"></div>
            </div>
        </div>
        <div class="loading-tip-area">
            <div id="init-loading-tip" class="loading-tip">O destino começa a tecer sua história...</div>
        </div>
    </div>
    <script>
    (function() {
        var TIPS = [
            'O destino começa a tecer sua história nas terras de Valdoria...',
            'Uma nova lenda está prestes a ser escrita...',
            'Os ventos da mudança sopram sobre as terras antigas...',
            'Estrelas se alinham, e o caminho do aventureiro se ilumina...',
            'O pergaminho do destino aguarda suas primeiras palavras...',
            'Sombras e luz dançam enquanto o mundo se revela...',
        ];
        var tipEl = document.getElementById('init-loading-tip');
        var progressEl = document.getElementById('init-loading-progress');
        var overlay = document.getElementById('initLoading');
        var tipIndex = Math.floor(Math.random() * TIPS.length);
        if (tipEl) tipEl.textContent = TIPS[tipIndex];
        var _loadStart = Date.now();
        var MIN_LOAD_MS = window.VALDORIA_MIN_LOAD_MS || 5000;
        var _progress = 0;
        var _progressTimer = setInterval(function() {
            _progress += (90 - _progress) * 0.08;
            if (progressEl) progressEl.style.width = _progress + '%';
        }, 200);
        var _tipInterval = setInterval(function() {
            tipIndex = (tipIndex + 1) % TIPS.length;
            if (tipEl) {
                tipEl.classList.add('tip-exit');
                setTimeout(function() {
                    tipEl.textContent = TIPS[tipIndex];
                    tipEl.classList.remove('tip-exit');
                    tipEl.classList.add('tip-enter');
                    setTimeout(function() { tipEl.classList.remove('tip-enter'); }, 350);
                }, 300);
            }
        }, 5000);
        window._prologueInitLoading = {
            hide: function() {
                clearInterval(_tipInterval);
                clearInterval(_progressTimer);
                if (!overlay || overlay.classList.contains('hidden')) return;
                var elapsed = Date.now() - _loadStart;
                var remaining = MIN_LOAD_MS - elapsed;
                if (remaining > 0) {
                    setTimeout(function() { window._prologueInitLoading.hide(); }, remaining);
                    return;
                }
                if (progressEl) progressEl.style.width = '100%';
                var waves = overlay.querySelectorAll('.mc-completion-wave');
                waves.forEach(function(w) { w.classList.add('active'); });
                try {
                    if (window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
                        Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
                    }
                } catch(_) {}
                setTimeout(function() {
                    overlay.classList.add('exit-cinematic');
                    setTimeout(function() { overlay.classList.add('hidden'); }, 950);
                }, 150);
            }
        };
    })();
    </script>

    <!-- Mid-flow loading (simple overlay for combat staging, etc.) -->
    <div class="v-loading-overlay" id="loading" style="display:none">
        <div class="v-loading-spinner"></div>
        <p>Carregando...</p>
    </div>

    <!-- Error overlay injected by shared/error-reporter.js -->

    <script>
        var v = Date.now();
        document.write('<script src="../shared/fetch-utils.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/dice-3d.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/text-timing.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/error-reporter.js?v=' + v + '"><\/script>');
        document.write('<script src="prologue.js?v=' + v + '"><\/script>');
    </script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js?v=5').catch(()=>{})}</script>
</body>

</html>
