    <!-- Tiered Cache (see docs/sistemas/cache-strategy.md) -->

    <script>
        // Tiered Cache: stable bundle hash for Bucket B asset query strings
        var v = (window.VBUNDLE_HASH || Date.now());
        document.write('<link rel="stylesheet" href="../valdoria-design.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/animations.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/loading.css?v=' + v + '">');

        document.write('<link rel="stylesheet" href="../shared/drawer.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="prologue.css?v=' + v + '">');
        /* X-6.5.51AQ (2026-05-08): loading-title.css for AAA orb fallback in
           PADRAO_ALDRIC card header (when no NPC icon — narration-only scenes). */
        document.write('<link rel="stylesheet" href="../shared/loading-title.css?v=' + v + '">');
        /* Sessão #19 (2026-05-21): encounter-popup.css — PADRAO_ALDRIC v2
           canonical engine (char-by-char typewriter + cursor + paginação +
           sub-overlay choice picker). Shared com cidade/exploracao. */
        document.write('<link rel="stylesheet" href="../shared/encounter-popup.css?v=' + v + '">');
    </script>
    <script>
    document.write('<script src="../shared/orientation-gate.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/font-apply.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/escape.js?v=' + v + '"><\/script>');
    /* 2026-06-08 (user): aplica o Tamanho da Fonte escolhido pelo jogador (valdoria_font_size)
       TAMBEM no prologo, p/ as letras dos dialogos/narrativas escalarem via --v-font-scale
       (data-font-size no body -> mapping em valdoria-design.css). Igual cidade/combate. */
    (function(){try{var sz=localStorage.getItem('valdoria_font_size')||'normal';if(sz==='xlarge')sz='large';if(['small','normal','large'].indexOf(sz)<0)sz='normal';function ap(){if(document.body)document.body.setAttribute('data-font-size',sz);}if(document.body){ap();}else{document.addEventListener('DOMContentLoaded',ap);}}catch(_e){}})();
    document.write('<script src="../shared/bounce-back.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/haptic.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/action-guard.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/webapp-init.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/log-relay.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/session-heartbeat.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/exit-confirm.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/loading-template.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/loading-guard.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/processing-overlay.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/loading-controller.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/audio-manager.js?v=' + v + '"><\/script>');
    /* FASE C (sessão #11, 2026-05-19) — NPC Living System pra cascadar
       gossip do Thorne quando jogador chegar no Mercado depois do prólogo. */
    document.write('<script src="../shared/npc-relations-data.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/npc-living-system.js?v=' + v + '"><\/script>');
    /* 2026-05-11 (user request): seta animada inferior central. */
    document.write('<link rel="stylesheet" href="../shared/scroll-hint-arrow.css?v=' + v + '">');
    document.write('<script src="../shared/scroll-hint-arrow.js?v=' + v + '"><\/script>');
    document.write('<script>'
      + 'document.addEventListener("DOMContentLoaded", function(){'
      + '  if (window.vScrollHint && window.vScrollHint.register) {'
      + '    window.vScrollHint.register(".prologue-text");'
      + '    window.vScrollHint.register(".narrative-content");'
      + '    window.vScrollHint.register(".screen-content");'
      + '    window.vScrollHint.register(".v-popup-body");'
      + '  }'
      + '});'
      + '<\/script>');
    </script>
</head>

<body>

         Currently: ic-guerreiro (Thorne, the blacksmith). -->

          <circle cx="0" cy="35" r="4.5" fill="#c4953a" stroke="#0a0605" stroke-width="1.2"/>
          <circle cx="0" cy="35" r="2.8" fill="#ffd700"/>

        <g transform="translate(60 60) rotate(45)">
          <path d="M -4 -50 L 4 -50 L 4 10 L -4 10 Z" fill="#d8d8d8" stroke="#0a0605" stroke-width="1.5"/>
          <polygon points="-4,-50 4,-50 0,-62" fill="#d8d8d8" stroke="#0a0605" stroke-width="1.5"/>
          <rect x="-1.2" y="-46" width="2.4" height="54" fill="#8a8a8a"/>
          <line x1="-3" y1="-48" x2="-3" y2="8" stroke="#fff" stroke-width="0.7" opacity="0.6"/>
          <path d="M -15 8 L 15 8 L 17 15 L -17 15 Z" fill="#c4953a" stroke="#0a0605" stroke-width="1.2"/>
          <circle cx="0" cy="11.5" r="2" fill="#c02020" stroke="#0a0605" stroke-width="0.6"/>

          <g stroke="#0a0605" stroke-width="0.5"><line x1="-3.5" y1="18" x2="3.5" y2="19"/><line x1="-3.5" y1="21" x2="3.5" y2="22"/><line x1="-3.5" y1="24" x2="3.5" y2="25"/><line x1="-3.5" y1="27" x2="3.5" y2="28"/></g>
          <circle cx="0" cy="35" r="4.5" fill="#c4953a" stroke="#0a0605" stroke-width="1.2"/>
          <circle cx="0" cy="35" r="2.8" fill="#ffd700"/>
        </g>
        <circle cx="60" cy="60" r="5" fill="#c4953a" stroke="#0a0605" stroke-width="1.5"/>
        <circle cx="60" cy="60" r="3" fill="#ffd700"/>
        <circle cx="60" cy="60" r="1.2" fill="#fff8d0"/>
      </symbol>
    </defs></svg>

    <!-- Main viewport with horizontal slide transitions -->
    <div id="viewport">
        <div id="track"></div>
    </div>

    <!-- Sub-screen overlay for long lore text -->
    <div class="sub-screen" id="loreOverlay">
        <div class="sub-screen-header">
            <button class="v-btn v-btn-secondary v-btn-pill" onclick="closeLoreOverlay()">← Voltar</button>
        </div>
        <div class="sub-screen-body" id="loreOverlayBody"></div>
    </div>

    <!-- Dice overlay for distract skill check -->
    <div class="dice-overlay" id="diceOverlay">
        <div class="dice-content">
            <div class="dice-title" id="diceTitle">TESTE DE SOBREVIVÊNCIA</div>
            <div class="dice-container">
                <div class="dice3d-canvas" id="prologueDice3dCanvas"></div>
                <div class="dice-d20" id="diceD20" style="display:none">?</div>
            </div>
            <div class="dice-breakdown" id="diceBreakdown"></div>
            <div class="dice-result-label" id="diceResultLabel"></div>
            <div class="dice-narrative" id="diceNarrative"></div>
            <div class="dice-actions" id="diceActions"></div>
        </div>
    </div>

    <!-- Result overlay for gate/lore interaction -->
    <div class="result-overlay" id="resultOverlay">
        <div class="result-content">
            <div class="result-text" id="resultText"></div>
            <div class="result-effects" id="resultEffects"></div>
            <button class="v-skip-btn" id="resultSkip">Pular ▸</button>
        </div>
    </div>

    <!-- Initial loading (magic circle with narrative) -->
    <!-- Processing overlay injected by shared/processing-overlay.js -->
    <!-- Loading controller -->
    <script>
    document.write('<script src="prologue-loading.js?v=' + v + '"><\/script>');
    </script>

    <!-- Mid-flow loading (simple overlay for combat staging, etc.) -->
    <div class="v-loading-overlay" id="loading" style="display:none">
        <div class="v-loading-spinner"></div>
        <p>Carregando...</p>
    </div>

    <!-- Error overlay injected by shared/error-reporter.js -->

    <script>
        // Tiered Cache: stable bundle hash for Bucket B asset query strings
        var v = (window.VBUNDLE_HASH || Date.now());
        document.write('<script src="../shared/fetch-utils.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/dice-utils.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/script-loader.js?v=' + v + '"><\/script>');
    </script>
    <script>
    window._diceReady = false;
    vLoadScripts([
      { src: 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js',
        id: 'three', optional: true, fallback: '../shared/three.min.js', timeout: 6000 },
      { src: '../shared/dice-3d.js', id: 'dice3d', optional: true },
    ], function(r) { window._diceReady = true; });
    </script>
    <script>
        document.write('<script src="../shared/text-timing.js?v=' + v + '"><\/script>');
        document.write('<link rel="stylesheet" href="../shared/connection-overlay.css?v=' + v + '">');
        document.write('<script src="../shared/connection-overlay.js?v=' + v + '"><\/script>');

        document.write('<script src="../shared/popup.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/drawer.js?v=' + v + '"><\/script>');
        /* Sessão #19 (2026-05-21): PADRAO_ALDRIC v2 engine. DEVE carregar ANTES
           de prologue.js (que chama vEncounter.render). */
        document.write('<script src="../shared/dnd-rules-shared.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/encounter-popup.js?v=' + v + '"><\/script>');
        /* Sessao #32 (2026-05-25): lightbox.js permite ampliar retrato dos NPCs
           (PADRAO_ALDRIC canonical). Cidade carrega; prologo nao carregava — Thorne
           portrait nao ampliava ao clicar. User pediu paridade. */
        document.write('<script src="../shared/lightbox.js?v=' + v + '"><\/script>');
        document.write('<script src="prologue.js?v=' + v + '"><\/script>');
    </script>
<script>if(typeof ValdoriaErrors!=="undefined")ValdoriaErrors.init("PROLOGUE")</script>
</body>
