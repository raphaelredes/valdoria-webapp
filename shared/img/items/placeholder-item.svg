<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2015"/>
      <stop offset="70%" stop-color="#18120b"/>
      <stop offset="100%" stop-color="#0d0a06"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0b865"/>
      <stop offset="50%" stop-color="#7d5e2a"/>
      <stop offset="100%" stop-color="#4a3818"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="4" y="4" width="112" height="112" rx="14" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- Inner Frame Accent -->
  <rect x="10" y="10" width="100" height="100" rx="10" fill="none" stroke="#5a452a" stroke-width="1" stroke-opacity="0.4"/>
  
  <!-- Silhouette of anvil & hammer / mystery item -->
  <g fill="#7d6a52" opacity="0.65" transform="translate(60, 52)">
    <!-- Sparkles -->
    <path d="M0 -34 L3 -26 L11 -23 L3 -20 L0 -12 L-3 -20 L-11 -23 L-3 -26 Z" fill="#c4953a" opacity="0.8"/>
    <circle cx="22" cy="-18" r="1.5" fill="#e0b865" opacity="0.6"/>
    <circle cx="-20" cy="-15" r="1.5" fill="#e0b865" opacity="0.6"/>
    <!-- Mystery Crest / Question Mark in Shield -->
    <path d="M-22 -16 C-22 -16, 0 -24, 0 -24 C0 -24, 22 -16, 22 -16 C22 12, 12 24, 0 30 C-12 24, -22 12, -22 -16 Z" fill="#241a10" stroke="#8c6f3e" stroke-width="1.5"/>
    <!-- Hammer silhouette in shield -->
    <path d="M-8 -6 L-4 -10 L10 4 L6 8 Z" fill="#9c7a42"/>
    <rect x="-11" y="-12" width="8" height="6" rx="1" transform="rotate(-45 -7 -9)" fill="#baa16a"/>
  </g>

  <!-- Banner "EM FORJA" / "SEM ARTE" -->
  <rect x="18" y="86" width="84" height="18" rx="4" fill="#140f09" stroke="#7a5b28" stroke-width="1"/>
  <text x="60" y="99" font-family="'Cinzel', serif, sans-serif" font-size="8.5" font-weight="bold" fill="#caa45a" text-anchor="middle" letter-spacing="1">EM FORJA</text>
</svg>
