<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://telegra.ph https://i.ibb.co; media-src 'self'; connect-src 'self' https: wss:; frame-src 'none'; object-src 'none'; base-uri 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a2420">
    <style>html{opacity:0}</style>
    <link rel="preload" href="../shared/fonts/medievalsharp.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../shared/fonts.css">
    <title>Mochila - Lendas de Valdoria</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        var v = Date.now();
        document.write('<link rel="stylesheet" href="../valdoria-design.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/status-bars.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/toast.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/popup.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/tabs.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/animations.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/loading.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="inventory.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/image-popup.css?v=' + v + '">');
    </script>
    <script>
    document.write('<script src="../shared/font-apply.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/bounce-back.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/haptic.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/webapp-init.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/session-heartbeat.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/exit-confirm.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/loading-guard.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/loading-controller.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/toast.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/popup.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/status-bars.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/audio-manager.js?v=' + v + '"><\/script>');
    </script>
</head>

<body>
    <!-- Loading overlay (backpack opening) -->
    <div id="loadingOverlay" class="loading-overlay" style="opacity:0" aria-busy="true">
        <div class="backpack-anim">
            <div class="bp-glow"></div>
            <svg class="bp-icon" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Strap -->
                <path d="M35 10 Q35 2 50 2 Q65 2 65 10" stroke="rgba(196,149,58,0.5)" stroke-width="2" fill="none"/>
                <!-- Backpack body -->
                <rect x="20" y="25" width="60" height="70" rx="8" fill="rgba(80,50,25,0.6)" stroke="rgba(196,149,58,0.4)" stroke-width="1.5"/>
                <!-- Flap (opens) -->
                <path class="bp-flap" d="M20 40 Q20 25 50 20 Q80 25 80 40" fill="rgba(100,60,30,0.7)" stroke="rgba(196,149,58,0.5)" stroke-width="1.5"/>
                <!-- Buckle -->
                <rect x="44" y="42" width="12" height="8" rx="2" fill="rgba(196,149,58,0.3)" stroke="rgba(196,149,58,0.5)" stroke-width="1"/>
                <!-- Pocket -->
                <rect x="32" y="60" width="36" height="20" rx="4" fill="rgba(60,40,20,0.5)" stroke="rgba(196,149,58,0.2)" stroke-width="1"/>
                <!-- Golden sparkles (appear when opening) -->
                <circle class="bp-sparkle s1" cx="40" cy="30" r="2" fill="rgba(196,149,58,0.8)"/>
                <circle class="bp-sparkle s2" cx="60" cy="28" r="1.5" fill="rgba(196,149,58,0.6)"/>
                <circle class="bp-sparkle s3" cx="50" cy="22" r="2.5" fill="rgba(196,149,58,0.7)"/>
                <circle class="bp-sparkle s4" cx="35" cy="25" r="1" fill="rgba(255,220,120,0.8)"/>
                <circle class="bp-sparkle s5" cx="65" cy="24" r="1.5" fill="rgba(255,220,120,0.6)"/>
            </svg>
        </div>
        <div class="loading-brand">
            <div class="loading-title">MOCHILA</div>
            <div class="loading-divider"><span class="divider-rune">&#9670;</span></div>
        </div>
        <div class="loading-progress-wrap">
            <div class="loading-progress-track">
                <div id="loading-progress" class="loading-progress-fill"></div>
            </div>
        </div>
        <div class="loading-text" style="display:none"></div>
        <div class="loading-tip-area">
            <div id="loading-tip" class="loading-tip" role="status" aria-live="polite">Abrindo a mochila...</div>
        </div>
    </div>

    

    <div class="header">
        <h1><svg class="vi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="8" width="12" height="13" rx="2" />
                <path d="M9 8V5a3 3 0 0 1 6 0v3" />
                <path d="M6 13h12" />
                <rect x="9" y="15" width="6" height="3" rx="1" />
            </svg> MOCHILA</h1>
        <div class="header-stats" id="headerStats"></div>
    </div>
    <div class="tabs" id="tabsBar"></div>
    <div class="content" id="mainContent"></div>
    <div class="selection-bar hidden" id="selectionBar"></div>
    <!-- Immersive mode toggle (above bottom panel) -->
    <button id="immersive-toggle" class="immersive-toggle" style="display:none"
        aria-label="Recolher menu">&middot;</button>

    <div class="bottom-panel" id="bottomPanel">
        <div class="ops-section hidden" id="opsSection">
            <div class="ops-count" id="opsCount"></div>
            <button class="confirm-btn hidden" id="confirmBtn" onclick="showConfirmModal()">
                Confirmar Alterações
            </button>
        </div>
        <div class="nav-footer">
            <button class="nav-btn" onclick="navBack()">↩ Voltar</button>
            <button class="nav-btn" onclick="navCharSheet()">📜 Ficha</button>
            <button class="nav-btn" onclick="navMenu()">🏘️ Cidade</button>
        </div>
    </div>

    <!-- Immersive mode restore pill -->
    <button id="immersive-restore" class="immersive-restore" style="display:none">&middot; Menu</button>

    <!-- vPopup Overlay (shared popup system) -->
    <div id="v-popup-overlay" class="v-popup-overlay" style="display:none">
        <div class="v-popup-card">
            <div class="v-popup-header" id="v-popup-header"></div>
            <div class="v-popup-body" id="v-popup-body"></div>
            <div class="v-popup-actions" id="v-popup-actions"></div>
        </div>
    </div>

    <script>
        var v = Date.now();
        document.write('<script src="../shared/fetch-utils.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/text-timing.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/api-discovery.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/error-reporter.js?v=' + v + '"><\/script>');
        document.write('<script src="inventory.js?v=' + v + '"><\/script>');
        document.write('<script src="inventory-tabs.js?v=' + v + '"><\/script>');
        document.write('<script src="inventory-details.js?v=' + v + '"><\/script>');
        document.write('<script src="inventory-actions.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/image-popup.js?v=' + v + '"><\/script>');
    </script>
<script>if(typeof ValdoriaErrors!=="undefined")ValdoriaErrors.init("INVENTORY")</script>
</body>

</html>
