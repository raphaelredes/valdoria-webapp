<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a2420">
    <link rel="preload" href="../shared/fonts/medievalsharp.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../shared/fonts.css">
    <title>Mochila - Lendas de Valdoria</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        var v = Date.now();
        document.write('<link rel="stylesheet" href="../valdoria-design.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/animations.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/loading.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="inventory.css?v=' + v + '">');
    </script>
    <script src="../shared/font-apply.js"></script>
    <script src="../shared/bounce-back.js"></script>
    <script src="../shared/haptic.js"></script>
    <script src="../shared/loading-guard.js"></script>
    <script src="../shared/audio-manager.js"></script>
</head>

<body>
    <!-- Loading overlay (backpack opening) -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="backpack-anim">
            <div class="bp-glow"></div>
            <svg class="bp-icon" viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Strap -->
                <path d="M35 10 Q35 2 50 2 Q65 2 65 10" stroke="rgba(196,149,58,0.5)" stroke-width="2" fill="none"/>
                <!-- Backpack body -->
                <rect x="20" y="25" width="60" height="70" rx="8" fill="rgba(80,50,25,0.6)" stroke="rgba(196,149,58,0.4)" stroke-width="1.5"/>
                <!-- Flap (opens) -->
                <path class="bp-flap" d="M20 40 Q20 25 50 20 Q80 25 80 40" fill="rgba(100,60,30,0.7)" stroke="rgba(196,149,58,0.5)" stroke-width="1.5"/>
                <!-- Buckle -->
                <rect x="44" y="42" width="12" height="8" rx="2" fill="rgba(196,149,58,0.3)" stroke="rgba(196,149,58,0.5)" stroke-width="1"/>
                <!-- Pocket -->
                <rect x="32" y="60" width="36" height="20" rx="4" fill="rgba(60,40,20,0.5)" stroke="rgba(196,149,58,0.2)" stroke-width="1"/>
                <!-- Golden sparkles (appear when opening) -->
                <circle class="bp-sparkle s1" cx="40" cy="30" r="2" fill="rgba(196,149,58,0.8)"/>
                <circle class="bp-sparkle s2" cx="60" cy="28" r="1.5" fill="rgba(196,149,58,0.6)"/>
                <circle class="bp-sparkle s3" cx="50" cy="22" r="2.5" fill="rgba(196,149,58,0.7)"/>
                <circle class="bp-sparkle s4" cx="35" cy="25" r="1" fill="rgba(255,220,120,0.8)"/>
                <circle class="bp-sparkle s5" cx="65" cy="24" r="1.5" fill="rgba(255,220,120,0.6)"/>
            </svg>
        </div>
        <div class="loading-brand">
            <div class="loading-title">MOCHILA</div>
            <div class="loading-divider"><span class="divider-rune">&#9670;</span></div>
        </div>
        <div class="loading-progress-wrap">
            <div class="loading-progress-track">
                <div id="loading-progress" class="loading-progress-fill"></div>
            </div>
        </div>
        <div class="loading-text" style="display:none"></div>
        <div class="loading-tip-area">
            <div id="loading-tip" class="loading-tip">Abrindo a mochila...</div>
        </div>
    </div>

    <!-- Loading controller (narrative tips + min load) -->
    <script>
    (function() {
        var TIPS = [
            'Você desamarra as fivelas da mochila de couro surrado...',
            'O cheiro de ervas secas e metal se mistura ao abrir o alforje...',
            'Seus dedos percorrem os compartimentos, catalogando seus pertences...',
            'Frascos tilintam contra lâminas enquanto você organiza seus itens...',
            'A luz da tocha revela o brilho de uma gema esquecida no fundo...',
            'Cordas, tochas e rações — tudo que um aventureiro precisa...',
            'Cada item carrega uma história das aventuras que você viveu...',
            'O couro da mochila range enquanto você vasculha seus pertences...',
        ];
        var tipEl = document.getElementById('loading-tip');
        var progressEl = document.getElementById('loading-progress');
        var overlay = document.getElementById('loadingOverlay');
        var tipIndex = Math.floor(Math.random() * TIPS.length);
        if (tipEl) tipEl.textContent = TIPS[tipIndex];
        var _tipInterval;
        var _loadStart = Date.now();
        var MIN_LOAD_MS = Math.round(2500 * (window._valdoriaMinLoadFactor || 1));
        var _progress = 0;

        // Simulated progress
        var _progressTimer = setInterval(function() {
            _progress += (90 - _progress) * 0.08;
            if (progressEl) progressEl.style.width = _progress + '%';
        }, 200);

        // Rotate tips every 5s with crossfade
        _tipInterval = setInterval(function() {
            tipIndex = (tipIndex + 1) % TIPS.length;
            if (tipEl) {
                tipEl.classList.add('tip-exit');
                setTimeout(function() {
                    tipEl.textContent = TIPS[tipIndex];
                    tipEl.classList.remove('tip-exit');
                    tipEl.classList.add('tip-enter');
                    setTimeout(function() { tipEl.classList.remove('tip-enter'); }, 350);
                }, 300);
            }
        }, 5000);

        // Watchdog: force-hide loading after 8s to prevent stuck overlays
    setTimeout(function() {
        if (overlay && !overlay.classList.contains('hidden')) {
            console.warn('[INVENTORY] Loading watchdog triggered after 8s');
            clearInterval(_tipInterval);
            clearInterval(_progressTimer);
            overlay.classList.add('hidden');
        }
    }, 8000);

    window._invLoadingCtrl = {
            hide: function() {
                clearInterval(_tipInterval);
                clearInterval(_progressTimer);
                if (!overlay || overlay.classList.contains('hidden')) return;
                var elapsed = Date.now() - _loadStart;
                var remaining = MIN_LOAD_MS - elapsed;
                if (remaining > 0) {
                    setTimeout(function() { window._invLoadingCtrl.hide(); }, remaining);
                    return;
                }
                // Fill to 100% + completion pulse + cinematic exit
                if (progressEl) progressEl.style.width = '100%';
                // Trigger completion pulse waves
                var waves = overlay.querySelectorAll('.mc-completion-wave');
                waves.forEach(function(w) { w.classList.add('active'); });
                try {
                    if (window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback) {
                        Telegram.WebApp.HapticFeedback.impactOccurred('heavy');
                    }
                } catch(_) {}
                setTimeout(function() {
                    overlay.classList.add('exit-cinematic');
                    setTimeout(function() {
                        overlay.classList.add('hidden');
                    }, 950);
                }, 150);
            }
        };
    })();
    </script>

    <div class="header">
        <h1><svg class="vi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="8" width="12" height="13" rx="2" />
                <path d="M9 8V5a3 3 0 0 1 6 0v3" />
                <path d="M6 13h12" />
                <rect x="9" y="15" width="6" height="3" rx="1" />
            </svg> MOCHILA</h1>
        <div class="header-stats" id="headerStats"></div>
    </div>
    <div class="tabs" id="tabsBar"></div>
    <div class="content" id="mainContent"></div>
    <div class="selection-bar hidden" id="selectionBar"></div>
    <div class="bottom-panel" id="bottomPanel">
        <div class="ops-section hidden" id="opsSection">
            <div class="ops-count" id="opsCount"></div>
            <button class="confirm-btn hidden" id="confirmBtn" onclick="showConfirmModal()">
                Confirmar Alterações
            </button>
        </div>
        <div class="nav-footer">
            <button class="nav-btn" onclick="navBack()">↩ Voltar</button>
            <button class="nav-btn" onclick="navCharSheet()">📜 Ficha</button>
            <button class="nav-btn" onclick="navMenu()">🏘️ Cidade</button>
        </div>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
        <div class="modal" id="modalContent"></div>
    </div>

    <script>
        var v = Date.now();
        document.write('<script src="../shared/fetch-utils.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/text-timing.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/api-discovery.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/error-reporter.js?v=' + v + '"><\/script>');
        document.write('<script src="inventory.js?v=' + v + '"><\/script>');
    </script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('../sw.js').catch(()=>{})}</script>
</body>

</html>
