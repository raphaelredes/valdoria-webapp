<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://telegra.ph https://i.ibb.co; media-src 'self'; connect-src 'self' https: wss:; frame-src 'none'; object-src 'none'; base-uri 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a2420">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>html{background:#2a2420}</style>
    <link rel="preload" href="../shared/fonts/medievalsharp.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../shared/fonts.css">
    <title>Guilda - Lendas de Valdoria</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="../shared/telegram-compat.js"></script>
    <script>
        var v = Date.now();
        document.write('<link rel="stylesheet" href="../valdoria-design.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/status-bars.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/toast.css?v=' + v + '">');
document.write('<link rel="stylesheet" href="../shared/tabs.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/animations.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/loading.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/drawer.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="guild.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/image-popup.css?v=' + v + '">');
    </script>
    <script>
    document.write('<script src="../shared/escape.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/font-apply.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/bounce-back.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/haptic.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/action-guard.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/webapp-init.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/session-heartbeat.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/exit-confirm.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/loading-template.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/loading-guard.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/loading-controller.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/toast.js?v=' + v + '"><\/script>');
document.write('<script src="../shared/status-bars.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/popup.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/audio-manager.js?v=' + v + '"><\/script>');
    </script>
</head>

<body>

    <!-- Loading overlay (backpack icon via shared template) -->
    <script>
    document.write(ValdoriaLoadingHTML({
        overlayId: 'loadingOverlay',
        title: 'GUILDA',
        icon: 'backpack',
        defaultTip: 'Abrindo o registro da guilda...'
    }));
    </script>

    <!-- Loading controller -->
    <script>
    document.write('<script src="guild-loading.js?v=' + v + '"><\/script>');
    </script>

    <div class="guild-header">
        <h1 class="guild-title">GUILDA DE AVENTUREIROS</h1>
        <div class="guild-ornament">&#x2E31; &#x2726; &#x2E31;</div>
        <div id="guild-player-info" class="guild-player-info"></div>
    </div>

    <div class="guild-tabs v-tabs">
        <button class="v-tab active" data-tab="salao">&#x1F3DB;&#xFE0F; Grupo</button>
        <button class="v-tab" data-tab="recrutar">&#x1F4DC; Recrutar</button>
        <button class="v-tab" data-tab="missoes">&#x1F4CB; Quadro</button>
        <button class="v-tab" data-tab="npcs">&#x1F9D3; NPCs</button>
        <button class="v-tab" data-tab="treinar">&#x1F4DA; Treinar</button>
    </div>

    <div id="guild-content" class="guild-content">
        <div id="tab-salao" class="v-tab-panel active">
            <div id="guild-party-list"></div>
        </div>
        <div id="tab-recrutar" class="v-tab-panel" style="display:none">
            <div id="guild-recruit-filters"></div>
            <div id="guild-recruit-list"></div>
            <div id="guild-recruit-pagination"></div>
        </div>
        <div id="tab-missoes" class="v-tab-panel" style="display:none">
            <div id="guild-quest-board"></div>
            <div id="guild-bounties"></div>
        </div>
        <div id="tab-npcs" class="v-tab-panel" style="display:none">
            <div id="guild-npc-list"></div>
        </div>
        <div id="tab-treinar" class="v-tab-panel" style="display:none">
            <div id="guild-training"></div>
        </div>
    </div>

    <div id="guild-detail-overlay" class="guild-detail-overlay sub-screen">
        <div id="guild-detail-content" class="guild-detail-content"></div>
        <button class="guild-detail-close" id="guildDetailClose">&#x2190; Voltar</button>
    </div>

    <button id="immersive-toggle" class="immersive-toggle" style="display:none"
        aria-label="Recolher menu">&middot;</button>
    <div id="bottom-panel" class="bottom-panel" style="display:none">
        <div id="guild-actions" class="guild-actions"></div>
        <div class="nav-footer">
            <button class="nav-btn" onclick="guildNavBack()">&#x21A9; Voltar</button>
            <button class="nav-btn" onclick="guildNavSheet()">&#x1F4DC; Ficha</button>
            <button class="nav-btn" onclick="guildNavCity()">&#x1F3D8;&#xFE0F; Cidade</button>
        </div>
    </div>
    <button id="immersive-restore" class="immersive-restore" style="display:none">&middot; Menu</button>

    <script>
        var v = Date.now();
        document.write('<script src="../shared/fetch-utils.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/text-timing.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/api-discovery.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/device-id.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/error-reporter.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/drawer.js?v=' + v + '"><\/script>');
        document.write('<script src="guild-core.js?v=' + v + '"><\/script>');
        document.write('<script src="guild-party.js?v=' + v + '"><\/script>');
        document.write('<script src="guild-recruit.js?v=' + v + '"><\/script>');
        document.write('<script src="guild-quests.js?v=' + v + '"><\/script>');
        document.write('<script src="guild-npcs.js?v=' + v + '"><\/script>');
        document.write('<script src="guild-training.js?v=' + v + '"><\/script>');
    </script>
<script>if(typeof ValdoriaErrors!=="undefined")ValdoriaErrors.init("GUILD")</script>
</body>

</html>
