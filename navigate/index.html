<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://telegra.ph https://i.ibb.co; media-src 'self'; connect-src 'self' https: wss:; frame-src 'none'; object-src 'none'; base-uri 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a2420">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>html{background:#2a2420}</style>
    <title>Mapa do Mundo - Lendas de Valdoria</title>
    <link rel="preload" href="../shared/fonts/medievalsharp.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../shared/fonts/cinzel.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../shared/fonts.css">
    <!-- map bg: src set by JS to support SPA + standalone -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="../shared/telegram-compat.js"></script>
    <script>
        var v = Date.now();
        document.write('<link rel="stylesheet" href="../valdoria-design.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/animations.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/loading.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/popup.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/toast.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="navigate.css?v=' + v + '">');
    </script>
    <script>
    document.write('<script src="../shared/audio-manager.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/loading-guard.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/loading-template.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/loading-controller.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/motion.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/popup.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/toast.js?v=' + v + '"><\/script>');
    </script>
    <script>
    document.write('<script src="../shared/font-apply.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/bounce-back.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/haptic.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/webapp-init.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/exit-confirm.js?v=' + v + '"><\/script>');
    </script>
</head>

<body>
    <!-- Dark placeholder — SVG content injected AFTER all CSS loads (prevents flash in Telegram WebView) -->
    <div id="loading" class="loading-overlay" style="background:#1a1510" aria-busy="true"></div>

    <!-- HUD -->
    <div id="hud">
        <span class="hud-name" id="hud-name">Aventureiro</span>
        <span class="hud-level" id="hud-level">Nv.1</span>
        <span class="hud-gold" id="hud-gold" style="display:none"></span>
        <span class="hud-weather" id="hud-weather" style="display:none"></span>
    </div>

    <!-- Map Viewport -->
    <div id="map-viewport" role="application" aria-label="Mapa mundo de Valdoria">
        <div id="map-wrapper">
            <img id="map-bg" draggable="false"
                 width="733" height="720"
                 style="position:absolute;top:0;left:0;pointer-events:none;image-rendering:auto"
                 alt="">
            <canvas id="fog-canvas" width="733" height="720"
                    style="position:absolute;top:0;left:0;pointer-events:none"></canvas>
            <canvas id="map-canvas" width="733" height="720"
                    style="position:absolute;top:0;left:0;pointer-events:auto"></canvas>
            <svg id="map-svg" xmlns="http://www.w3.org/2000/svg"
                 style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none;opacity:0"></svg>
        </div>
        <!-- Compass overlay (fixed above map, not affected by pan/zoom) -->
        <div id="compass-overlay">
            <svg id="compass-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90"></svg>
        </div>
        <!-- Zoom controls -->
        <div id="zoom-controls">
            <button type="button" class="zoom-btn" id="btn-zoom-in" aria-label="Aproximar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="11" y1="8" x2="11" y2="14"/></svg></button>
            <button type="button" class="zoom-btn" id="btn-zoom-out" aria-label="Afastar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
        </div>
        <div id="offscreen-indicator"><span class="osi-arrow"></span><br><span class="osi-label"></span></div>
        <div id="map-tooltip"><span class="tt-name"></span><span class="tt-dist"></span></div>
    </div>

    <!-- Location Info Panel -->
    <div id="info-panel" role="dialog" aria-label="Detalhes do local">
        <div class="info-header-top">
            <span class="info-icon" id="info-icon"></span>
            <span class="info-title" id="info-title"></span>
            <button type="button" class="info-close" id="info-close" onclick="closeInfoPanel()" aria-label="Fechar">✕</button>
        </div>
        <div class="info-header-meta" id="info-header-meta">
            <span class="info-danger" id="info-danger"></span>
        </div>
        <div class="info-content-scroll">
            <div class="info-status-bars" id="info-status-bars" style="display:none"></div>
            <div class="info-divider" id="info-divider-status" style="display:none"></div>
            <div class="info-biome" id="info-biome"></div>
            <div class="info-weather" id="info-weather" style="display:none"></div>
            <div class="info-desc" id="info-desc"></div>
            <div class="info-tags" id="info-stats"></div>
            <div class="info-divider" id="info-divider-quests" style="display:none"></div>
            <div class="info-section-header" id="info-quests-header" style="display:none">Missões</div>
            <div class="info-quests" id="info-quests"></div>
            <div class="info-section-header" id="info-dungeons-header" style="display:none">Masmorras</div>
            <div class="info-dungeons" id="info-dungeons"></div>
            <div class="info-note" id="info-note"></div>
        </div>
        <div class="info-actions" id="info-actions"></div>
    </div>

    <!-- Quick-List Overlay -->
    <div id="quick-list">
        <div class="ql-header">
            <span class="ql-title">📍 Locais Conhecidos</span>
            <button type="button" class="ql-close" onclick="closeQuickList()">✕</button>
        </div>
        <div id="ql-items"></div>
    </div>

    <!-- Gesture Tutorial -->
    <div id="gesture-tutorial">
        <div class="gt-hint"><span class="gt-icon">👆</span>Tocar para info<br><span class="gt-text">Toque em um local para ver detalhes e viajar</span></div>
        <div class="gt-hint"><span class="gt-icon">🤏</span>Pinçar para zoom<br><span class="gt-text">Use dois dedos para aproximar ou afastar</span></div>
        <div class="gt-dismiss">Toque em qualquer lugar para continuar</div>
    </div>

    <!-- Immersive toggle -->
    <button id="immersive-toggle" class="immersive-toggle" style="display:none"
        aria-label="Recolher menu">&middot;</button>

    <!-- Bottom Bar -->
    <div id="bottom-panel" class="bottom-panel" style="display:none">
        <button type="button" class="bar-btn bar-btn-return" id="btn-return" onclick="handleReturn()">
            🏰 Retornar
        </button>
        <button type="button" class="bar-btn" id="btn-locations" onclick="openQuickList()">
            📍 Locais
        </button>
        <button type="button" class="bar-btn" id="btn-close" onclick="handleClose()">
            🗺️ Fechar
        </button>
    </div>

    <!-- Immersive restore pill -->
    <button id="immersive-restore" aria-label="Expandir menu" class="immersive-restore" style="display:none">&middot; Menu</button>

    <!-- Shared Popup Overlay -->
    <div id="v-popup-overlay" class="v-popup-overlay" style="display:none"><div class="v-popup-card"><div class="v-popup-header"></div><div class="v-popup-body"></div><div class="v-popup-actions"></div></div></div>

    <script>
        var v = Date.now();
        document.write('<script src="../shared/escape.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/fetch-utils.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/text-timing.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/api-discovery.js?v=' + v + '"><\/script>');
        document.write('<link rel="stylesheet" href="../shared/connection-overlay.css?v=' + v + '">');
        document.write('<script src="../shared/connection-overlay.js?v=' + v + '"><\/script>');
        document.write('<link rel="stylesheet" href="../shared/processing-overlay.css?v=' + v + '">');
        document.write('<script src="../shared/processing-overlay.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/console-collector.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/error-reporter.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/device-id.js?v=' + v + '"><\/script>');
        document.write('<script src="../shared/session-heartbeat.js?v=' + v + '"><\/script>');
        var scripts = ['navigate-loading.js', 'map-layout.js', 'navigate-core.js', 'navigate-map.js', 'navigate-map-terrain.js', 'navigate-map-decor.js', 'navigate-canvas-renderer.js', 'navigate-canvas-icons.js', 'navigate-ambient.js', 'navigate-ui.js'];
        scripts.forEach(function (s) { document.write('<script src="' + s + '?v=' + v + '"><\/script>'); });
    </script>
    <script>
        // Populate loading overlay now that all CSS+JS are parsed (prevents SVG flash in Telegram WebView)
        var _ld = document.getElementById('loading');
        if (_ld && typeof ValdoriaLoadingHTML === 'function') {
            var _tmp = document.createElement('div');
            _tmp.innerHTML = ValdoriaLoadingHTML({
                overlayId: 'loading',
                particleSet: 'full',
                defaultTip: 'Desenrolando o mapa...'
            });
            var _overlay = _tmp.firstElementChild;
            _overlay.style.background = '#1a1510';
            _ld.parentNode.replaceChild(_overlay, _ld);
        }
    </script>
    <script>
        // ── Idle detection: pause ALL decorative animations after 10s ──
        (function() {
            var _idleTimer = null;
            var IDLE_MS = 10000;
            function _resetIdle() {
                document.body.classList.remove('map-idle');
                clearTimeout(_idleTimer);
                _idleTimer = setTimeout(function() {
                    document.body.classList.add('map-idle');
                }, IDLE_MS);
            }
            ['pointerdown', 'pointermove', 'wheel', 'keydown'].forEach(function(evt) {
                document.addEventListener(evt, _resetIdle, { passive: true });
            });
            _resetIdle();
        })();
    </script>
</body>

</html>
