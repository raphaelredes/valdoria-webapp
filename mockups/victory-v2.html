<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#2a2420"><title>V2 — Escudo Heráldico</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=MedievalSharp&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{max-width:430px;height:100dvh;margin:0 auto;overflow:hidden;background:#1a1510}
body{height:100%;font-family:'MedievalSharp','Cinzel',serif;color:#d4c8b0;background:#2a2420;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0;text-align:center}
/* V2: Banner heráldico full-width no topo */
.banner{width:100%;padding:40px 20px 24px;background:linear-gradient(180deg,rgba(196,149,58,0.2) 0%,rgba(196,149,58,0.05) 60%,transparent 100%);position:relative}
.banner::after{content:'';position:absolute;bottom:0;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,rgba(196,149,58,0.5),transparent)}
.trophy{font-size:56px;filter:drop-shadow(0 4px 20px rgba(196,149,58,0.5));margin-bottom:12px}
.title{font-family:'Cinzel',serif;font-size:32px;font-weight:900;letter-spacing:6px;text-transform:uppercase;color:#f5d478;text-shadow:0 0 30px rgba(196,149,58,0.4),0 2px 4px rgba(0,0,0,0.5);margin-bottom:6px}
.enemy{font-size:15px;color:#d4c8b0;font-weight:600;letter-spacing:1px}
.enemy span{color:#a09484;font-weight:400;font-style:italic}
.content{flex:1;width:100%;padding:24px 20px;display:flex;flex-direction:column;gap:16px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:0.15em;color:#8a7a68;font-weight:700;text-align:left;margin-bottom:-4px}
.rewards{display:flex;gap:10px;width:100%}
.reward-card{flex:1;padding:16px 12px;background:#332a22;border:1px solid #4a3828;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.reward-card-icon{font-size:28px}
.reward-card-value{font-size:16px;font-weight:700;color:#f5d478}
.reward-card-label{font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:#8a7a68}
.actions{margin-top:auto;padding:0 0 24px;width:100%;display:flex;flex-direction:column;gap:8px}
.btn{width:100%;padding:16px;font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:#1a1510;background:linear-gradient(180deg,#d4a84a 0%,#a07828 100%);border:none;border-radius:10px;cursor:pointer;letter-spacing:1px;box-shadow:0 4px 20px rgba(196,149,58,0.35),inset 0 1px 0 rgba(255,255,255,0.15)}
.btn:active{transform:scale(0.98)}
.btn-ghost{background:none;color:#a09484;border:1px solid #4a3828;box-shadow:none;font-size:13px;padding:12px}
</style></head><body>
<div class="banner">
  <div class="trophy">🏆</div>
  <div class="title">Vitoria</div>
  <div class="enemy">Cocatrice <span>derrotado</span></div>
</div>
<div class="content">
  <div class="section-title">Recompensas</div>
  <div class="rewards">
    <div class="reward-card">
      <span class="reward-card-icon">✨</span>
      <span class="reward-card-value">+100 XP</span>
      <span class="reward-card-label">Experiencia</span>
    </div>
    <div class="reward-card">
      <span class="reward-card-icon">🎁</span>
      <span class="reward-card-value">Cristal Bruto</span>
      <span class="reward-card-label">Item</span>
    </div>
  </div>
  <div class="actions">
    <button class="btn">⛰️ Continuar aventura</button>
    <button class="btn btn-ghost">📜 Log de Batalha</button>
  </div>
</div>
</body></html>
