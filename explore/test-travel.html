<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Animation Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #1a1520; overflow: hidden; }
        #travel-overlay { position: fixed; inset: 0; z-index: 500; display: none; background: #1a1520; }
        #travel-overlay.active { display: block; }
        #travel-canvas { width: 100%; height: 100%; display: block; }
        .v-skip-btn {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(196,149,58,0.2); color: #c4953a; border: 1px solid rgba(196,149,58,0.3);
            padding: 10px 30px; border-radius: 8px; font: 14px 'Cinzel', serif; cursor: pointer;
            z-index: 501; display: none;
        }
        .v-skip-btn.visible { display: block; }
        #controls {
            position: fixed; bottom: 10px; left: 10px; z-index: 9999;
            display: flex; gap: 6px; flex-wrap: wrap; max-width: 380px;
        }
        #controls button {
            background: rgba(196,149,58,0.3); color: #c4953a; border: 1px solid rgba(196,149,58,0.4);
            padding: 6px 10px; border-radius: 4px; font-size: 11px; cursor: pointer;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=MedievalSharp&display=swap" rel="stylesheet">
</head>
<body>
    <div id="travel-overlay">
        <canvas id="travel-canvas"></canvas>
        <button class="v-skip-btn" id="travel-skip-btn">Pular >></button>
    </div>
    <div id="controls">
        <button onclick="test('forest','Floresta Sombria')">Forest</button>
        <button onclick="test('graveyard','Cemitério Abandonado')">Graveyard</button>
        <button onclick="test('volcanic','Terras Vulcânicas')">Volcanic</button>
        <button onclick="test('dungeon_cave','Caverna Profunda')">Dungeon</button>
        <button onclick="test('snow','Picos Gelados')">Snow</button>
        <button onclick="test('desert','Deserto Escaldante')">Desert</button>
        <button onclick="test('mountain','Serra Cinzenta')">Mountain</button>
        <button onclick="test('swamp','Pântano Nebuloso')">Swamp</button>
    </div>
    <script src="explore-travel.js"></script>
    <script>
        function test(biome, name) {
            playTravelAnimation(biome, name, () => { console.log('Done:', biome); });
        }
        test('graveyard', 'Cemitério Abandonado');
    </script>
</body>
</html>
