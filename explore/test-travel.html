<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Test</title>
    <style>
        body { margin: 0; background: #000; }
        #travel-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 500; display: none; }
        #travel-overlay.active { display: block; }
        #travel-canvas { width: 100%; height: 100%; }
        .btn-row { position: fixed; bottom: 10px; left: 0; right: 0; z-index: 9999; text-align: center; }
        .btn-row button { margin: 2px; padding: 8px 12px; font-size: 12px; background: #333; color: #fff; border: 1px solid #555; cursor: pointer; }
    </style>
</head>
<body>
    <div id="travel-overlay">
        <canvas id="travel-canvas"></canvas>
        <button id="travel-skip-btn" style="position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:501;padding:8px 24px;background:rgba(0,0,0,0.5);color:#d4c8b0;border:1px solid #4a3828;cursor:pointer;display:none" class="">Pular ▸</button>
    </div>
    <div class="btn-row" id="buttons">
        <button onclick="go('swamp')">Swamp (fireflies)</button>
        <button onclick="go('graveyard')">Graveyard (lightning+bats)</button>
        <button onclick="go('desert')">Desert (shimmer)</button>
        <button onclick="go('snow')">Snow (aurora)</button>
        <button onclick="go('volcanic')">Volcanic (lava)</button>
        <button onclick="go('forest')">Forest (birds)</button>
    </div>
    <script src="explore-travel.js"></script>
    <script>
        function go(biome) {
            document.getElementById('buttons').style.display = 'none';
            playTravelAnimation(biome, 'Região de Teste', () => {
                document.getElementById('buttons').style.display = '';
            });
        }
        // Auto-play from URL param
        const p = new URLSearchParams(location.search);
        if (p.get('biome')) {
            setTimeout(() => go(p.get('biome')), 100);
        }
    </script>
</body>
</html>
