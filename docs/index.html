<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a2420">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Lendas de Valdoria — Documentação</title>
    <link rel="preload" href="../shared/fonts/medievalsharp.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../shared/fonts.css">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <style>
        :root {
            --v-bg: #2a2420;
            --v-bg-raised: #332a22;
            --v-bg-card: #2e2520;
            --v-bg-card-hover: #3a3028;
            --v-gold: #c4953a;
            --v-gold-dim: #9a7530;
            --v-gold-light: #dbb668;
            --v-text: #d4c8b0;
            --v-text-dim: #a09484;
            --v-text-bright: #e8dcc8;
            --v-border: #4a3828;
            --v-font: 'MedievalSharp', 'Cinzel', serif;
            --v-font-display: 'Cinzel', serif;
            --v-font-mono: 'Courier New', monospace;
            --sidebar-w: 320px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: var(--v-bg);
            color: var(--v-text);
            font-family: var(--v-font);
            font-size: 15px;
            line-height: 1.7;
        }
        @media (min-width: 1024px) {
            html, body { font-size: 16px; }
        }
        .app { display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR */
        .sidebar {
            width: var(--sidebar-w); min-width: var(--sidebar-w);
            background: var(--v-bg-raised);
            border-right: 1px solid var(--v-border);
            display: flex; flex-direction: column;
            overflow: hidden; transition: transform var(--v-transition-base); z-index: var(--v-z-header, 100);
        }
        .sidebar-header {
            padding: 20px 16px 12px;
            border-bottom: 1px solid var(--v-border);
            flex-shrink: 0;
        }
        .sidebar-header h1 {
            font-family: var(--v-font-display);
            color: var(--v-gold); font-size: 18px; letter-spacing: 1px; margin-bottom: 4px;
        }
        .sidebar-header .subtitle { font-size: 12px; color: var(--v-text-dim); }
        .search-box {
            padding: 10px 16px; border-bottom: 1px solid var(--v-border); flex-shrink: 0;
        }
        .search-box input {
            width: 100%; padding: 8px 12px;
            background: var(--v-bg); border: 1px solid var(--v-border);
            border-radius: var(--v-radius-sm); color: var(--v-text);
            font-family: var(--v-font); font-size: 13px; outline: none;
            transition: border-color var(--v-transition);
        }
        .search-box input:focus { border-color: var(--v-gold-dim); }
        .search-box input::placeholder { color: var(--v-text-dim); }
        .nav-list { flex: 1; overflow-y: auto; padding: 8px 0; }
        .nav-list::-webkit-scrollbar { width: 4px; }
        .nav-list::-webkit-scrollbar-track { background: transparent; }
        .nav-list::-webkit-scrollbar-thumb { background: var(--v-border); border-radius: var(--v-radius-sm); }
        .nav-category {
            padding: 12px 16px 6px;
            font-family: var(--v-font-display); font-size: 11px;
            text-transform: uppercase; letter-spacing: 2px; color: var(--v-gold-dim);
            cursor: pointer; user-select: none; display: flex; align-items: center; gap: 6px;
        }
        .nav-category:hover { color: var(--v-gold); }
        .nav-category .arrow { font-size: 9px; transition: transform var(--v-transition); }
        .nav-category.collapsed .arrow { transform: rotate(-90deg); }
        .nav-category-items { overflow: hidden; transition: max-height var(--v-transition-base); }
        .nav-category.collapsed + .nav-category-items { max-height: 0 !important; }
        .nav-item {
            display: block; padding: 7px 16px 7px 24px;
            color: var(--v-text-dim); text-decoration: none; font-size: 13px;
            cursor: pointer; transition: all var(--v-transition-fast);
            border-left: 3px solid transparent; line-height: 1.4;
        }
        .nav-item:hover { background: var(--v-bg-card-hover); color: var(--v-text); }
        .nav-item.active {
            background: var(--v-bg-card); color: var(--v-gold-light);
            border-left-color: var(--v-gold);
        }

        /* MAIN — flex container for content + toc */
        .main { flex: 1; overflow: hidden; padding: 0; display: flex; }
        .main::-webkit-scrollbar { width: 6px; }
        .main::-webkit-scrollbar-track { background: var(--v-bg); }
        .main::-webkit-scrollbar-thumb { background: var(--v-border); border-radius: var(--v-radius-sm); }
        .main-scroll { flex: 1; overflow-y: auto; }
        .main-scroll::-webkit-scrollbar { width: 6px; }
        .main-scroll::-webkit-scrollbar-track { background: var(--v-bg); }
        .main-scroll::-webkit-scrollbar-thumb { background: var(--v-border); border-radius: var(--v-radius-sm); }
        .content { max-width: 1100px; margin: 0 auto; padding: 32px 48px 80px; }

        /* WELCOME */
        .welcome { text-align: center; padding: 80px 20px; }
        .welcome h2 {
            font-family: var(--v-font-display); color: var(--v-gold);
            font-size: 34px; margin-bottom: 16px;
        }
        .welcome p { color: var(--v-text-dim); font-size: 15px; margin-bottom: 32px; }
        .welcome .stats { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
        .stat-card {
            background: var(--v-bg-card); border: 1px solid var(--v-border);
            border-radius: var(--v-radius); padding: 24px 36px; text-align: center; min-width: 160px;
        }
        .stat-card .number { font-family: var(--v-font-display); font-size: 40px; color: var(--v-gold); }
        .stat-card .label { font-size: 12px; color: var(--v-text-dim); margin-top: 4px; }

        /* MARKDOWN */
        .md-content h1 {
            font-family: var(--v-font-display); color: var(--v-gold);
            font-size: 30px; margin-bottom: 8px; padding-bottom: 10px;
            border-bottom: 2px solid var(--v-border);
        }
        .md-content h2 {
            font-family: var(--v-font-display); color: var(--v-gold-light);
            font-size: 22px; margin-top: 32px; margin-bottom: 12px;
            padding-bottom: 6px; border-bottom: 1px solid rgba(74, 56, 40, 0.5);
        }
        .md-content h3 { color: var(--v-text-bright); font-size: 18px; margin-top: 24px; margin-bottom: 8px; }
        .md-content h4 { color: var(--v-text); font-size: 14px; margin-top: 20px; margin-bottom: 6px; }
        .md-content p { margin-bottom: 12px; }
        .md-content a { color: var(--v-gold); text-decoration: none; }
        .md-content a:hover { color: var(--v-gold-light); text-decoration: underline; }
        .md-content strong { color: var(--v-text-bright); }
        .md-content em { color: var(--v-text-dim); font-style: italic; }
        .md-content ul, .md-content ol { padding-left: 24px; margin-bottom: 12px; }
        .md-content li { margin-bottom: 4px; }
        .md-content li::marker { color: var(--v-gold-dim); }
        .md-content blockquote {
            border-left: 3px solid var(--v-gold-dim); padding: 8px 16px;
            margin: 12px 0; background: rgba(196, 149, 58, 0.05);
            border-radius: 0 6px 6px 0; color: var(--v-text-dim);
        }
        .md-content hr { border: none; border-top: 1px solid var(--v-border); margin: 24px 0; }
        .md-content code {
            font-family: var(--v-font-mono); background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px; border-radius: var(--v-radius-sm); font-size: 13px; color: var(--v-gold-light);
        }
        .md-content pre {
            background: #1a1612; border: 1px solid var(--v-border);
            border-radius: var(--v-radius-sm); padding: 16px; overflow-x: auto; margin: 12px 0;
        }
        .md-content pre code {
            background: none; padding: 0; font-size: 13px; line-height: 1.5; color: var(--v-text);
        }
        .md-content table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
        .md-content thead th {
            background: var(--v-bg-raised); color: var(--v-gold);
            font-family: var(--v-font-display); font-size: 12px;
            text-transform: uppercase; letter-spacing: 0.5px;
            padding: 10px 12px; text-align: left;
            border-bottom: 2px solid var(--v-border);
            position: sticky; top: 0;
        }
        .md-content tbody td {
            padding: 8px 12px; border-bottom: 1px solid rgba(74, 56, 40, 0.3); vertical-align: top;
        }
        .md-content tbody tr:hover { background: rgba(74, 56, 40, 0.1); }
        .md-content tbody td code { font-size: 12px; }

        /* ASCII diagrams */
        .md-content pre code {
            white-space: pre;
            word-wrap: normal;
        }

        /* TOPBAR mobile */
        .topbar {
            display: none; background: var(--v-bg-raised);
            border-bottom: 1px solid var(--v-border);
            padding: 10px 16px; align-items: center; gap: 12px;
            position: sticky; top: 0; z-index: var(--v-z-sticky, 50);
        }
        .topbar .menu-btn {
            background: none; border: 1px solid var(--v-border);
            color: var(--v-gold); font-size: 18px; padding: 4px 10px;
            border-radius: var(--v-radius-sm); cursor: pointer;
        }
        .topbar h1 { font-family: var(--v-font-display); color: var(--v-gold); font-size: 15px; flex: 1; }

        .sidebar-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.6); z-index: var(--v-z-sticky, 99);
        }

        /* TOC — right sidebar, flows in flex layout */
        .toc {
            width: 240px; min-width: 240px;
            overflow-y: auto; padding: 24px 0 24px 0;
            border-left: 1px solid var(--v-border);
            background: var(--v-bg);
            align-self: stretch;
        }
        .toc::-webkit-scrollbar { width: 3px; }
        .toc::-webkit-scrollbar-thumb { background: var(--v-border); }
        .toc-title {
            font-family: var(--v-font-display); font-size: 10px;
            text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--v-gold-dim); padding: 0 12px 8px;
        }
        .toc a {
            display: block; padding: 3px 12px; font-size: 12px;
            color: var(--v-text-dim); text-decoration: none; line-height: 1.4;
            transition: color var(--v-transition-fast); border-left: 2px solid transparent; margin-left: -1px;
        }
        .toc a:hover { color: var(--v-text); }
        .toc a.active { color: var(--v-gold); border-left-color: var(--v-gold); }
        .toc a.depth-3 { padding-left: 24px; font-size: 11px; }

        .breadcrumb { font-size: 12px; color: var(--v-text-dim); margin-bottom: 16px; }
        .breadcrumb span { color: var(--v-gold-dim); }

        .doc-meta {
            display: flex; gap: 16px; flex-wrap: wrap;
            font-size: 12px; color: var(--v-text-dim);
            margin-bottom: 20px; padding: 8px 0;
            border-bottom: 1px solid rgba(74, 56, 40, 0.3);
        }

        .back-to-top {
            position: fixed; bottom: 24px; right: 24px;
            width: 40px; height: 40px;
            background: var(--v-bg-raised); border: 1px solid var(--v-border);
            border-radius: 50%; color: var(--v-gold); font-size: 18px;
            cursor: pointer; display: none; align-items: center;
            justify-content: center; transition: opacity var(--v-transition); z-index: var(--v-z-sticky, 50);
        }
        .back-to-top.visible { display: flex; }

        /* Print styles */
        @media print {
            .sidebar, .topbar, .toc, .back-to-top, .sidebar-overlay { display: none !important; }
            .main { overflow: visible; }
            .content { max-width: 100%; padding: 20px; }
            .md-content pre { white-space: pre-wrap; }
        }

        @media (max-width: 1200px) { .toc { display: none; } }
        @media (min-width: 1600px) { .content { max-width: 1300px; } .toc { width: 260px; min-width: 260px; } }
        @media (max-width: 768px) {
            .sidebar {
                position: fixed; left: 0; top: 0; bottom: 0;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.open { display: block; }
            .topbar { display: flex; }
            .content { padding: 20px 16px 60px; }
            .main { flex-direction: column; }
            .main-scroll { flex: 1; overflow-y: auto; }
            .welcome { padding: 40px 16px; }
            .welcome h2 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>Lendas de Valdoria</h1>
                <div class="subtitle">Documentação Interna</div>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Buscar documentos... (Ctrl+K)">
            </div>
            <nav class="nav-list" id="navList"></nav>
        </aside>
        <div class="main" id="mainOuter">
            <div class="main-scroll" id="mainPanel">
            <div class="topbar">
                <button class="menu-btn" id="menuBtn">&#9776;</button>
                <h1>Documentação</h1>
            </div>
            <div class="content" id="content">
                <div class="welcome" id="welcomeScreen">
                    <h2>Documentação de Sistemas</h2>
                    <p>Selecione um documento no menu lateral para começar.</p>
                    <div class="stats" id="statsContainer"></div>
                </div>
            </div>
        </div>
            </div>
        <div class="toc" id="toc"></div>
        <button class="back-to-top" id="backToTop">&uarr;</button>
    </div>

    <script src="docs-data.js"></script>
    <script>
    (function() {
        "use strict";
        var docs = window.DOCS_DATA || [];
        var sistemas = docs.filter(function(d) { return d.category === "sistemas"; });
        var detalhados = docs.filter(function(d) { return d.category === "detalhado"; });

        marked.setOptions({ gfm: true, breaks: false });

        var navList = document.getElementById("navList");
        var content = document.getElementById("content");
        var mainPanel = document.getElementById("mainPanel");
        var searchInput = document.getElementById("searchInput");
        var sidebarEl = document.getElementById("sidebar");
        var overlayEl = document.getElementById("sidebarOverlay");
        var menuBtn = document.getElementById("menuBtn");
        var tocEl = document.getElementById("toc");
        var backToTop = document.getElementById("backToTop");

        function buildNav(filteredDocs) {
            navList.innerHTML = "";
            var categories = [
                { key: "sistemas", label: "Sistemas (Compacto)", items: [] },
                { key: "detalhado", label: "Documentação Detalhada", items: [] }
            ];
            var filtered = filteredDocs || docs;
            filtered.forEach(function(d) {
                var cat = categories.find(function(c) { return c.key === d.category; });
                if (cat) cat.items.push(d);
            });
            categories.forEach(function(cat) {
                if (cat.items.length === 0) return;
                var catEl = document.createElement("div");
                catEl.className = "nav-category";
                catEl.innerHTML = "<span class=\"arrow\">\u25BC</span> " + cat.label + " (" + cat.items.length + ")";
                catEl.onclick = function() { catEl.classList.toggle("collapsed"); };
                navList.appendChild(catEl);

                var itemsContainer = document.createElement("div");
                itemsContainer.className = "nav-category-items";
                itemsContainer.style.maxHeight = "9999px";

                cat.items.forEach(function(doc) {
                    var item = document.createElement("a");
                    item.className = "nav-item";
                    item.dataset.slug = doc.slug;
                    item.textContent = doc.system_name || doc.title;
                    item.onclick = function(e) {
                        e.preventDefault();
                        loadDoc(doc);
                        closeMobileSidebar();
                    };
                    itemsContainer.appendChild(item);
                });
                navList.appendChild(itemsContainer);
            });
        }

        function loadDoc(doc) {
            document.querySelectorAll(".nav-item").forEach(function(el) {
                el.classList.toggle("active", el.dataset.slug === doc.slug);
            });
            var html = marked.parse(doc.content);
            var catLabel = doc.category === "sistemas" ? "Sistemas" : "Detalhado";
            content.innerHTML =
                "<div class=\"breadcrumb\">" + catLabel + " <span>\u203A</span> " + (doc.system_name || doc.title) + "</div>" +
                "<div class=\"doc-meta\">" +
                    "<span>\uD83D\uDCC4 " + doc.filename + "</span> &nbsp; " +
                    "<span>\uD83D\uDCC2 " + (doc.category === "sistemas" ? "docs/sistemas/" : "docs/") + "</span>" +
                "</div>" +
                "<div class=\"md-content\">" + html + "</div>";
            buildTOC();
            mainPanel.scrollTo(0, 0);
            history.replaceState(null, "", "#" + doc.slug);
        }

        function buildTOC() {
            var headings = content.querySelectorAll(".md-content h2, .md-content h3");
            if (headings.length < 2) { tocEl.innerHTML = ""; return; }
            var html = "<div class=\"toc-title\">Nesta Página</div>";
            headings.forEach(function(h, i) {
                var id = "toc-" + i;
                h.id = id;
                var depth = h.tagName === "H3" ? "depth-3" : "";
                html += "<a href=\"#" + id + "\" class=\"" + depth + "\">" + h.textContent + "</a>";
            });
            tocEl.innerHTML = html;

            tocEl.querySelectorAll("a").forEach(function(a) {
                a.addEventListener("click", function(e) {
                    e.preventDefault();
                    var target = document.getElementById(a.getAttribute("href").slice(1));
                    if (target) target.scrollIntoView({ behavior: "smooth" });
                });
            });
        }

        searchInput.addEventListener("input", function() {
            var q = searchInput.value.toLowerCase().trim();
            if (!q) { buildNav(); return; }
            var filtered = docs.filter(function(d) {
                var title = (d.system_name || d.title || "").toLowerCase();
                var desc = (d.description || "").toLowerCase();
                var body = (d.content || "").toLowerCase();
                return title.indexOf(q) >= 0 || desc.indexOf(q) >= 0 || body.indexOf(q) >= 0;
            });
            buildNav(filtered);
        });

        function closeMobileSidebar() {
            sidebarEl.classList.remove("open");
            overlayEl.classList.remove("open");
        }
        menuBtn.addEventListener("click", function() {
            sidebarEl.classList.toggle("open");
            overlayEl.classList.toggle("open");
        });
        overlayEl.addEventListener("click", closeMobileSidebar);

        mainPanel.addEventListener("scroll", function() {
            backToTop.classList.toggle("visible", mainPanel.scrollTop > 300);
        });
        backToTop.addEventListener("click", function() {
            mainPanel.scrollTo({ top: 0, behavior: "smooth" });
        });

        document.addEventListener("keydown", function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === "k") {
                e.preventDefault();
                searchInput.focus();
            }
        });

        function showStats() {
            var el = document.getElementById("statsContainer");
            if (!el) return;
            el.innerHTML =
                "<div class=\"stat-card\"><div class=\"number\">" + sistemas.length + "</div><div class=\"label\">Docs de Sistema</div></div>" +
                "<div class=\"stat-card\"><div class=\"number\">" + detalhados.length + "</div><div class=\"label\">Docs Detalhados</div></div>" +
                "<div class=\"stat-card\"><div class=\"number\">" + docs.length + "</div><div class=\"label\">Total</div></div>";
        }

        buildNav();
        showStats();

        var hash = location.hash.replace("#", "");
        if (hash) {
            var doc = docs.find(function(d) { return d.slug === hash; });
            if (doc) loadDoc(doc);
        }
    })();
    </script>
</body>
</html>
