<!DOCTYPE html>
<html lang="pt-BR" class="wa-portal" style="opacity:1!important">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Valdoria Portal — DEV</title>
    <meta name="theme-color" content="#2a2420">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="robots" content="noindex, nofollow">
    <style>html{background:#1a1510;opacity:1!important}</style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../shared/fonts.css">
    <script>
        var v = Date.now();
        var _loadCss = function(href) {
            var lk = document.createElement('link');
            lk.rel = 'stylesheet';
            lk.href = href + '?v=' + v;
            document.head.appendChild(lk);
        };
        _loadCss('../valdoria-design.css');
        _loadCss('../shared/loading-title.css');
        _loadCss('web-auth.css');
    </script>
    <style>
        .dev-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #c4953a;
            color: #1a1510;
            padding: 2px 8px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 10px;
            border-radius: 4px;
            z-index: 100;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(196, 149, 58, 0.4);
        }
        .pin-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed var(--v-gold-20);
            width: 100%;
        }
        .pin-input {
            width: 100%;
            background: #1a1510;
            border: 1px solid var(--v-gold-40);
            border-radius: 6px;
            color: #d4c8b0;
            padding: 10px;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }
        .pin-input:focus { border-color: var(--v-gold); outline: none; }
        .uid-input {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--v-border);
            border-radius: 6px;
            color: var(--v-text-dim);
            padding: 6px;
            font-size: 11px;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body class="wa-portal">
    <div class="dev-badge">DEVELOPMENT PORTAL</div>

    <div class="wa-hero-particles">
        <div class="wa-ember"></div><div class="wa-ember"></div><div class="wa-ember"></div>
        <div class="wa-ember"></div><div class="wa-ember"></div><div class="wa-ember"></div>
    </div>

    <div id="screen-login" class="wa-screen wa-active">
        <div class="wa-login-card">
            <div class="wa-orb-wrap">
                <div class="title-orb-wrap">
                    <div class="title-orb-rays"></div>
                    <div class="title-orb-ambient"></div>
                    <div class="title-orb"><div class="title-orb-core"></div></div>
                </div>
            </div>

            <h1 class="wa-title">
                <span class="wa-title-top">Valdoria</span>
                <span class="wa-title-sub">Developer</span>
            </h1>

            <div class="wa-auth-buttons">
                <!-- Official Telegram DEV -->
                <button id="btn-telegram" class="wa-social-btn wa-social-btn--telegram" onclick="onTelegramClick()">
                    <span class="wa-social-icon">
                        <svg viewBox="0 0 24 24" fill="white"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
                    </span>
                    <span class="wa-social-text">Social Login (Bot DEV)</span>
                </button>

                <div class="wa-separator">
                    <span class="wa-separator-line"></span>
                    <span class="wa-separator-text">ou use a chave mestra</span>
                    <span class="wa-separator-line"></span>
                </div>

                <!-- PIN Bypass Section -->
                <div class="pin-section">
                    <input type="text" id="dev-uid" class="uid-input" placeholder="User ID (Opcional)" value="7685169782">
                    <input type="password" id="dev-pin" class="pin-input" placeholder="PIN SECRETO" maxlength="32">
                    <button id="btn-pin" class="wa-btn-play" onclick="onPinLogin()">Entrar com PIN</button>
                    <div id="auth-error" class="wa-error" style="display:none"></div>
                </div>
            </div>

            <div id="auth-loading" class="wa-loading" style="display:none">
                <div class="wa-spinner"></div>
                <span>Autenticando DEV...</span>
            </div>
            
            <p class="wa-footer-note">Ambiente de Testes Isolado</p>
        </div>
    </div>

    <!-- Characters Selection (Reuse standard UI) -->
    <div id="screen-chars" class="wa-screen">
        <div class="wa-chars-card">
            <h2 class="wa-chars-title">Personagens DEV</h2>
            <div id="char-list" class="wa-char-list"></div>
            <button id="btn-play" class="wa-btn-play" disabled onclick="onPlay()">⚔️ Jogar</button>
            <button class="wa-btn-logout" onclick="onLogout()">Voltar</button>
        </div>
    </div>

    <script src="../shared/env-utils.js"></script>
    <script src="../shared/telegram-compat.js"></script>
    <script>
        /* FORCE DEV ENVIRONMENT & BOT */
        window._envOverride = 'dev';
        window.BOT_USERNAME = 'ValdoriaDevBot';
        
        // Load main auth logic
        const s = document.createElement('script');
        s.src = 'web-auth.js?v=' + Date.now();
        document.body.appendChild(s);
    </script>
    <script>
        // Custom PIN handler
        window.onPinLogin = async function() {
            const pin = document.getElementById('dev-pin').value.trim();
            const uid = document.getElementById('dev-uid').value.trim() || '7685169782';
            const btn = document.getElementById('btn-pin');
            const err = document.getElementById('auth-error');
            const loading = document.getElementById('auth-loading');

            if (!pin) { err.textContent = 'PIN necessário'; err.style.display = 'block'; return; }
            
            err.style.display = 'none';
            loading.style.display = 'flex';
            btn.disabled = true;
            
            try {
                // apiBase comes from web-auth.js discoverApiBase
                if (typeof discoverApiBase === 'function') await discoverApiBase();
                if (!window._apiBase) throw new Error('Servidor não encontrado');
                
                const resp = await fetch(window._apiBase + '/api/game/_dev_session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: parseInt(uid), char_id: '', pin: pin })
                });

                if (!resp.ok) {
                    const errD = await resp.json().catch(() => ({}));
                    throw new Error(errD.error || 'Acesso negado');
                }
                
                const data = await resp.json();
                if (typeof handleLoginSuccess === 'function') handleLoginSuccess(data);
                else throw new Error('Módulo de auth não carregado');
                
            } catch(e) {
                err.textContent = e.message;
                err.style.display = 'block';
            } finally {
                loading.style.display = 'none';
                btn.disabled = false;
            }
        };

        // UI link
        document.querySelector('.wa-footer-note').onclick = () => window.location.href = './';
    </script>
</body>
</html>
