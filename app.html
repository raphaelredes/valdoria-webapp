<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://telegra.ph https://i.ibb.co; media-src 'self'; connect-src 'self' https: wss:; frame-src 'none'; object-src 'none'; base-uri 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lendas de Valdoria</title>
    <meta name="theme-color" content="#2a2420">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preload" href="shared/fonts/medievalsharp.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="shared/fonts.css">
    <script>
        var v = Date.now();
        document.write('<link rel="stylesheet" href="valdoria-design.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="shared/audio-manager.css?v=' + v + '">');
    </script>
    <style>
        /* SPA shell: only loading + route container */
        #route-root {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
    </style>
    <!-- Telegram SDK (shell-level, persists across routes) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Shell scripts: loaded once, persist across all routes -->
    <script>
    document.write('<script src="shared/font-apply.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/haptic.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/webapp-init.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/audio-manager.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/loading-guard.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/loading-controller.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/toast.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/motion.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/error-reporter.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/wake-lock.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/perf-tracker.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/telegram-compat.js?v=' + v + '"><\/script>');
    </script>
</head>
<body>
    <!-- Loading overlay (persists in shell, reused across routes) -->
    <div id="loading" class="loading-overlay">
        <div class="loading-particles">
            <div class="particle ember p1"></div>
            <div class="particle ember p2"></div>
            <div class="particle ember p3"></div>
            <div class="particle ember p4"></div>
            <div class="particle ember p5"></div>
            <div class="particle ember p6"></div>
            <div class="particle spark s1"></div>
            <div class="particle spark s2"></div>
            <div class="particle spark s3"></div>
            <div class="particle spark s4"></div>
            <div class="particle mote m1"></div>
            <div class="particle mote m2"></div>
            <div class="particle flame fl1"></div>
            <div class="particle flame fl2"></div>
            <div class="particle flame fl3"></div>
            <div class="particle frost fr1"></div>
            <div class="particle frost fr2"></div>
            <div class="particle frost fr3"></div>
            <div class="particle lightning lt1"></div>
            <div class="particle lightning lt2"></div>
            <div class="particle arcane ar1"></div>
            <div class="particle arcane ar2"></div>
            <div class="particle arcane ar3"></div>
        </div>
        <div class="magic-circle">
            <div class="mc-aura"></div>
            <div class="mc-aura mc-aura-2"></div>
            <svg class="mc-ring mc-outer" viewBox="0 0 300 300">
                <defs><path id="runeOuter" d="M150,150 m-125,0 a125,125 0 1,1 250,0 a125,125 0 1,1 -250,0"/></defs>
                <circle cx="150" cy="150" r="125" fill="none" stroke="rgba(196,149,58,0.06)" stroke-width="1"/>
                <circle cx="150" cy="150" r="127" fill="none" stroke="rgba(196,149,58,0.04)" stroke-width="0.5" stroke-dasharray="4 8"/>
                <text class="mc-rune-text" fill="rgba(196,149,58,0.5)">
                    <textPath href="#runeOuter" startOffset="0%">&#5792; &#5794; &#5798; &#5800; &#5809; &#5810; &#5815; &#5817; &#5818; &#5822; &#5825; &#5827; &#5831; &#5832; &#5833; &#5834; &#5839; &#5842; &#5846; &#5848; &#5850; &#5852; &#5853; &#5855;</textPath>
                </text>
            </svg>
            <svg class="mc-ring mc-mid" viewBox="0 0 300 300">
                <circle cx="150" cy="150" r="102" fill="none" stroke="rgba(196,149,58,0.05)" stroke-width="0.5"/>
                <circle class="mc-energy-arc mc-arc-1" cx="150" cy="150" r="102" fill="none" stroke="rgba(196,149,58,0.6)" stroke-width="1.5" stroke-linecap="round"/>
                <circle class="mc-energy-arc mc-arc-2" cx="150" cy="150" r="96" fill="none" stroke="rgba(123,32,32,0.5)" stroke-width="1.5" stroke-linecap="round"/>
                <g opacity="0.3" fill="none" stroke="rgba(196,149,58,0.6)" stroke-width="1">
                    <line x1="150" y1="44" x2="150" y2="54"/><line x1="150" y1="246" x2="150" y2="256"/>
                    <line x1="44" y1="150" x2="54" y2="150"/><line x1="246" y1="150" x2="256" y2="150"/>
                </g>
            </svg>
            <svg class="mc-ring mc-inner" viewBox="0 0 300 300">
                <defs><path id="runeInner" d="M150,150 m-75,0 a75,75 0 1,1 150,0 a75,75 0 1,1 -150,0"/></defs>
                <circle cx="150" cy="150" r="75" fill="none" stroke="rgba(196,149,58,0.06)" stroke-width="0.5"/>
                <text class="mc-inner-text" fill="rgba(196,149,58,0.35)">
                    <textPath href="#runeInner" startOffset="0%">&#9670; VALDORIA &#9670; LENDAS &#9670; VALDORIA &#9670; LENDAS </textPath>
                </text>
            </svg>
            <div class="mc-pulse"></div>
            <div class="mc-pulse mc-pulse-2"></div>
            <div class="mc-completion-wave"></div>
            <div class="mc-completion-wave wave-2"></div>
        </div>
        <div class="loading-flash"></div>
        <div class="loading-brand">
            <div class="loading-title">LENDAS DE VALDORIA</div>
            <div class="loading-divider"><span class="divider-rune">&#9670;</span></div>
        </div>
        <div class="loading-progress-wrap">
            <div class="loading-progress-track">
                <div id="loading-progress" class="loading-progress-fill"></div>
            </div>
        </div>
        <div id="loading-stage" class="loading-stage"></div>
        <button id="loading-retry" class="loading-retry" style="display:none">Tentar novamente</button>
        <div class="loading-tip-area">
            <div id="loading-tip" class="loading-tip">Preparando sua aventura...</div>
        </div>
    </div>

    <!-- Route content container (swapped by router) -->
    <div id="route-root"></div>

    <!-- Game Hub popstate trap: exit-confirm.js checks this flag at load time -->
    <script>window.__valdoriaPopstateTrap = true;</script>

    <!-- SPA Router + Routes + Init -->
    <script>
    var v = Date.now();
    document.write('<script src="spa/router.js?v=' + v + '"><\/script>');
    document.write('<script src="spa/spa-nav.js?v=' + v + '"><\/script>');
    document.write('<script src="spa/routes.js?v=' + v + '"><\/script>');
    document.write('<script src="spa/init.js?v=' + v + '"><\/script>');
    </script>

    <!-- Service Worker -->
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js?v=7').catch(function(){})}</script>
</body>
</html>
