<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://telegra.ph https://i.ibb.co; media-src 'self'; connect-src 'self' https: wss:; frame-src 'none'; object-src 'none'; base-uri 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Lendas de Valdoria</title>
    <meta name="theme-color" content="#2a2420">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preload" href="shared/fonts/medievalsharp.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="shared/fonts.css">
    <script>
        var v = Date.now();
        document.write('<link rel="stylesheet" href="valdoria-design.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="shared/audio-manager.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="shared/loading-title.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="shared/loading-reactive.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="shared/version-check.css?v=' + v + '">');
        window.__APP_VERSION = 'caa3436caf98';
    </script>
    <style>
        /* SPA shell: only loading + route container */
        #route-root {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
    </style>
    <!-- Telegram SDK (shell-level, persists across routes) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Shell scripts: loaded once, persist across all routes -->
    <script>
    document.write('<script src="shared/font-apply.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/haptic.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/webapp-init.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/audio-manager.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/loading-guard.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/loading-controller.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/loading-title.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/loading-reactive.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/toast.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/motion.js?v=' + v + '"><\/script>');
    document.write('<link rel="stylesheet" href="shared/connection-overlay.css?v=' + v + '">');
    document.write('<script src="shared/connection-overlay.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/console-collector.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/error-reporter.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/wake-lock.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/perf-tracker.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/telegram-compat.js?v=' + v + '"><\/script>');
    document.write('<script src="shared/version-check.js?v=' + v + '"><\/script>');
    </script>
</head>
<body>
    <!-- Dark placeholder — starts HIDDEN; title screen covers until user taps -->
    <div id="loading" class="loading-overlay" style="display:none;background:#1a1510" aria-busy="true"></div>
    <script>
    /* ── Early title screen: show IMMEDIATELY to prevent loading flash ── */
    (function(){
        if(typeof ValdoriaTitleScreen!=='function')return;
        window.__introTitle=ValdoriaTitleScreen({onStart:function(){
            console.log('[INTRO] Early title TAPPED (app.html)');
            if(typeof window.__onIntroTap==='function'){window.__onIntroTap();}
            else{window.__introTapped=true;}
        }});
        window.__introTitle.show();
        console.log('[INTRO] Early title screen injected (app.html)');
    })();
    </script>

    <!-- Route content container (swapped by router) -->
    <div id="route-root"></div>

    <!-- Game Hub popstate trap: exit-confirm.js checks this flag at load time -->
    <script>window.__valdoriaPopstateTrap = true;</script>

    <!-- Populate loading overlay now that all CSS+JS are loaded (prevents SVG flash) -->
    <script>
    document.write('<link rel="stylesheet" href="shared/loading.css?v=' + v + '">');
    document.write('<script src="shared/loading-template.js?v=' + v + '"><\/script>');
    </script>
    <script>
    var _ld = document.getElementById('loading');
    if (_ld && typeof ValdoriaLoadingHTML === 'function') {
        var _tmp = document.createElement('div');
        _tmp.innerHTML = ValdoriaLoadingHTML({
            title: 'LENDAS DE VALDORIA',
            particleSet: 'full',
            defaultTip: 'Preparando sua aventura...'
        });
        var _overlay = _tmp.firstElementChild;
        _overlay.style.background = '#1a1510';
        _ld.parentNode.replaceChild(_overlay, _ld);
        if (window._loadDbg) _loadDbg('loading overlay populated (deferred SVG)');
    } else {
        console.warn('[LOAD-DBG] loading overlay populate FAILED: placeholder=' + !!_ld + ' template=' + (typeof ValdoriaLoadingHTML));
    }
    </script>

    <!-- SPA Router + Routes + Init -->
    <script>
    var v = Date.now();
    document.write('<script src="spa/spa-watchdog.js?v=' + v + '"><\/script>');
    document.write('<script src="spa/router.js?v=' + v + '"><\/script>');
    document.write('<script src="spa/spa-nav.js?v=' + v + '"><\/script>');
    document.write('<script src="spa/routes.js?v=' + v + '"><\/script>');
    document.write('<script src="spa/init.js?v=' + v + '"><\/script>');
    </script>

    <!-- Service Worker -->
    <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js?v='+Date.now()).catch(function(){})}</script>
</body>
</html>
