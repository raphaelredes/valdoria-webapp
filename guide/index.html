    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a2420">
    <style>html{opacity:0}</style>
    <title>Guia - Lendas de Valdoria</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="preload" href="../shared/fonts/medievalsharp.woff2" as="font" type="font/woff2" crossorigin>

        document.write('<link rel="stylesheet" href="../shared/loading.css?v=' + v + '">');;

    <style>
        * { scrollbar-width: none; -ms-overflow-style: none; }
        *::-webkit-scrollbar { display: none; }

        body {
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* ─── HEADER (sticky — includes search + pills) ─── */
        .guide-header {
            position: sticky;
            top: 0;
            z-index: var(--v-z-sticky, 10);
            background: var(--v-bg);
            padding: 8px 12px 0;
            border-bottom: 1px solid var(--v-border);
        }

        .guide-title {
            font-family: var(--v-font-display);
            color: var(--v-gold);
            font-size: 15px;
            text-align: center;
            margin: 0 0 6px;
            letter-spacing: 1px;
        }

        /* ─── SEARCH BAR ─── */
        .search-wrap {
            position: relative;
        }

        .search-input {
            width: 100%;
            box-sizing: border-box;
            padding: 8px 34px 8px 32px;
            background: var(--v-bg-raised);
            border: 1px solid var(--v-border);
            border-radius: var(--v-radius);
            color: var(--v-text);
            font-family: var(--v-font);
            font-size: 14px;
            outline: none;
            transition: border-color var(--v-transition);
        }

        .search-input::placeholder {
            color: var(--v-text-dim);
            font-style: italic;
        }

        .search-input:focus {
            border-color: var(--v-gold-dim);
        }

        .search-icon {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--v-text-dim);
            font-size: 13px;
            pointer-events: none;
        }

        .search-clear {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--v-text-dim);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            min-width: 44px;
            min-height: 44px;
            align-items: center;
            justify-content: center;
            display: none;
        }

        .search-clear.visible { display: flex; }

        /* ─── RESULT COUNT ─── */
        .result-count {
            font-family: var(--v-font);
            font-size: 11px;
            color: var(--v-text-dim);
            text-align: center;
            padding: 4px 0 0;
            display: none;
        }

        .result-count.visible { display: block; }

        /* ─── NO RESULTS ─── */
        .no-results {
            text-align: center;
            padding: 28px 16px;
            color: var(--v-text-dim);
            font-family: var(--v-font);
            font-size: 14px;
            display: none;
        }

        .no-results.visible { display: block; }

        .no-results .nr-icon {
            font-size: clamp(22px, 6vw, 28px);
            display: block;
            margin-bottom: 8px;
        }

        /* ─── CATEGORY PILLS (inside sticky header) ─── */
        .cat-filters {
            display: flex;
            gap: 4px;
            padding: 4px 0 6px;
            overflow-x: auto;
            flex-wrap: nowrap;
        }

        .cat-pill {
            flex-shrink: 0;
            padding: 4px 10px;
            border-radius: var(--v-radius-pill);
            background: var(--v-bg-raised);
            border: 1px solid var(--v-border);
            color: var(--v-text-dim);
            font-family: var(--v-font);
            font-size: 12px;
            cursor: pointer;
            transition: background var(--v-transition-fast), border-color var(--v-transition-fast), color var(--v-transition-fast);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            min-height: 32px;
        }

        .cat-pill.active {
            background: rgba(196, 149, 58, 0.15);
            border-color: var(--v-gold-dim);
            color: var(--v-gold);
        }

        /* ─── TOPIC LIST ─── */
        .topics {
            padding: 4px 10px 80px;
        }

        .topic-card {
            background: var(--v-bg-card);
            border: 1px solid var(--v-border);
            border-radius: var(--v-radius);
            margin-bottom: 4px;
            overflow: hidden;
        }

        .topic-card.hidden {
            display: none;
        }

        .topic-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            min-height: 44px;
            box-sizing: border-box;
        }

        .topic-header:active {
            background: var(--v-bg-card-hover);
        }

        .topic-name {
            font-family: var(--v-font);
            font-size: 14px;
            color: var(--v-text-bright);
            flex: 1;
        }

        .topic-arrow {
            color: var(--v-text-dim);
            font-size: 11px;
            transition: transform var(--v-transition);
            margin-left: 8px;
        }

        .topic-card.open .topic-arrow {
            transform: rotate(90deg);
        }

        /* Body: use grid for GPU-friendly collapse (no max-height hack) */
        .topic-body {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows var(--v-transition-base);
            overflow: hidden;
        }

        .topic-card.open .topic-body {
            grid-template-rows: 1fr;
        }

        .topic-body-inner {
            overflow: hidden;
        }

        .topic-content {
            padding: 0 12px 10px;
            font-family: var(--v-font);
            font-size: 13px;
            line-height: 1.6;
            color: var(--v-text);
        }

        .topic-content b {
            color: var(--v-gold-light);
        }

        .topic-content i {
            color: var(--v-text-dim);
        }

        .topic-content code {
            font-family: var(--v-font-mono);
            background: rgba(0,0,0,0.2);
            padding: 1px 4px;
            border-radius: var(--v-radius-sm);
            font-size: 12px;
        }

        /* ─── SEARCH HIGHLIGHT ─── */
        mark.search-hl {
            background: rgba(196, 149, 58, 0.3);
            color: var(--v-gold-light);
            border-radius: var(--v-radius-sm);
            padding: 0 1px;
        }

        /* ─── PULSE ANIMATION ─── */
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(196, 149, 58, 0.35); }
            50% { box-shadow: 0 0 10px 2px rgba(196, 149, 58, 0.2); }
            100% { box-shadow: 0 0 0 0 rgba(196, 149, 58, 0); }
        }

        .topic-card.search-match {
            animation: pulse-gold 1s ease-out;
            border-color: var(--v-gold-dim);
        }


        /* ─── HEADER ORNAMENT ─── */
        .guide-ornament {
            text-align: center;
            color: var(--v-gold-dim);
            font-size: 11px;
            letter-spacing: 6px;
            margin: -2px 0 4px;
            opacity: 0.6;
        }

        /* ─── TOPIC CARD HOVER GLOW ─── */
        .topic-card:not(.hidden) {
            transition: border-color var(--v-transition), box-shadow var(--v-transition);
        }

        .topic-card.open {
            border-color: var(--v-gold-dim);
            box-shadow: 0 0 8px rgba(196, 149, 58, 0.1);
        }

        /* ─── SMOOTH SCROLL ─── */
        html { scroll-behavior: smooth; }

        /* ─── TOPIC CONTENT LISTS ─── */
        .topic-content ul {
            padding-left: 16px;
            margin: 4px 0;
        }

        /* ─── RELATED TOPICS LINK ─── */
        .topic-related {
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid var(--v-border);
            font-size: 11px;
            color: var(--v-text-dim);
        }

        .topic-related a {
            color: var(--v-gold-dim);
            text-decoration: none;
            cursor: pointer;
        }

        .topic-related a:active {
            color: var(--v-gold);
        }

        /* ─── CLOSE BUTTON ─── */
        .guide-close {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            padding: 9px 28px;
            background: var(--v-bg-raised);
            border: 1px solid var(--v-border);
            border-radius: var(--v-radius-pill);
            color: var(--v-text);
            font-family: var(--v-font);
            font-size: 13px;
            cursor: pointer;
            z-index: var(--v-z-sticky, 20);
            box-shadow: var(--v-shadow-md);
            min-height: 44px;
            min-width: 44px;
        }

        .guide-close:active {
            background: var(--v-bg-card-hover);
        }
    </style>
    <script>
    document.write('<script src="../shared/haptic.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/font-apply.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/bounce-back.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/webapp-init.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/loading-guard.js?v=' + v + '"><\/script>');
document.write('<script src="../shared/audio-manager.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/exit-confirm.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/session-heartbeat.js?v=' + v + '"><\/script>');
    </script>
</head>

<body>
    <div class="guide-header">
        <h1 class="guide-title">GUIA DE VALDORIA</h1>
        <div class="guide-ornament">⸱ ✦ ⸱</div>
        <div class="search-wrap">
            <span class="search-icon">&#x1f50d;</span>
            <input class="search-input" type="text" placeholder="Pesquisar no guia..." id="searchInput" autocomplete="off">
            <button class="search-clear" id="searchClear">&times;</button>
        </div>
        <div class="result-count" id="resultCount"></div>
        <div class="cat-filters" id="catFilters"></div>
    </div>

    <div class="no-results" id="noResults">
        <span class="nr-icon">&#x1f4dc;</span>
        Nenhum t&#xf3;pico encontrado para esta pesquisa.
    </div>

    <div class="topics" id="topics"></div>

    <button class="guide-close" id="closeBtn">&#x1f519; Fechar</button>
