<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2a2420">
    <title>Guia - Lendas de Valdoria</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../shared/fonts.css">
    <script>
        var v = Date.now();
        document.write('<link rel="stylesheet" href="../valdoria-design.css?v=' + v + '">');
    </script>
    <style>
        * { scrollbar-width: none; -ms-overflow-style: none; }
        *::-webkit-scrollbar { display: none; }

        body {
            display: flex;
            flex-direction: column;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* ─── HEADER ─── */
        .guide-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--v-bg);
            padding: 12px 16px 8px;
            border-bottom: 1px solid var(--v-border);
        }

        .guide-title {
            font-family: var(--v-font-display);
            color: var(--v-gold);
            font-size: 16px;
            text-align: center;
            margin: 0 0 10px;
            letter-spacing: 1px;
        }

        /* ─── SEARCH BAR ─── */
        .search-wrap {
            position: relative;
        }

        .search-input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 14px 10px 36px;
            background: var(--v-bg-raised);
            border: 1px solid var(--v-border);
            border-radius: var(--v-radius);
            color: var(--v-text);
            font-family: var(--v-font);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-input::placeholder {
            color: var(--v-text-dim);
            font-style: italic;
        }

        .search-input:focus {
            border-color: var(--v-gold-dim);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--v-text-dim);
            font-size: 14px;
            pointer-events: none;
        }

        .search-clear {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--v-text-dim);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            display: none;
        }

        .search-clear.visible { display: block; }

        /* ─── NO RESULTS ─── */
        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--v-text-dim);
            font-family: var(--v-font);
            font-size: 14px;
            display: none;
        }

        .no-results.visible { display: block; }

        .no-results .nr-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 12px;
        }

        /* ─── TOPIC LIST ─── */
        .topics {
            padding: 8px 12px 80px;
        }

        .topic-card {
            background: var(--v-bg-card);
            border: 1px solid var(--v-border);
            border-radius: var(--v-radius);
            margin-bottom: 8px;
            overflow: hidden;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .topic-card.hidden {
            display: none;
        }

        .topic-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .topic-header:active {
            background: var(--v-bg-card-hover);
        }

        .topic-name {
            font-family: var(--v-font);
            font-size: 14px;
            color: var(--v-text-bright);
            flex: 1;
        }

        .topic-arrow {
            color: var(--v-text-dim);
            font-size: 12px;
            transition: transform 0.25s ease;
            margin-left: 8px;
        }

        .topic-card.open .topic-arrow {
            transform: rotate(90deg);
        }

        .topic-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .topic-card.open .topic-body {
            max-height: 2000px;
        }

        .topic-content {
            padding: 0 14px 14px;
            font-family: var(--v-font);
            font-size: 13px;
            line-height: 1.6;
            color: var(--v-text);
        }

        .topic-content b {
            color: var(--v-gold-light);
        }

        .topic-content i {
            color: var(--v-text-dim);
        }

        .topic-content code {
            font-family: var(--v-font-mono);
            background: rgba(0,0,0,0.2);
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 12px;
        }

        /* ─── SEARCH HIGHLIGHT ─── */
        mark.search-hl {
            background: rgba(196, 149, 58, 0.3);
            color: var(--v-gold-light);
            border-radius: 2px;
            padding: 0 2px;
        }

        /* ─── PULSE ANIMATION on search match ─── */
        @keyframes pulse-gold {
            0% { box-shadow: 0 0 0 0 rgba(196, 149, 58, 0.4); }
            50% { box-shadow: 0 0 12px 2px rgba(196, 149, 58, 0.25); }
            100% { box-shadow: 0 0 0 0 rgba(196, 149, 58, 0); }
        }

        .topic-card.search-match {
            animation: pulse-gold 1.2s ease-out;
            border-color: var(--v-gold-dim);
        }

        /* ─── CATEGORY BADGES ─── */
        .cat-filters {
            display: flex;
            gap: 6px;
            padding: 8px 12px;
            overflow-x: auto;
            flex-wrap: nowrap;
        }

        .cat-pill {
            flex-shrink: 0;
            padding: 5px 12px;
            border-radius: var(--v-radius-pill);
            background: var(--v-bg-raised);
            border: 1px solid var(--v-border);
            color: var(--v-text-dim);
            font-family: var(--v-font);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .cat-pill.active {
            background: rgba(196, 149, 58, 0.15);
            border-color: var(--v-gold-dim);
            color: var(--v-gold);
        }

        /* ─── CLOSE BUTTON ─── */
        .guide-close {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 32px;
            background: var(--v-bg-raised);
            border: 1px solid var(--v-border);
            border-radius: var(--v-radius-pill);
            color: var(--v-text);
            font-family: var(--v-font);
            font-size: 14px;
            cursor: pointer;
            z-index: 20;
            box-shadow: var(--v-shadow-md);
        }

        .guide-close:active {
            background: var(--v-bg-card-hover);
        }
    </style>
</head>

<body>
    <div class="guide-header">
        <h1 class="guide-title">GUIA DE VALDORIA</h1>
        <div class="search-wrap">
            <span class="search-icon">&#x1f50d;</span>
            <input class="search-input" type="text" placeholder="Pesquisar no guia..." id="searchInput" autocomplete="off">
            <button class="search-clear" id="searchClear">&times;</button>
        </div>
    </div>

    <div class="cat-filters" id="catFilters"></div>

    <div class="no-results" id="noResults">
        <span class="nr-icon">&#x1f4dc;</span>
        Nenhum t&#xf3;pico encontrado para esta pesquisa.
    </div>

    <div class="topics" id="topics"></div>

    <button class="guide-close" id="closeBtn">&#x1f519; Fechar</button>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="guide-data.js"></script>
    <script src="guide-app.js"></script>
</body>

</html>
