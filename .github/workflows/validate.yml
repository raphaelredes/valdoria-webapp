name: Validate Webapps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check file sizes
        run: |
          echo "=== File Size Report ==="
          status=0
          for f in $(find . -name "*.html" -o -name "*.css" -o -name "*.js" | grep -v node_modules | grep -v .git | sort); do
            size=$(wc -c < "$f")
            size_kb=$((size / 1024))
            if [ "$size" -gt 100000 ]; then
              echo "WARNING: $f — ${size_kb}KB (>100KB)"
              status=1
            else
              echo "  OK: $f — ${size_kb}KB"
            fi
          done
          exit $status

      - name: Validate HTML structure
        run: |
          echo "=== HTML Structure Check ==="
          for f in $(find . -name "*.html" | grep -v node_modules | grep -v .git); do
            echo "Checking $f..."
            # Check for DOCTYPE
            if ! head -1 "$f" | grep -qi "doctype"; then
              echo "  ERROR: Missing DOCTYPE in $f"
              exit 1
            fi
            # Check for charset
            if ! grep -q 'charset="utf-8"' "$f" && ! grep -q "charset=utf-8" "$f"; then
              echo "  ERROR: Missing charset in $f"
              exit 1
            fi
            # Check for viewport meta
            if ! grep -q 'viewport' "$f"; then
              echo "  WARNING: Missing viewport meta in $f"
            fi
            echo "  OK"
          done

      - name: Validate JavaScript syntax
        run: |
          echo "=== JavaScript Syntax Check (node --check) ==="
          status=0
          for f in $(find . -name "*.js" | grep -v node_modules | grep -v .git | grep -v '.min.js' | sort); do
            if ! node --check "$f" 2>/dev/null; then
              echo "  ERROR: Syntax error in $f"
              node --check "$f" 2>&1 | head -5
              status=1
            else
              echo "  OK: $f"
            fi
          done
          exit $status

      - name: Validate CSS syntax
        run: |
          echo "=== CSS Syntax Check ==="
          for f in $(find . -name "*.css" | grep -v node_modules | grep -v .git); do
            echo "Checking $f..."
            # Check for unmatched braces
            opens=$(grep -o '{' "$f" | wc -l)
            closes=$(grep -o '}' "$f" | wc -l)
            if [ "$opens" != "$closes" ]; then
              echo "  ERROR: Unmatched braces in $f (opens=$opens, closes=$closes)"
              exit 1
            fi
            echo "  OK (balanced braces: $opens)"
          done

      - name: Check audio file sizes
        run: |
          echo "=== Audio File Size Check ==="
          status=0
          for f in $(find shared/audio -name "*.mp3" -o -name "*.wav" -o -name "*.ogg" 2>/dev/null | sort); do
            size=$(wc -c < "$f")
            size_mb=$((size / 1048576))
            if [ "$size" -gt 5242880 ]; then
              echo "WARNING: $f — ${size_mb}MB (>5MB)"
              status=1
            fi
          done
          if [ "$status" -eq 0 ]; then echo "All audio files OK (<5MB each)"; fi
          exit $status

      - name: Check Service Worker registration
        run: |
          echo "=== Service Worker Registration Check ==="
          status=0
          for d in game combat explore inventory navigate market prologue dungeon character_creator levelup; do
            f="$d/index.html"
            if [ -f "$f" ]; then
              if grep -q 'serviceWorker' "$f"; then
                echo "  OK: $f"
              else
                echo "  MISSING: $f — no SW registration"
                status=1
              fi
            fi
          done
          exit $status

      - name: Check error-reporter inclusion
        run: |
          echo "=== Error Reporter Check ==="
          for d in game combat explore inventory navigate prologue dungeon; do
            f="$d/index.html"
            if [ -f "$f" ]; then
              if grep -q 'error-reporter' "$f"; then
                echo "  OK: $f"
              else
                echo "  WARNING: $f — no error-reporter.js"
              fi
            fi
          done

      - name: Check font preloading
        run: |
          echo "=== Font Preload Check ==="
          for d in game combat explore inventory navigate market prologue dungeon character_creator levelup; do
            f="$d/index.html"
            if [ -f "$f" ]; then
              if grep -q 'preload.*woff2' "$f"; then
                echo "  OK: $f"
              else
                echo "  WARNING: $f — no font preload"
              fi
            fi
          done
