<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#2a2420">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>html{background:#2a2420}</style>
    <meta name="description" content="Oficina de Artesanato - Lendas de Valdoria">
    <meta property="og:title" content="Oficina de Artesanato - Lendas de Valdoria">
    <meta property="og:description" content="Fabrique itens e equipamentos no RPG medieval">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="preload" href="../shared/fonts/medievalsharp.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../shared/fonts.css">

    <script>
        var v = Date.now();
        document.write('<link rel="stylesheet" href="../valdoria-design.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/animations.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/loading.css?v=' + v + '">');
        document.write('<link rel="stylesheet" href="../shared/processing-overlay.css?v=' + v + '">');

    <style>
        body {
            padding-bottom: 80px;
        }

        .header {
            background: linear-gradient(180deg, rgba(196,149,58,0.10) 0%, rgba(196,149,58,0.03) 60%, transparent 100%);
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid rgba(196,149,58,0.2);
            position: sticky;
            top: 0;
            z-index: var(--v-z-header, 100);
        }

        /* ::before accent line removed — Game Hub style */

        .header h1 {
            font-size: 16px;
            color: var(--v-gold);
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .header .stats {
            font-size: 12px;
            color: var(--v-text-dim);
        }

        .tabs {
            display: flex;
            overflow-x: auto;
            gap: 4px;
            padding: 8px 10px;
            background: var(--v-bg-raised);
            border-bottom: 1px solid var(--v-border);
            -webkit-overflow-scrolling: touch;
        }

        .tabs::-webkit-scrollbar {
            display: none;
        }

        .tab {
            flex-shrink: 0;
            padding: 8px 14px;
            border-radius: var(--v-radius-pill);
            font-size: 13px;
            border: 1px solid var(--v-border);
            background: var(--v-bg-card);
            color: var(--v-text-dim);
            cursor: pointer;
            transition: all var(--v-transition);
            white-space: nowrap;
        }

        .tab.active {
            border-color: var(--v-gold-dim);
            background: rgba(196,149,58,0.08);
            color: var(--v-gold);
        }

        .content {
            padding: 10px;
        }

        /* Recipe cards */
        .recipe-card {
            background: var(--v-bg-card);
            border: 1px solid var(--v-border);
            border-radius: var(--v-radius);
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all var(--v-transition);
        }

        .recipe-card:active {
            transform: scale(0.98);
        }

        .recipe-card.selected {
            border-color: var(--v-gold);
            box-shadow: var(--v-shadow-gold);
        }

        .recipe-card.craftable {
            border-left: 3px solid var(--v-success);
        }

        .recipe-card.missing {
            border-left: 3px solid var(--v-danger);
        }

        .recipe-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .recipe-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--v-text);
        }

        .recipe-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: var(--v-radius);
            font-weight: 600;
        }

        .badge-ready {
            background: var(--v-success);
            color: #fff;
        }

        .badge-missing {
            background: var(--v-danger);
            color: #fff;
        }

        .recipe-meta {
            font-size: 12px;
            color: var(--v-text-dim);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Recipe detail panel */
        .detail-panel {
            background: var(--v-bg-raised);
            border: 1px solid var(--v-gold-dim);
            border-radius: var(--v-radius);
            padding: 10px;
            margin-top: 8px;
            display: none;
        }

        .detail-panel.visible {
            display: block;
        }

        .detail-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--v-gold);
            margin-bottom: 10px;
        }

        .ingredient-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid var(--v-border);
            font-size: 13px;
        }

        .ingredient-row:last-child {
            border-bottom: none;
        }

        .ing-status {
            font-size: 14px;
            margin-right: 6px;
        }

        .gold-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
            font-weight: 600;
            color: var(--v-gold);
        }

        .output-row {
            padding: 10px 0;
            font-size: 14px;
            color: var(--v-success);
            font-weight: 600;
        }

        /* Craft button */
        .craft-btn-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: linear-gradient(transparent, var(--v-bg) 30%);
            z-index: var(--v-z-header, 100);
        }

        .craft-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--v-radius);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--v-transition);
        }

        .craft-btn.enabled {
            background: linear-gradient(135deg, var(--v-gold), var(--v-gold-dim));
            color: var(--v-bg);
        }

        .craft-btn.enabled:active {
            transform: scale(0.98);
        }

        .craft-btn.disabled {
            background: var(--v-border);
            color: var(--v-text-dim);
            cursor: not-allowed;
        }

        /* Materials tab */
        .material-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: var(--v-bg-card);
            border-radius: var(--v-radius-sm);
            margin-bottom: 6px;
            font-size: 14px;
        }

        .material-qty {
            color: var(--v-gold);
            font-weight: 600;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: clamp(20px, 8vw, 40px) 20px;
            color: var(--v-text-dim);
        }

        .empty-state .icon {
            font-size: clamp(28px, 8vw, 40px);
            margin-bottom: 12px;
        }

        /* Rarity colors: use .v-rarity-* from valdoria-design.css */

        /* Animations */
        .fade-in {
            animation: v-fadeIn 0.3s ease;
        }
    </style>
    <script>
    document.write('<script src="../shared/font-apply.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/bounce-back.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/haptic.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/webapp-init.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/exit-confirm.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/encoding-utils.js?v=' + v + '"><\/script>');
    document.write('<script src="../shared/session-heartbeat.js?v=' + v + '"><\/script>');
    </script>
</head>

<body>
    <!-- Processing overlay injected by shared/processing-overlay.js -->

    <!-- Loading controller -->
    <script>
    (function() {
        var TIPS = [
            'O calor da forja aquece seu rosto enquanto as brasas crepitam...',
            'Ferramentas de artesão se alinham na bancada, prontas para o trabalho...',
            'O som ritmado do martelo na bigorna ecoa pela oficina...',
            'Fumaça sobe em espirais enquanto o fole alimenta as chamas...',
            'Moldes e fôrmas de metal se alinham nas prateleiras empoeiradas...',
            'O cheiro de metal quente e carvão preenche o ar da oficina...',
            'Runas arcanas brilham fracamente nos instrumentos do artesão...',
            'Lingotes de diferentes metais aguardam para serem transformados...',
            '🔨 Dica: Receitas melhores exigem materiais mais raros.',
            '🛡️ Dica: Itens forjados podem ter atributos únicos.',
            '🔨 Dica: Gemas podem ser encaixadas em equipamentos com soquetes.',
            '🛡️ Dica: Runas adicionam propriedades mágicas aos itens.',
            '🔨 Dica: Desmontar itens recupera parte dos materiais.',
            '🛡️ Dica: Nível do personagem desbloqueia receitas mais avançadas.',
            '🔨 Dica: Materiais raros podem ser encontrados em masmorras e trilhas.',
            '🛡️ Dica: Equipamentos forjados são sempre melhores que os comprados.',
        ];
        window._wsLoadingCtrl = ValdoriaLoadingController({
            overlayId: 'loading',
            tips: TIPS
        });
    })();
    </script>

    <div class="header">
        <h1>⚒️ OFICINA DE ARTESANATO</h1>
        <div class="stats" id="headerStats">Carregando...</div>
    </div>
    <div class="tabs" id="tabsContainer"></div>
    <div class="content" id="mainContent"></div>
    <div class="craft-btn-container" id="craftBtnContainer" style="display:none;">
        <button class="craft-btn disabled" id="craftBtn" disabled>🔨 Selecione uma receita</button>
    </div>

    <script>
    document.write('<script src="../shared/fetch-utils.js?v=' + v + '"><\/script>');
    </script>
    <script>
        const tg = window.Telegram?.WebApp;
        const _vBg = getComputedStyle(document.documentElement).getPropertyValue('--v-bg').trim() || '#2a2420';

        // Parse URL params for navigation
        const _wsParams = new URLSearchParams(window.location.search);
        const _wsApi = _wsParams.get('api') || '';
        const _wsUid = _wsParams.get('uid') || '';
        const _wsToken = _wsParams.get('token') || '';
        const _wsReturn = _wsParams.get('return') || 'game';

        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor(_vBg);
            tg.setBackgroundColor(_vBg);
            if (tg.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(() => { _navigateBack(); });
            }
        }

        // ── Shared Error Reporter ──
        if (window.ValdoriaErrors) {
            ValdoriaErrors.init({ appName: 'WORKSTATION', apiBase: _wsApi, token: _wsToken, uid: _wsUid });
        }

        async function _navigateBack() {
            if (_wsApi && _wsToken) {
                const h = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + _wsToken };
                if (window.Telegram?.WebApp?.initData) h['X-Telegram-Init-Data'] = Telegram.WebApp.initData;
                h['X-Idempotency-Key'] = crypto.randomUUID();
                try {
                    const r = await fetchT(_wsApi + '/api/webapp/transition', {
                        method: 'POST', headers: h,
                        body: JSON.stringify({ from: 'workstation', to: _wsReturn, user_id: parseInt(_wsUid), payload: {} })
                    });
                    const d = await r.json();
                    if (d.url) { window.__valdoria_transitioning = true; window.location.replace(d.url); return; }
                } catch (e) { console.error('[WORKSTATION] transition error:', e); }
            }
            try { if (tg) tg.close(); } catch (e) { console.warn('[WORKSTATION] tg.close:', e); }
        }

        let PAYLOAD = null;
        let selectedRecipe = null;
        let activeTab = null;

        const RARITY_LABELS = {
            common: 'Comum', uncommon: 'Incomum', rare: 'Raro',
            very_rare: 'Muito Raro', legendary: 'Lendário',
        };

        // ── Parse URL params ──

        function init() {
            const params = new URLSearchParams(window.location.search);
            const dataB64 = params.get('data');

            if (!dataB64) {
                _showInitError('Dados não encontrados.');
                return;
            }

            try {
                const json = decodeBase64Utf8(dataB64);
                PAYLOAD = JSON.parse(json);
            } catch (e) {
                console.error('[WORKSTATION] Erro ao decodificar dados', e);
                _showInitError('Erro ao decodificar dados.');
                return;
            }

            updateHeader();
            buildTabs();
        }

        function _showInitError(msg) {
            console.error('[WORKSTATION]', msg);
            document.getElementById('mainContent').innerHTML =
                `<div class="empty-state"><div class="icon">⚠️</div><p>${msg}</p></div>`;
        }

        function updateHeader() {
            const stats = document.getElementById('headerStats');
            const matCount = Object.values(PAYLOAD.materials).reduce((a, b) => a + b, 0);
            stats.textContent = `💰 ${PAYLOAD.gold} GP · 📦 ${matCount} materiais · Lv.${PAYLOAD.level}`;
        }

        // ── Tabs ──
        function buildTabs() {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = '';
            const toolKeys = Object.keys(PAYLOAD.tools);

            toolKeys.forEach((tk, i) => {
                const t = PAYLOAD.tools[tk];
                const tab = document.createElement('div');
                tab.className = 'tab' + (i === 0 ? ' active' : '');
                tab.textContent = `${t.emoji} ${t.name}`;
                tab.onclick = () => selectTab(tk, tab);
                container.appendChild(tab);
            });

            const matTab = document.createElement('div');
            matTab.className = 'tab';
            matTab.textContent = '📦 Materiais';
            matTab.onclick = () => selectTab('_materials', matTab);
            container.appendChild(matTab);

            if (toolKeys.length > 0) {
                selectTab(toolKeys[0], container.children[0]);
            } else {
                selectTab('_materials', matTab);
            }
        }

        function selectTab(key, tabEl) {
            activeTab = key;
            selectedRecipe = null;
            updateCraftButton();

            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tabEl.classList.add('active');

            if (key === '_materials') {
                renderMaterials();
            } else {
                renderRecipes(key);
            }
        }

        // ── Recipes ──
        function renderRecipes(toolKey) {
            const content = document.getElementById('mainContent');
            const recipes = PAYLOAD.recipes.filter(r => r.tool === toolKey);

            if (!recipes.length) {
                content.innerHTML = '<div class="empty-state"><div class="icon">📜</div>' +
                    '<p>Nenhuma receita disponível para esta ferramenta no seu nível.</p></div>';
                document.getElementById('craftBtnContainer').style.display = 'none';
                return;
            }

            document.getElementById('craftBtnContainer').style.display = 'block';

            let html = '';
            recipes.forEach(r => {
                const ready = r.has_materials && r.can_afford;
                const cls = ready ? 'craftable' : 'missing';
                const badge = ready
                    ? '<span class="recipe-badge badge-ready">✅ Pronto</span>'
                    : '<span class="recipe-badge badge-missing">❌ Falta</span>';

                html += `
            <div class="recipe-card ${cls} fade-in" data-id="${r.id}" onclick="selectRecipeCard('${r.id}')">
                <div class="recipe-header">
                    <span class="recipe-name">${r.name}</span>
                    ${badge}
                </div>
                <div class="recipe-meta">
                    <span>Lv.${r.min_level}</span>
                    <span>DC ${r.dc}</span>
                    <span>💰 ${r.cost_gp} GP</span>
                    <span class="v-rarity-${r.rarity}">${RARITY_LABELS[r.rarity] || r.rarity}</span>
                </div>
            </div>
            <div class="detail-panel" id="detail-${r.id}">
                ${buildDetailHTML(r)}
            </div>`;
            });

            content.innerHTML = html;
        }

        function buildDetailHTML(recipe) {
            let ingHTML = '';
            recipe.ingredients.forEach(ing => {
                const have = PAYLOAD.materials[ing.item] || 0;
                const ok = have >= ing.qty;
                const icon = ok ? '✅' : '❌';
                ingHTML += `<div class="ingredient-row">
                <span><span class="ing-status">${icon}</span> ${ing.item}</span>
                <span>${have}/${ing.qty}</span>
            </div>`;
            });

            const goldOk = PAYLOAD.gold >= recipe.cost_gp;
            const goldIcon = goldOk ? '✅' : '❌';

            return `
            <div class="detail-title">📋 ${recipe.name}</div>
            <div style="font-size:13px;color:var(--v-text-dim);margin-bottom:8px;">
                Resultado: <b>${recipe.output_qty}× ${recipe.output}</b>
            </div>
            <div style="font-size:12px;color:var(--v-text-dim);margin-bottom:10px;">
                <b>Ingredientes:</b>
            </div>
            ${ingHTML}
            <div class="gold-row">
                <span>${goldIcon} Custo</span>
                <span>${recipe.cost_gp} GP (você: ${PAYLOAD.gold} GP)</span>
            </div>
        `;
        }

        function selectRecipeCard(recipeId) {
            if (selectedRecipe === recipeId) {
                selectedRecipe = null;
            } else {
                selectedRecipe = recipeId;
            }

            document.querySelectorAll('.recipe-card').forEach(c => {
                c.classList.toggle('selected', c.dataset.id === selectedRecipe);
            });

            document.querySelectorAll('.detail-panel').forEach(p => {
                p.classList.toggle('visible', p.id === `detail-${selectedRecipe}`);
            });

            updateCraftButton();

            if (selectedRecipe) {
                const detail = document.getElementById(`detail-${selectedRecipe}`);
                if (detail) {
                    setTimeout(() => detail.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
                }
            }
        }

        function updateCraftButton() {
            const btn = document.getElementById('craftBtn');
            const container = document.getElementById('craftBtnContainer');

            if (!selectedRecipe) {
                btn.className = 'craft-btn disabled';
                btn.disabled = true;
                btn.textContent = '🔨 Selecione uma receita';
                return;
            }

            const recipe = PAYLOAD.recipes.find(r => r.id === selectedRecipe);
            if (!recipe) return;

            const ready = recipe.has_materials && recipe.can_afford;
            if (ready) {
                btn.className = 'craft-btn enabled';
                btn.disabled = false;
                btn.textContent = `🔨 Fabricar ${recipe.name}`;
                btn.onclick = () => executeCraft(recipe.id);
            } else {
                btn.className = 'craft-btn disabled';
                btn.disabled = true;
                const missing = recipe.missing.length > 0
                    ? `Falta: ${recipe.missing.join(', ')}`
                    : `Ouro insuficiente`;
                btn.textContent = `❌ ${missing}`;
            }
        }

        async function executeCraft(recipeId) {
            const btn = document.getElementById('craftBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Fabricando...';
            btn.className = 'craft-btn disabled';

            const params = new URLSearchParams(window.location.search);
            const token = params.get('token') || '';
            const _apiBase = params.get('api') || '';
            const _apiUid = params.get('uid') || '';

            const payload = { action: 'craft_complete', recipe_id: recipeId, token: token };

            // Primary: fetch() to API endpoint (reliable from InlineKeyboardButton Mini Apps)
            if (_apiBase && token && _apiUid) {
                try {
                    const _ch = { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
                    if (tg?.initData) _ch['X-Telegram-Init-Data'] = tg.initData;
                    _ch['X-Idempotency-Key'] = crypto.randomUUID();
                    const _ac = new AbortController();
                    const _tid = setTimeout(() => _ac.abort(), 15000);
                    const resp = await fetch(`${_apiBase}/api/craft/apply`, {
                        method: 'POST', headers: _ch,
                        signal: _ac.signal, body: JSON.stringify({ user_id: parseInt(_apiUid), token, recipe_id: recipeId })
                    });
                    if (resp.ok) {
                        console.log('[WORKSTATION] Craft submitted via API');
                        setTimeout(() => { try { tg?.close(); } catch (e) { } }, 300);
                        return;
                    }
                    console.warn('[WORKSTATION] API returned', resp.status, '— falling back to sendData');
                } catch (e) {
                    console.warn('[WORKSTATION] API fetch failed — falling back to sendData', e);
                }
            }

            // Fallback: sendData (works from KeyboardButton web_app but unreliable from InlineKeyboardButton)
            if (tg) {
                tg.sendData(JSON.stringify(payload));
                setTimeout(() => { try { tg.close(); } catch (e) { console.warn('[WORKSTATION] tg.close:', e); } }, 300);
            }
        }

        // ── Materials ──
        function renderMaterials() {
            const content = document.getElementById('mainContent');
            document.getElementById('craftBtnContainer').style.display = 'none';

            const mats = PAYLOAD.materials;
            const entries = Object.entries(mats).sort((a, b) => a[0].localeCompare(b[0]));

            if (!entries.length) {
                content.innerHTML = '<div class="empty-state"><div class="icon">📦</div>' +
                    '<p>Nenhum material no inventário.</p>' +
                    '<p style="font-size:12px;margin-top:8px;">Colete materiais na Oficina ou durante explorações.</p></div>';
                return;
            }

            let html = '';
            entries.forEach(([name, qty]) => {
                html += `<div class="material-row fade-in">
                <span>${name}</span>
                <span class="material-qty">×${qty}</span>
            </div>`;
            });

            content.innerHTML = html;
        }

        // ── Boot ──
        init();
        if (window._wsLoadingCtrl) window._wsLoadingCtrl.hide();
    </script>
</body>
