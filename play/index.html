<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#2a2420">
<title>Lendas de Valdoria — Carregando…</title>
<style>html,body{margin:0;padding:0;background:#1a1510;color:#d4c8b0;height:100%;overflow:hidden}</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- 2026-05-11 (user request): "/play/ tambem deve redirecionar para tela de
     autenticacao caso nao esteja autenticado". Auth gate roda ANTES da
     logica de /play/ pra redirect instantaneo sem 700ms delay. Telegram
     users com initData passam normalmente (check 1). -->
<script src="/shared/auth-gate.js"></script>
<!-- Tiered Cache (see docs/sistemas/cache-strategy.md) -->
<script src="/bundle-version.js"></script>
<script>
// Carrega CSS canonical + scripts (loading-title.js para TOQUE PARA INICIAR,
// loading-template.js para magic-circle overlay durante auth+state)
// Tiered Cache: stable bundle hash for Bucket B asset query strings
var v = (window.VBUNDLE_HASH || Date.now());
document.write('<link rel="stylesheet" href="/valdoria-design.css?v=' + v + '">');
document.write('<link rel="stylesheet" href="/shared/loading.css?v=' + v + '">');
document.write('<link rel="stylesheet" href="/shared/loading-title.css?v=' + v + '">');
document.write('<link rel="stylesheet" href="/shared/fonts.css?v=' + v + '">');
document.write('<script src="/shared/loading-title.js?v=' + v + '"><\/script>');
document.write('<script src="/shared/loading-template.js?v=' + v + '"><\/script>');
document.write('<script src="/shared/loading-guard.js?v=' + v + '"><\/script>');
document.write('<script src="/shared/loading-controller.js?v=' + v + '"><\/script>');
/* 2026-05-18 BUG FIX (preflight check_webapp_audio_manager): /play/ era o unico
   WebApp sem audio-manager.js, quebrando a continuidade musical (Music Continuity
   IMMUTABLE RULE). Sem o resume automatico (~50ms), o player tinha pausa silenciosa
   ao chegar em /play/ durante transicoes entre WebApps. */
document.write('<script src="/shared/audio-manager.js?v=' + v + '"><\/script>');
</script>
</head>
<body>
<!-- Placeholder escuro (regra No Hardcoded SVG in HTML Body — popular via JS apos CSS carregar) -->
<div id="loading" class="loading-overlay" style="background:#1a1510;display:none" aria-busy="true"></div>
<script>
(function(){
  // === LINK PERMANENTE (entry point unico) =================================
  // Fluxo:
  // 1. ValdoriaTitleScreen mostra "TOQUE PARA INICIAR" (esfera bonita AAA)
  // 2. User toca → onStart callback:
  //    a) Esconde title screen
  //    b) Mostra magic-circle como overlay (esfera animada + runas + particles)
  //    c) Autentica via Telegram initData
  //    d) Busca last_screen_payload
  //    e) Redireciona pra ultima tela (cidade/explore/combat/levelup/prologue)
  // Doc: docs/sistemas/INDEX_AGENTE_IA.md "ENTRY POINTS PERMANENTES"

  // 1. Detect env from hostname (NEVER trust query params — Telegram cache vazado)
  var h = (location.hostname || '').toLowerCase();
  var env = '';
  var apiHost = '';
  if (h === 'jogo.lendasdevaldoria.com.br' || h === 'www.jogo.lendasdevaldoria.com.br'){
    env = 'prod'; apiHost = 'https://prod.lendasdevaldoria.com.br';
  } else if (h === 'dev.lendasdevaldoria.com.br'){
    env = 'dev'; apiHost = 'https://api.lendasdevaldoria.com.br';
  } else {
    try { env = new URLSearchParams(location.search).get('env') || 'prod'; } catch(_e) { env = 'prod'; }
    apiHost = (env === 'dev') ? 'https://api.lendasdevaldoria.com.br' : 'https://prod.lendasdevaldoria.com.br';
  }

  // === SERVER-SIDE LOGGING via sendBeacon ==================================
  function sendLog(level, msg, extra){
    try {
      var payload = {entries:[{area:'play', level:level||'info', msg:msg||'', ts:Date.now(), extra:extra||null,
        ua:(navigator&&navigator.userAgent||'').slice(0,200), href:(location.href||'').slice(0,300),
        tg_platform:(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.platform)||'',
        tg_version:(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.version)||''}], env:env};
      var url = apiHost + '/api/sim/log';
      var body = JSON.stringify(payload);
      if (navigator && navigator.sendBeacon){
        navigator.sendBeacon(url, new Blob([body], {type:'application/json'}));
      } else {
        fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:body, keepalive:true}).catch(function(){});
      }
    } catch(_e){}
  }
  window.addEventListener('error', function(e){ sendLog('error', 'window.error: '+(e&&e.message), {filename:e&&e.filename, lineno:e&&e.lineno, stack:e&&e.error&&e.error.stack&&String(e.error.stack).slice(0,500)}); });
  window.addEventListener('unhandledrejection', function(e){ var r=e&&e.reason; sendLog('error', 'unhandled_rejection: '+(r&&(r.message||r)), {stack:r&&r.stack&&String(r.stack).slice(0,500)}); });
  sendLog('info', 'play_boot', {hostname:h, env:env, apiHost:apiHost, search:location.search});

  // === Loading controller (barra animada + cinematic exit) ================
  // Tips agnosticos ao destino — NUNCA dizer "cidade"/"exploracao"/"combate"
  // (player pode estar voltando pra qualquer um deles, e a /play/ nao deve
  // expor o destino antes da transicao).
  function _ensureController(){
    if (window._ctrl) return window._ctrl;
    if (typeof window.ValdoriaLoadingController !== 'function') return null;
    window._ctrl = window.ValdoriaLoadingController({
      overlayId: 'loading',
      tips: [
        'Conectando aos ventos de Valdória…',
        'Reunindo seu grupo…',
        'Consultando o Mestre…',
        'Despertando os runeiros…',
        'Buscando o caminho…'
      ],
      allowOnRevisit: true  // /play/ é entry point, sempre mostrar
    });
    return window._ctrl;
  }
  function setStage(msg){ var el = document.getElementById('loading-stage'); if (el) el.textContent = msg || ''; }
  function setTip(msg){ var el = document.getElementById('loading-tip'); if (el) el.textContent = msg || ''; }

  // X-6.5.51AZ (2026-05-11): Epic AAA progress animator — 0→100% em pelo
  // menos 5s mesmo se auth+state forem instantâneos, com easeOutCubic e
  // contador visível. Antes setProgress(15) → setProgress(100) ocorria em
  // <1s e player via "Pronto" antes da barra encher. Agora bar ganha
  // protagonismo cinematográfico.
  var _epicState = {
    startTs: 0,
    minMs: 5000,            // 5s mínimo
    softCapMs: 9000,        // depois disso, libera 100% mesmo sem data
    dataReady: false,       // true quando auth+state terminaram
    redirectUrl: null,
    currentPct: 0,
    rafId: null,
    pctEl: null,
    barEl: null,
    lastStageIdx: -1,
    burstAt: { 25: false, 50: false, 75: false, 100: false }
  };
  // Estágios (label) por faixa de progresso — agnósticos ao destino.
  var _epicStages = [
    { from: 0,   to: 18,  label: 'Conectando aos ventos…' },
    { from: 18,  to: 38,  label: 'Autenticando…' },
    { from: 38,  to: 58,  label: 'Despertando runeiros…' },
    { from: 58,  to: 78,  label: 'Restaurando jornada…' },
    { from: 78,  to: 95,  label: 'Reunindo seu grupo…' },
    { from: 95,  to: 101, label: 'Pronto…' }
  ];
  function _epicStageFor(pct){
    for (var i = 0; i < _epicStages.length; i++){
      var s = _epicStages[i];
      if (pct >= s.from && pct < s.to) return { idx: i, label: s.label };
    }
    return { idx: _epicStages.length - 1, label: _epicStages[_epicStages.length - 1].label };
  }
  // Easing canonical (easeOutCubic — começo rápido, fim suave)
  function _easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
  // Burst de partículas em milestones (25%, 50%, 75%, 100%)
  function _milestoneBurst(pct){
    var keys = [25, 50, 75, 100];
    for (var i = 0; i < keys.length; i++){
      var k = keys[i];
      if (pct >= k && !_epicState.burstAt[k]){
        _epicState.burstAt[k] = true;
        var ov = document.getElementById('loading');
        if (!ov) continue;
        // 6 partículas saindo do centro da barra
        var rect = ov.querySelector('.loading-progress-track');
        if (!rect) continue;
        for (var n = 0; n < 6; n++){
          var sp = document.createElement('div');
          sp.className = 'epic-burst';
          sp.style.cssText = 'position:absolute;left:50%;top:50%;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle,#ffe190,#c4953a 60%,transparent);pointer-events:none;'
            + 'animation:epicBurst 0.8s ease-out forwards;'
            + '--bx:' + (Math.cos(n * Math.PI / 3) * 80) + 'px;'
            + '--by:' + (Math.sin(n * Math.PI / 3) * 80) + 'px;';
          rect.appendChild(sp);
          setTimeout((function(el){ return function(){ try { el.remove(); } catch(_){} }; })(sp), 900);
        }
      }
    }
  }
  function _renderEpicProgress(pct){
    pct = Math.max(0, Math.min(100, pct));
    var ctrl = _ensureController();
    var stage = _epicStageFor(pct);
    // Atualiza stage text APENAS quando muda (evita re-trigger animation)
    if (stage.idx !== _epicState.lastStageIdx){
      _epicState.lastStageIdx = stage.idx;
      if (ctrl && ctrl.setProgress) ctrl.setProgress(pct, stage.label);
      else setStage(stage.label);
    } else {
      if (ctrl && ctrl.setProgress) ctrl.setProgress(pct);
    }
    // Atualiza % counter (criado em _showMagicCircle)
    if (_epicState.pctEl){
      _epicState.pctEl.textContent = Math.round(pct) + '%';
    }
    _epicState.currentPct = pct;
    _milestoneBurst(pct);
  }
  function _startEpicTicker(){
    if (_epicState.rafId) return;
    _epicState.startTs = Date.now();
    _epicState.pctEl = document.getElementById('epic-pct');
    function tick(){
      var elapsed = Date.now() - _epicState.startTs;
      var minProgress = Math.min(1, elapsed / _epicState.minMs);
      var softTimeout = elapsed >= _epicState.softCapMs;  // após 9s, libera mesmo sem data
      var targetPct;
      if (_epicState.dataReady || softTimeout){
        // Data pronta OU softTimeout: pode ir até 100%, mas respeitando easing
        // Curva: começa easeOutCubic até 90% pelo minMs, depois ramp suave 90→100
        var t = Math.min(1, elapsed / _epicState.minMs);
        var ease = _easeOutCubic(t);
        if (t >= 1){
          // Tempo mínimo já passou — vai pra 100% suavemente
          targetPct = Math.min(100, _epicState.currentPct + 1.2);
        } else {
          targetPct = ease * 95; // cap em 95% até minMs completar
        }
      } else {
        // Data NÃO pronta — segura em 90% máximo (espera state response)
        var t2 = Math.min(1, elapsed / _epicState.minMs);
        var ease2 = _easeOutCubic(t2);
        targetPct = Math.min(90, ease2 * 95);
      }
      _renderEpicProgress(targetPct);
      // Done?
      if (_epicState.dataReady && _epicState.currentPct >= 99.5 && _epicState.redirectUrl){
        _epicState.rafId = null;
        // Pequeno hold em 100% pra player ler "Pronto…"
        setTimeout(function(){ _doRedirectInner(_epicState.redirectUrl); }, 320);
        return;
      }
      _epicState.rafId = requestAnimationFrame(tick);
    }
    _epicState.rafId = requestAnimationFrame(tick);
  }
  function _markDataReady(url){
    _epicState.dataReady = true;
    _epicState.redirectUrl = url;
    sendLog('info', 'epic_data_ready', {elapsed: Date.now() - _epicState.startTs, currentPct: _epicState.currentPct});
  }
  function setProgress(pct, msg){
    // Legacy compat — chamadas explícitas viram apenas hints, o ticker manda.
    // setProgress(15) seta floor mínimo se ticker ainda não passou daí.
    if (pct >= _epicState.currentPct){
      // Avança o stage label imediatamente, mas mantém o pct sob controle do ticker.
      var ctrl = _ensureController();
      if (ctrl && ctrl.setProgress && msg) ctrl.setProgress(_epicState.currentPct, msg);
      else if (msg) setStage(msg);
    }
  }
  function _doRedirectInner(url){
    var ctrl = _ensureController();
    var go = function(){
      window.__valdoria_transitioning = true;
      window.location.replace(url);
    };
    if (ctrl && ctrl.setProgress) ctrl.setProgress(100, 'Pronto…');
    if (ctrl && ctrl.hide) ctrl.hide(go);
    else setTimeout(go, 350);
  }
  function _doRedirect(url){
    _markDataReady(url);
  }

  function _showMagicCircle(){
    // Popular overlay com magic-circle canonical
    var _ld = document.getElementById('loading');
    if (!_ld || typeof window.ValdoriaLoadingHTML !== 'function') return;
    var _tmp = document.createElement('div');
    _tmp.innerHTML = ValdoriaLoadingHTML({
      overlayId: 'loading',
      title: 'LENDAS DE VALDORIA',
      particleSet: 'standard',
      defaultTip: 'Conectando aos ventos de Valdória…',
      hasRetry: false,
      hasStage: true,
      icon: 'magic-circle',
    });
    var _overlay = _tmp.firstElementChild;
    if (_overlay) {
      _overlay.style.background = '#1a1510';
      _overlay.style.display = '';  // remove display:none do placeholder
      _ld.parentNode.replaceChild(_overlay, _ld);
    }
    // X-6.5.51AZ (2026-05-11): injeta % counter + CSS animations épicas
    // (epicBurst pra partículas em milestones, epicPctGlow pra pulse do
    // número). Inserido APÓS a track de progress pra player ver o número.
    var newOv = document.getElementById('loading');
    if (newOv){
      // CSS animations injetadas inline (não dependem de loading.css)
      var st = document.createElement('style');
      st.textContent = ''
        + '@keyframes epicBurst{0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(1);}100%{opacity:0;transform:translate(-50%,-50%) translate(var(--bx),var(--by)) scale(0.2);}}'
        + '@keyframes epicPctGlow{0%,100%{text-shadow:0 0 8px rgba(196,149,58,0.6),0 0 18px rgba(255,200,90,0.35);}50%{text-shadow:0 0 14px rgba(255,215,140,0.85),0 0 28px rgba(255,180,90,0.55);}}'
        + '@keyframes epicBarShimmer{0%{background-position:-200px 0;}100%{background-position:200px 0;}}'
        + '#epic-pct{position:relative;font-family:var(--v-font-display,Cinzel,serif);font-size:28px;font-weight:700;color:#ffd070;letter-spacing:2px;text-align:center;margin-top:14px;animation:epicPctGlow 1.6s ease-in-out infinite;line-height:1;text-shadow:0 0 8px rgba(196,149,58,0.6);}'
        + '#epic-pct::after{content:"";display:block;width:42px;height:2px;background:linear-gradient(90deg,transparent,#c4953a,transparent);margin:5px auto 0;opacity:0.7;}'
        + '.loading-progress-track{position:relative;}'
        + '.loading-progress-fill{background:linear-gradient(90deg,#8a5a20 0%,#c4953a 30%,#ffd700 60%,#ffe9a0 100%) !important;box-shadow:0 0 8px rgba(255,215,0,0.55),inset 0 1px 1px rgba(255,255,255,0.4) !important;position:relative;transition:width 0.18s linear !important;}'
        + '.loading-progress-fill::after{content:"";position:absolute;top:0;right:0;width:14px;height:100%;background:linear-gradient(90deg,transparent,rgba(255,235,160,0.9),transparent);animation:epicBarShimmer 1.6s linear infinite;filter:blur(2px);}'
        ;
      newOv.appendChild(st);
      // % counter (após a track de progress)
      var pctEl = document.createElement('div');
      pctEl.id = 'epic-pct';
      pctEl.textContent = '0%';
      var track = newOv.querySelector('.loading-progress-wrap');
      if (track && track.parentNode){
        track.parentNode.insertBefore(pctEl, track.nextSibling);
      } else {
        newOv.appendChild(pctEl);
      }
    }
    // Inicializa o controller AGORA que .loading-stage e .loading-progress
    // existem no DOM. Sem isso, a barra fica em 0% e some de uma vez no
    // redirect (bug reportado pelo user 2026-05-10).
    _ensureController();
    // X-6.5.51AZ: dispara o RAF ticker épico imediatamente após mostrar
    // o magic-circle. Ticker roda em paralelo com auth+state e respeita
    // tempo mínimo de 5s antes de fechar 100%.
    _startEpicTicker();
  }

  function gotoCidade(extra){
    var q = new URLSearchParams(extra || '');
    q.set('env', env);
    q.set('_cb', String(Date.now()));
    sendLog('info', 'redirect_cidade_fallback');
    _doRedirect('/cidade/?' + q.toString());
  }

  // === Auth + state + redirect (rodado depois de TOQUE PARA INICIAR) =======
  // Stages SEMPRE agnosticos ao destino — o player pode estar voltando pra
  // cidade/exploracao/combate/levelup/prologo, e a /play/ NAO deve expor isso
  // antes da transicao (regra do user 2026-05-10).
  function runAuthAndRedirect(){
    _showMagicCircle();
    setProgress(15, 'Autenticando…');

    var tg = window.Telegram && window.Telegram.WebApp;
    if (tg && typeof tg.ready === 'function') {
      try { tg.ready(); } catch(_e){}
      try { tg.expand && tg.expand(); } catch(_e){}
    }
    var initData = (tg && tg.initData) || '';
    sendLog('info', 'initData_check', {present: !!initData, length: initData.length});

    if (!initData) {
      /* 2026-05-11 (user request): /play/ sem initData = navegador direto.
         Redireciona pra /web/ (tela de autenticacao Telegram/Google) em vez
         de tentar cidade sem sessão. Mantem suporte a links com ?token=&uid=
         (gotoCidade) — se URL tiver token, segue pra cidade; sem token,
         vai pra auth. */
      var hasUrlToken = (new URLSearchParams(window.location.search)).get('token');
      if (hasUrlToken) {
        setTip('Restaurando sessão…');
        setProgress(35, 'Restaurando sessão…');
        setTimeout(gotoCidade, 1200);
        return;
      }
      setTip('Entre via Telegram ou Google');
      setProgress(35, 'Redirecionando para login…');
      sendLog('info', 'no_initdata_redirect_to_web');
      setTimeout(function () {
        try { window.__valdoria_transitioning = true; } catch (e) {}
        window.location.replace('/web/');
      }, 700);
      return;
    }

    setProgress(30, 'Autenticando…');
    setTip('Conectando aos ventos de Valdória…');
    sendLog('info', 'init_session_request', {host: apiHost});

    fetch(apiHost + '/api/game/init-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Telegram-Init-Data': initData },
      body: '{}',
      cache: 'no-store',
      credentials: 'omit'
    })
    .then(function(r){
      sendLog('info', 'init_session_response', {status: r.status, ok: r.ok});
      if (!r.ok) throw new Error('init-session HTTP ' + r.status);
      setProgress(50, 'Autenticando…');
      return r.json();
    })
    .then(function(auth){
      sendLog('info', 'init_session_parsed', {has_token: !!(auth && auth.token), env_returned: auth && auth.env, char_id: auth && auth.char_id});
      if (!auth || !auth.token || !auth.user_id) throw new Error('auth invalida');
      if (auth.env && auth.env !== env) throw new Error('Cross-env: host=' + env + ' server=' + auth.env);
      var apiBase = (auth.api || apiHost).replace(/\/+$/, '');

      setProgress(65, 'Restaurando jornada…');
      setTip('Buscando seu personagem…');
      sendLog('info', 'state_request', {api_base: apiBase, uid: auth.user_id});

      return fetch(apiBase + '/api/game/state', {
        method: 'POST',
        headers: {'Authorization': 'Bearer ' + auth.token, 'Content-Type': 'application/json'},
        body: JSON.stringify({user_id: auth.user_id}),
        cache: 'no-store',
        credentials: 'omit'
      })
      .then(function(r){
        sendLog('info', 'state_response', {status: r.status, ok: r.ok});
        if (!r.ok && r.status !== 204) throw new Error('state HTTP ' + r.status);
        setProgress(85, 'Restaurando jornada…');
        if (r.status === 204) return null;
        return r.json();
      })
      .then(function(state){
        var qs = new URLSearchParams();
        qs.set('token', auth.token);
        qs.set('api', apiBase);
        qs.set('uid', String(auth.user_id));
        if (auth.char_id) qs.set('char', auth.char_id);
        qs.set('env', env);
        qs.set('_cb', String(Date.now()));
        // /play/ ja faz TOQUE PARA INICIAR — pula intro na cidade (evita 2x)
        qs.set('nointro', '1');
        sendLog('info', 'state_parsed', {has_transition: !!(state && state.transition), transition_to: state && state.transition && state.transition.to});

        if (state && state.transition && state.transition.to){
          var to = String(state.transition.to);
          var serverUrl = state.transition.url;
          if (serverUrl){
            sendLog('info', 'redirect_serverUrl', {url: serverUrl.slice(0, 200)});
            _doRedirect(serverUrl);
            return;
          }
          var dest = null;
          // Stages NAO mencionam o destino — usuario pode estar voltando pra
          // qualquer area. Mensagem fica generica ate o redirect.
          if (to === 'explore' || to === 'exploration') dest = '/exploracao/exploracao.html';
          else if (to === 'combat' || to === 'combat2') dest = '/combat2/combate.html';
          else if (to === 'levelup') dest = '/levelup/';
          else if (to === 'prologue' || to === 'prologo') dest = '/prologue/';
          else if (to === 'cidade' || to === 'city') dest = '/cidade/';
          if (dest){
            sendLog('info', 'redirect_dest', {dest: dest, to: to});
            _doRedirect(dest + '?' + qs.toString());
            return;
          }
          sendLog('warn', 'unknown_transition_to', {to: to});
        }

        sendLog('info', 'redirect_default_cidade');
        _doRedirect('/cidade/?' + qs.toString());
      });
    })
    .catch(function(err){
      var msg = (err && err.message) || String(err);
      sendLog('error', 'auto_load_failed: ' + msg, {stack: err && err.stack && String(err.stack).slice(0, 500)});
      setStage('Falha ao restaurar');
      setTip(msg);
      setTimeout(gotoCidade, 1800);
    });
  }

  // === TOQUE PARA INICIAR (sempre primeiro) ================================
  // ValdoriaTitleScreen renderiza esfera AAA com runas + "Toque para iniciar"
  // (gesto do user destrava autoplay de audio na pagina destino).
  function _showTitleScreen(){
    if (typeof window.ValdoriaTitleScreen !== 'function'){
      // loading-title.js ainda nao carregou — retry
      setTimeout(_showTitleScreen, 80);
      return;
    }
    var title = window.ValdoriaTitleScreen({
      onStart: function(){
        sendLog('info', 'title_tapped');
        runAuthAndRedirect();
      }
    });
    title.show();
    sendLog('info', 'title_shown');
  }
  _showTitleScreen();
})();
</script>
<noscript>
  <p style="text-align:center;color:#c4953a;padding:24px;">JavaScript precisa estar habilitado. <a href="/cidade/">Continuar para a cidade</a></p>
</noscript>
</body>
</html>
